<!doctype html>
<!-- NIOGEN | docs/placar.html | 22/11/2026 — Claude Code (Fable 5.2)
     Placar: como está o dia e como vai o mês (Ricardo, 22/11: "Para eu acompanhar" · "pra eu saber como está e o dia, entre
     outras informações"). Tela nova do novo layout (passo 6 — especificação aprovada em 22/11, protótipo das sete telas).
     Só leitura. Admin e backoffice (Ricardo, 22/11).
       · HOJE: cinco números, cada um com o de ontem ao lado.
       · O MÊS (faixa fina): instaladas × meta · quanto falta por dia · ritmo e projeção · comissão · e, a pedido do Ricardo
         em 22/11, comparação com o mês passado, custo por venda de anúncio e conversão do mês.
       · Vendas por dia (OS geradas em cada dia do mês).
       · Quebras: por vendedor · origem · plano · forma de pagamento · cidade (Ricardo, 22/11: "Por cidade").
     Venda = OS gerada, pela data da OS (o critério das telas Vendas, Instalações e Meta Ads). A META do mês é de INSTALADAS
     e vem do mesmo lugar que o Painel usa (RPC painel_meta_ritmo) — os dois nunca divergem; o Painel não mudou.
     Dados, numa rodada só (regra 19): v_vendas + v_os_andamento + config_planos (NGVendasOS.carregar), painel_meta_ritmo,
     config_metas, mari_conversas (só datas e motivo do handoff) e v_meta_ads_dia. Nenhuma gravação, sem consulta nova no banco. -->

<style>
  /* 22/11 (Ricardo: "vários cards soltos ou gráficos em barras, tudo jogado"): a tela passa a ter TRÊS blocos, cada um num
     painel só, com as divisões por fio (sem caixa dentro de caixa): Hoje · O mês (meta + curva + números) · De onde vêm. */
  .pc-h2 { margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .pc-h2 em { font-style: normal; font-weight: 500; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  .pc-bloco { display: flex; flex-direction: column; margin-top: 6px; }
  .pc-painel { border-radius: 14px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; }
  /* células em linha, separadas por fio; quebram sem deixar buraco */
  .pc-cels { display: flex; flex-wrap: wrap; }
  .pc-cel { flex: 1 1 190px; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 18px; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); }
  .pc-cel > span { font-size: 12px; color: var(--muted); }
  .pc-cel > b { font-family: var(--mono); font-size: 26px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
  .pc-cel > small { font-size: 12px; color: var(--muted); }
  .pc-cel > small b { font-family: var(--mono); font-weight: 600; color: var(--text); }
  .pc-cel.menor > b { font-size: 20px; }
  @media (max-width: 640px) { .pc-cel { flex-basis: 140px; padding: 12px 14px; } .pc-cel > b { font-size: 21px; } .pc-cel.menor > b { font-size: 18px; } .pc-curva { padding: 14px 10px 10px; } .pc-q { flex-basis: 100%; } }
  /* o mês: meta à esquerda, curva à direita, num painel só */
  .pc-heroi { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); }
  @media (max-width: 900px) { .pc-heroi { grid-template-columns: minmax(0, 1fr); } }
  .pc-meta { display: flex; flex-direction: column; gap: 10px; padding: 20px 22px; border-right: 1px solid var(--border); }
  @media (max-width: 900px) { .pc-meta { border-right: 0; border-bottom: 1px solid var(--border); } }
  .pc-meta .rot { font-size: 12px; color: var(--muted); }
  .pc-meta .num { display: flex; align-items: baseline; gap: 10px; font-family: var(--mono); }
  .pc-meta .num b { font-size: 52px; font-weight: 600; line-height: 1; letter-spacing: -.03em; }
  .pc-meta .num span { font-size: 16px; color: var(--muted); }
  .pc-meta .barra { position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
  .pc-meta .barra i { display: block; height: 100%; border-radius: 4px; background: var(--pc-inst); min-width: 4px; }
  .pc-meta .barra u { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--text); }
  .pc-meta .leg { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
  .pc-meta dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 12.5px; }
  .pc-meta dt { color: var(--muted); }
  .pc-meta dd { margin: 0; text-align: right; }
  .pc-meta dd b { font-family: var(--mono); font-weight: 600; }
  .pc-meta dd.bad b { color: var(--bad-fg); } .pc-meta dd.ok b { color: var(--ok-fg); }
  .pc-meta dd small { display: block; font-size: 11.5px; color: var(--muted); }
  .pc-curva { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 16px 18px 12px; min-width: 0; }
  .pc-curva-cab { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; }
  .pc-curva-cab h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .pc-leg { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .pc-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .pc-leg i.linha { width: 16px; height: 0; border-radius: 0; border-top: 2px dashed var(--muted); vertical-align: 3px; }
  #pc-svg { display: block; width: 100%; height: 220px; }
  #pc-svg text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  #pc-svg text.forte { fill: var(--text); font-weight: 600; }
  .pc-dica { position: absolute; z-index: 2; pointer-events: none; min-width: 170px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-strong); font-size: 12px; line-height: 1.5; box-shadow: 0 6px 18px rgba(0,0,0,.35); }
  .pc-dica b { font-family: var(--mono); }
  .pc-dica strong { display: block; margin-bottom: 2px; }
  .pc-dica i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .pc-mes { border-top: 1px solid var(--border); }
  :root { --pc-venda: #4C97EA; --pc-inst: #2AAE48; }
  /* de onde vêm: cinco colunas num painel só */
  .pc-quebras { display: flex; flex-wrap: wrap; }
  .pc-q { flex: 1 1 210px; min-width: 0; padding: 14px 18px 16px; box-shadow: 1px 0 0 var(--border), 0 1px 0 var(--border); }
  .pc-q h3 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .pc-q ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .pc-q li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; }
  .pc-q .nome { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-q a.nome { color: inherit; text-decoration: none; }
  .pc-q a.nome:hover { color: var(--link); text-decoration: underline; }
  .pc-q .n { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .pc-q .bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--surface-2); }
  .pc-q .bar i { display: block; height: 100%; border-radius: 2px; background: var(--pc-venda); min-width: 4px; }
  .pc-q small { grid-column: 1 / -1; font-size: 11.5px; color: var(--muted); }
  .pc-q .vazio { color: var(--muted); font-size: 12.5px; }
  .pc-pe { color: var(--muted); font-size: 12px; }
</style>

<body>
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="placar"></nav>
  <main class="main lista-densa">
    <header class="cab">
      <div>
        <h1>Placar</h1>
        <div class="sub">Como está o dia e como vai o mês.</div>
      </div>
      <div class="cab-acoes"><select class="sel" id="f-mes" aria-label="Mês"></select></div>
    </header>

    <section class="pc-bloco" aria-labelledby="t-hoje">
      <h2 class="pc-h2" id="t-hoje">Hoje</h2>
      <div class="pc-painel pc-cels" id="pc-hoje"><div class="pc-cel"><span>Carregando…</span><b>—</b></div></div>
    </section>

    <section class="pc-bloco" aria-labelledby="t-mes">
      <h2 class="pc-h2" id="t-mes">O mês</h2>
      <div class="pc-painel">
        <div class="pc-heroi">
          <div class="pc-meta" id="pc-meta"><span class="rot">Carregando…</span></div>
          <div class="pc-curva" id="pc-curva">
            <div class="pc-curva-cab"><h3 id="t-graf">O mês até aqui</h3>
              <div class="pc-leg"><span><i style="background:var(--pc-venda)"></i>Vendas com OS</span><span><i style="background:var(--pc-inst)"></i>Instaladas</span><span id="pc-leg-meta"><i class="linha"></i>Caminho da meta</span></div></div>
            <svg id="pc-svg" role="img"></svg>

          </div>
        </div>
        <div class="pc-cels pc-mes" id="pc-mes"></div>
      </div>

    <section class="pc-bloco" aria-labelledby="t-onde">
      <h2 class="pc-h2" id="t-onde">De onde vêm as vendas</h2>
      <div class="pc-painel pc-quebras" id="pc-quebras"></div>
    </section>
    <div class="pc-pe" id="pc-pe"></div>
  </main>

<script>
(async function () {
  const t0 = performance.now();
  const { esc } = NG;
  const V = NGVendasOS;
  const eu = await NG.exigirLogin();
  NGSidebar.montar();
  if (!['admin', 'backoffice'].includes(eu.perfil)) {
    document.querySelector('main').innerHTML = '<header class="cab"><div><h1>Placar</h1></div></header><div class="vazio">O Placar é do admin e do backoffice.</div>';
    return;
  }
  const fMes = document.getElementById('f-mes');
  const R = (v) => NG.fmtMoeda(v).replace(/,00$/, '');
  const N = (v) => NG.fmtNum(Number(v || 0));
  const pl = (n, um, varios) => `${N(n)} ${Number(n) === 1 ? um : varios}`;
  const dec = (x) => Number(x).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const pct = (a, b) => (b > 0 ? `${dec((a / b) * 100)} %` : '—');
  const diaDe = (iso) => (iso ? NG.diaSP(iso) : '');
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const nomeMes = (m) => MESES[Number(m.slice(5, 7)) - 1];
  const mesAnterior = (m) => { const a = Number(m.slice(0, 4)), n = Number(m.slice(5, 7)); return n === 1 ? `${a - 1}-12` : `${a}-${String(n - 1).padStart(2, '0')}`; };
  const diasNoMes = (m) => new Date(Date.UTC(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0)).getUTCDate();
  const hoje = NG.diaSP(), ontem = NG.somaDias(hoje, -1), amanha = NG.somaDias(hoje, 1);
  const mesAtual = hoje.slice(0, 7);
  let mes = mesAtual;
  let d = { vendas: [], os: {}, nomeCurto: {} }, ritmo = null, metas = [], conv = null, ads = [], completo = false;

  const st = (v) => V.statusDe(v, d.os[v.id]);
  const diaOS = (v) => diaDe(V.dataOS(v));
  const doMes = (v, m) => diaOS(v).slice(0, 7) === m;
  const comissao = (v) => V.comissaoDe(v, st(v));

  // ---------- HOJE: cinco números, cada um com o de ontem ----------
  function pintarHoje() {
    const agora = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', timeZone: NG.TZ }).replace(/\D/g, '');
    const sem = new Date(`${hoje}T12:00:00-03:00`).toLocaleDateString('pt-BR', { weekday: 'long', timeZone: NG.TZ });
    document.getElementById('t-hoje').innerHTML = `Hoje <em>${esc(sem)}, ${esc(NG.fmtDiaISO(hoje).slice(0, 5))} · até as ${Number(agora)}h</em>`;
    const nConv = (dia) => (conv ? conv.filter((c) => diaDe(c.created_at) === dia).length : null);
    const nQual = (dia) => (conv ? conv.filter((c) => c.handoff_motivo === 'dados_completos' && diaDe(c.handoff_em) === dia).length : null);
    const nOS = (dia) => d.vendas.filter((v) => diaOS(v) === dia).length;
    const aberta = (v) => !['instalada', 'cancelada'].includes(st(v));
    const nInst = (dia) => d.vendas.filter((v) => (aberta(v) && V.diaInstalacao(v, d.os[v.id]) === dia) || (v.instalado_em && diaDe(v.instalado_em) === dia)).length;
    const ad = (dia) => ads.find((r) => r.dia === dia) || null;
    const aH = ad(hoje), aO = ad(ontem);
    const v = (x) => (x == null ? (completo ? '—' : '…') : N(x));
    const cx = (rot, val, nota, dica) => `<div class="pc-cel"${dica ? ` title="${esc(dica)}"` : ''}><span>${esc(rot)}</span><b>${esc(val)}</b><small>${esc(nota)}</small></div>`;
    document.getElementById('pc-hoje').innerHTML = [
      cx('Conversas novas', v(nConv(hoje)), `ontem: ${v(nConv(ontem))} no dia todo`, 'Conversas que a Mari recebeu hoje, de qualquer origem.'),
      cx('Qualificadas', v(nQual(hoje)), `ontem: ${v(nQual(ontem))}`, 'A Mari passou ao time com os dados completos.'),
      cx('Vendas (OS geradas)', N(nOS(hoje)), `ontem: ${N(nOS(ontem))}`, 'Vendas com a OS gerada hoje.'),
      cx('Instalações de hoje', N(nInst(hoje)), `amanhã: ${pl(nInst(amanha), 'agendada', 'agendadas')}`, 'Instalações marcadas para hoje, feitas ou não.'),
      cx('Gasto em anúncio', aH ? R(aH.gasto) : completo ? '—' : '…', aH && Number(aH.conversas_meta) > 0 ? `${R(Math.round((aH.gasto / aH.conversas_meta) * 100) / 100)} por conversa · ontem ${aO ? R(aO.gasto) : '—'}` : `ontem: ${aO ? R(aO.gasto) : '—'}`, 'Gasto de hoje no Meta Ads, lido a cada 15 min.'),
    ].join('');
  }

  // ---------- O MÊS ----------
  function pintarMes() {
    const atual = mes === mesAtual;
    const vm = d.vendas.filter((v) => doMes(v, mes));
    const instMes = d.vendas.filter((v) => v.instalado_em && diaDe(v.instalado_em).slice(0, 7) === mes).length;
    const metaLinha = metas.find((m) => String(m.mes).slice(0, 7) === mes);
    const meta = atual && ritmo && ritmo.meta ? Number(ritmo.meta) : metaLinha ? Number(metaLinha.meta_vendas) : null;
    const inst = atual && ritmo && ritmo.instaladas != null ? Number(ritmo.instaladas) : instMes;
    document.getElementById('t-mes').innerHTML = `${esc(nomeMes(mes))} de ${mes.slice(0, 4)}${atual ? '' : ' <em>mês fechado</em>'}`;
    const aguard = vm.filter((v) => !['instalada', 'cancelada'].includes(st(v))).length;
    // -- a meta, grande, à esquerda
    const pctMeta = meta ? Math.max(0, Math.min(100, (inst / meta) * 100)) : 0;
    const nDias = diasNoMes(mes), diaH = atual ? Number(hoje.slice(8, 10)) : nDias;
    const esperado = meta ? (meta * diaH) / nDias : null;
    const linhas = [];
    if (atual && ritmo && meta) {
      const un = ritmo.dias_uteis ? 'dias úteis' : 'dias';
      const bate = Number(ritmo.projecao) >= meta;
      linhas.push(`<dt title="Quantas instalações por dia faltam para fechar a meta.">Para bater a meta</dt><dd><b>${dec(ritmo.por_dia)} por dia</b><small>faltam ${N(ritmo.faltam)} em ${N(ritmo.dias_restantes)} ${un}</small></dd>`);
      linhas.push(`<dt title="Instalações por dia, até hoje, e onde o mês fecha se o ritmo não mudar.">Ritmo de hoje</dt><dd class="${bate ? 'ok' : 'bad'}"><b>${dec(ritmo.ritmo_dia)} por dia</b><small>nesse ritmo o mês fecha em ${N(ritmo.projecao)}</small></dd>`);
    }
    linhas.push(`<dt title="Vendas com OS gerada no mês.">Vendas com OS</dt><dd><b>${N(vm.length)}</b><small>${aguard ? `${pl(aguard, 'esperando', 'esperando')} a instalação` : 'nenhuma esperando a instalação'}</small></dd>`);
    document.getElementById('pc-meta').innerHTML = `<span class="rot" title="A meta do mês é de instaladas (a mesma do Painel).">Instaladas em ${esc(nomeMes(mes))}</span>
      <div class="num"><b>${N(inst)}</b>${meta ? `<span>de ${N(meta)}</span>` : ''}</div>
      ${meta ? `<div class="barra" title="${atual ? `Para estar no caminho da meta, hoje seriam ${N(Math.round(esperado))} instaladas.` : ''}"><i style="width:${pctMeta}%"></i>${atual ? `<u style="left:calc(${Math.min(100, (esperado / meta) * 100)}% - 1px)"></u>` : ''}</div>
      <div class="leg"><span>${Math.round(pctMeta)} % da meta</span>${atual ? `<span>no caminho da meta: ${N(Math.round(esperado))} hoje</span>` : ''}</div>` : '<div class="leg"><span>sem meta cadastrada para o mês</span></div>'}
      <dl>${linhas.join('')}</dl>`;
    // -- os outros números do mês, numa linha só, no pé do mesmo painel
    const it = [];
    const cel = (rot, val, nota, dica) => `<div class="pc-cel menor" title="${esc(dica)}"><span>${esc(rot)}</span><b>${val}</b><small>${nota}</small></div>`;
    const com = vm.map(comissao);
    const total = com.reduce((s, c) => s + (c.valor || 0), 0), paga = com.filter((c) => c.id === 'paga').reduce((s, c) => s + (c.valor || 0), 0);
    it.push(cel('Comissão do mês', esc(R(total)), paga ? `${esc(R(paga))} já paga pela Nio` : 'nada pago ainda', 'Comissão da Nio das vendas com OS do mês (prevista, confirmada ou paga).'));
    // Custo por venda de anúncio (Ricardo, 22/11): o mesmo critério do Meta Ads
    const gastoMes = ads.filter((r) => r.dia.slice(0, 7) === mes).reduce((s, r) => s + Number(r.gasto || 0), 0);
    const vAds = vm.filter((v) => v.origem === 'meta_ads').length;
    it.push(cel('Custo por venda de anúncio', !completo ? '…' : vAds ? esc(R(Math.round(gastoMes / vAds))) : '—', `${completo ? esc(R(gastoMes)) : '…'} gastos · ${pl(vAds, 'venda de anúncio', 'vendas de anúncio')}`, 'Gasto do mês em anúncio dividido pelas vendas com OS que vieram de anúncio.'));
    // Conversão do mês (Ricardo, 22/11)
    if (conv) {
      const cM = conv.filter((c) => diaDe(c.created_at).slice(0, 7) === mes).length;
      const qM = conv.filter((c) => c.handoff_motivo === 'dados_completos' && diaDe(c.handoff_em).slice(0, 7) === mes).length;
      it.push(cel('Conversas › qualificadas › vendas', `${N(cM)} › ${N(qM)} › ${N(vm.length)}`, `${pct(vm.length, cM)} das conversas viram venda`, 'Conversas novas no mês › qualificadas no mês › vendas com OS no mês. O percentual é sobre as conversas.'));
    } else it.push(cel('Conversas › qualificadas › vendas', completo ? '—' : '…', '&nbsp;', 'Conversas novas no mês › qualificadas no mês › vendas com OS no mês.'));
    // Mês passado (Ricardo, 22/11): o mesmo dia do mês anterior
    const ant = mesAnterior(mes);
    const corte = atual ? `${ant}-${String(Math.min(Number(hoje.slice(8, 10)), diasNoMes(ant))).padStart(2, '0')}` : `${ant}-31`;
    const vAnt = d.vendas.filter((v) => doMes(v, ant) && diaOS(v) <= corte).length;
    const iAnt = d.vendas.filter((v) => v.instalado_em && diaDe(v.instalado_em).slice(0, 7) === ant && diaDe(v.instalado_em) <= corte).length;
    it.push(cel(atual ? `${nomeMes(ant)}, até o dia ${Number(corte.slice(8))}` : `${nomeMes(ant)} inteiro`, esc(pl(vAnt, 'venda', 'vendas')), esc(pl(iAnt, 'instalada', 'instaladas')), atual ? `Até o dia ${Number(corte.slice(8))} de ${nomeMes(ant)}, para comparar com hoje.` : `${nomeMes(ant)} inteiro.`));
    document.getElementById('pc-mes').innerHTML = it.join('');

    // ---------- a curva do mês: vendas e instaladas acumuladas contra o caminho da meta ----------
    curva = { vm, meta, atual };
    desenharCurva();

    // ---------- de onde vêm ----------
    const quebra = (titulo, chave, link) => {
      const g = new Map();
      vm.forEach((v) => {
        const [k, nome] = chave(v);
        const x = g.get(k) || { k, nome, n: 0, inst: 0, com: 0 };
        x.n += 1; if (V.instalada(v)) x.inst += 1; x.com += comissao(v).valor || 0;
        g.set(k, x);
      });
      const linhas = [...g.values()].sort((a, b) => b.n - a.n || b.com - a.com || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
      const mx = Math.max(1, ...linhas.map((l) => l.n));
      return `<section class="pc-q"><h3>${esc(titulo)}</h3>${linhas.length ? `<ul>${linhas.map((l) => {
        const href = atual && link ? link(l) : null;
        return `<li>${href ? `<a class="nome" href="${esc(href)}" title="Abrir a tela Vendas com este filtro">${esc(l.nome)}</a>` : `<span class="nome" title="${esc(l.nome)}">${esc(l.nome)}</span>`}<span class="n">${N(l.n)}</span>
          <div class="bar"><i style="width:${Math.round((l.n / mx) * 100)}%"></i></div>
          <small>${pl(l.inst, 'instalada', 'instaladas')} · ${esc(R(l.com))}</small></li>`;
      }).join('')}</ul>` : '<div class="vazio">Nenhuma venda com OS no mês.</div>'}</section>`;
    };
    document.getElementById('t-onde').innerHTML = `De onde vêm as vendas <em>${pl(vm.length, 'venda com OS', 'vendas com OS')} em ${esc(nomeMes(mes))} · instaladas e comissão embaixo de cada linha</em>`;
    const FORMA = { cartao: 'Cartão', boleto: 'Boleto', dacc: 'Débito em conta' };
    document.getElementById('pc-quebras').innerHTML = [
      quebra('Por vendedor', (v) => [v.vendedor_id || '', v.vendedor_nome || 'Sem vendedor (Mari)'], (l) => (l.k ? `vendas.html?vendedor=${encodeURIComponent(l.k)}` : null)),
      quebra('Por origem', (v) => [v.origem || '', NG.ORIGENS[v.origem] || v.origem || 'Sem origem'], (l) => (l.k ? `vendas.html?origem=${encodeURIComponent(l.k)}` : null)),
      quebra('Por plano', (v) => [v.plano_id || '', d.nomeCurto[v.plano_id] || v.plano_nome || 'Sem plano']),
      quebra('Por forma de pagamento', (v) => [v.forma_pagamento || '', FORMA[v.forma_pagamento] || v.forma_pagamento || 'Não informada']),
      quebra('Por cidade', (v) => [v.cidade || '', v.cidade || 'Sem cidade'], (l) => (l.k ? `vendas.html?q=${encodeURIComponent(l.k)}` : null)),
    ].join('');
    document.getElementById('pc-pe').textContent = `Venda = OS gerada, pela data da OS. ${atual ? 'Clicar num vendedor, numa origem ou numa cidade abre a tela Vendas já filtrada.' : ''}`;
  }

  // ---------- a curva: acumulado de vendas (OS) e de instaladas, dia a dia, contra a reta da meta ----------
  let curva = null;
  function desenharCurva() {
    if (!curva) return;
    const { vm, meta, atual } = curva;
    const svg = document.getElementById('pc-svg'), dica = document.getElementById('pc-dica');
    const W = Math.max(320, Math.round(svg.getBoundingClientRect().width || 600)), H = 220;
    const m = { t: 16, r: 104, b: 24, l: 30 };
    const n = diasNoMes(mes), ate = atual ? Number(hoje.slice(8, 10)) : n;
    const vd = Array.from({ length: n }, () => 0), id = Array.from({ length: n }, () => 0);
    vm.forEach((v) => { vd[Number(diaOS(v).slice(8, 10)) - 1] += 1; });
    d.vendas.forEach((v) => { if (v.instalado_em && diaDe(v.instalado_em).slice(0, 7) === mes) id[Number(diaDe(v.instalado_em).slice(8, 10)) - 1] += 1; });
    const cv = [0], ci = [0];
    for (let i = 0; i < ate; i += 1) { cv.push(cv[i] + vd[i]); ci.push(ci[i] + id[i]); }
    const topo = Math.max(meta || 0, cv[ate], ci[ate], 4);
    const passo = topo <= 8 ? 2 : topo <= 20 ? 5 : topo <= 50 ? 10 : topo <= 120 ? 25 : 50;
    const ymax = Math.ceil(topo / passo) * passo;
    const x = (dia) => m.l + (dia / n) * (W - m.l - m.r);
    const y = (q) => m.t + (1 - q / ymax) * (H - m.t - m.b);
    const pts = (arr) => arr.map((q, i) => `${x(i).toFixed(1)},${y(q).toFixed(1)}`).join(' ');
    let g = '';
    for (let q = 0; q <= ymax; q += passo) g += `<line x1="${m.l}" x2="${x(n)}" y1="${y(q)}" y2="${y(q)}" stroke="var(--border)" stroke-width="1"${q ? ' stroke-dasharray="2 4"' : ''}/><text x="${m.l - 8}" y="${y(q) + 4}" text-anchor="end">${q}</text>`;
    for (let dia = 1; dia <= n; dia += 1) if ((dia === 1 || dia % 5 === 0) && !(atual && Math.abs(x(dia) - x(ate)) < 30)) g += `<text x="${x(dia)}" y="${H - 6}" text-anchor="middle">${dia}</text>`;
    if (atual) g += `<line x1="${x(ate)}" x2="${x(ate)}" y1="${m.t}" y2="${y(0)}" stroke="var(--border-strong)" stroke-width="1"/><text class="forte" x="${x(ate)}" y="${H - 6}" text-anchor="middle">hoje</text>`;
    if (meta) g += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(n)}" y2="${y(meta)}" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5" stroke-linecap="round" opacity=".7"/><text x="${x(n) + 8}" y="${y(meta) + 4}">meta ${N(meta)}</text>`;
    g += `<polygon points="${x(0)},${y(0)} ${pts(cv)} ${x(ate)},${y(0)}" fill="var(--pc-venda)" opacity=".10"/>`;
    g += `<polyline points="${pts(cv)}" fill="none" stroke="var(--pc-venda)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    g += `<polyline points="${pts(ci)}" fill="none" stroke="var(--pc-inst)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    // ponta de cada linha com o número ao lado (sem depender só da cor); se as duas pontas ficam coladas, afasta os rótulos
    let yv = y(cv[ate]), yi = y(ci[ate]);
    if (Math.abs(yv - yi) < 15) { const meio = (yv + yi) / 2, cima = cv[ate] >= ci[ate]; yv = meio + (cima ? -8 : 8); yi = meio + (cima ? 8 : -8); }
    const ponta = (q, yy, cor, txt) => `<circle cx="${x(ate)}" cy="${y(q)}" r="4.5" fill="${cor}" stroke="var(--surface)" stroke-width="2"/><text class="forte" x="${x(ate) + 10}" y="${yy + 4}">${txt}</text>`;
    g += ponta(cv[ate], yv, 'var(--pc-venda)', pl(cv[ate], 'venda', 'vendas'));
    g += ponta(ci[ate], yi, 'var(--pc-inst)', pl(ci[ate], 'instalada', 'instaladas'));
    g += `<line id="pc-mira" y1="${m.t}" y2="${y(0)}" stroke="var(--text)" stroke-width="1" opacity=".5" visibility="hidden"/><rect id="pc-alvo" x="${m.l}" y="${m.t}" width="${x(n) - m.l}" height="${y(0) - m.t}" fill="transparent"/>`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.setAttribute('aria-label', `${nomeMes(mes)}: ${pl(cv[ate], 'venda com OS', 'vendas com OS')} e ${pl(ci[ate], 'instalada', 'instaladas')}${atual ? ' até hoje' : ''}${meta ? `, contra a meta de ${N(meta)} instaladas` : ''}.`);
    svg.innerHTML = g;
    document.getElementById('pc-leg-meta').hidden = !meta;
    document.getElementById('t-graf').textContent = atual ? 'O mês até aqui' : `Como foi ${nomeMes(mes)}`;
    const mira = svg.querySelector('#pc-mira'), alvo = svg.querySelector('#pc-alvo');
    const some = () => { dica.hidden = true; mira.setAttribute('visibility', 'hidden'); };
    alvo.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect();
      const px = ((e.clientX - r.left) / r.width) * W;
      const dia = Math.max(1, Math.min(ate, Math.ceil(((px - m.l) / (x(n) - m.l)) * n)));
      mira.setAttribute('x1', x(dia)); mira.setAttribute('x2', x(dia)); mira.setAttribute('visibility', 'visible');
      dica.innerHTML = `<strong>${String(dia).padStart(2, '0')}/${mes.slice(5, 7)}${vd[dia - 1] || id[dia - 1] ? ` · no dia: ${[vd[dia - 1] ? pl(vd[dia - 1], 'venda', 'vendas') : '', id[dia - 1] ? pl(id[dia - 1], 'instalada', 'instaladas') : ''].filter(Boolean).join(' e ')}` : ''}</strong>
        <div><i style="background:var(--pc-venda)"></i>Vendas até o dia: <b>${N(cv[dia])}</b></div>
        <div><i style="background:var(--pc-inst)"></i>Instaladas até o dia: <b>${N(ci[dia])}</b></div>
        ${meta ? `<div class="muted">No caminho da meta: <b>${N(Math.round((meta * dia) / n))}</b></div>` : ''}`;
      dica.hidden = false;
      const caixa = svg.parentElement.getBoundingClientRect();
      const esq = r.left - caixa.left + (x(dia) / W) * r.width;
      dica.style.top = `${r.top - caixa.top + 8}px`;
      dica.style.left = esq + 190 > caixa.width ? `${esq - dica.offsetWidth - 12}px` : `${esq + 12}px`;
    });
    alvo.addEventListener('mouseleave', some);
  }
  let rz = null;
  window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(desenharCurva, 120); });

  async function carregar() {
    const iniAnt = `${mesAnterior(mesAnterior(mesAtual))}-01`;   // dois meses para trás: dá o mês atual, o passado e a comparação
    // Regra 19: tudo sai junto, mas a tela pinta assim que as vendas e a meta chegam (as mais rápidas); os números que
    // dependem das conversas da Mari e do gasto em anúncio entram em seguida, sem segurar o resto.
    const pConv = NG.sb.from('mari_conversas').select('created_at, handoff_motivo, handoff_em').gte('created_at', `${iniAnt}T00:00:00-03:00`).limit(10000).then((r) => r, (e) => ({ error: e }));
    const pAds = NG.sb.from('v_meta_ads_dia').select('dia, gasto, conversas_meta').gte('dia', iniAnt).then((r) => r, (e) => ({ error: e }));
    const [dados, rr, rm] = await Promise.all([
      V.carregar(),
      NG.sb.rpc('painel_meta_ritmo', { p_hoje: hoje }),
      NG.sb.from('config_metas').select('mes, meta_vendas'),
    ]);
    if (dados.erro) { document.getElementById('pc-meta').innerHTML = `<span class="rot">${esc(NG.msgErro(dados.erro))}</span>`; NG.toast(NG.msgErro(dados.erro), 'bad'); return; }
    d = dados;
    ritmo = rr && !rr.error ? rr.data : null;
    metas = rm && !rm.error ? rm.data || [] : [];
    // Meses do seletor: do mês atual até o mais antigo com venda com OS (no máximo o que as leituras cobrem: 3 meses)
    const guarda = mes;
    const lista = [mesAtual, mesAnterior(mesAtual), mesAnterior(mesAnterior(mesAtual))].filter((m, i) => i === 0 || d.vendas.some((v) => diaOS(v).slice(0, 7) <= m));
    fMes.innerHTML = lista.map((m) => `<option value="${m}">Mês: ${nomeMes(m)}${m.slice(0, 4) !== mesAtual.slice(0, 4) ? ` de ${m.slice(0, 4)}` : ''}</option>`).join('');
    mes = lista.includes(guarda) ? guarda : mesAtual;
    fMes.value = mes;
    pintarHoje();
    pintarMes();
    if (!window.NGpcTempo) { window.NGpcTempo = Math.round(performance.now() - t0); window.NGpcDesdeAbrir = Math.round(performance.now()); }   // regra 19
    const [rc, ra] = await Promise.all([pConv, pAds]);
    conv = rc && !rc.error ? rc.data || [] : null;
    ads = ra && !ra.error ? ra.data || [] : [];
    completo = true;
    pintarHoje();
    pintarMes();
    if (!window.NGpcCompleto) window.NGpcCompleto = Math.round(performance.now());
  }
  fMes.addEventListener('change', () => { mes = fMes.value; pintarMes(); });
  NG.botaoAtualizar(() => carregar());
  await carregar();
  NG.aoVoltarAba(() => carregar());
})();
</script>
