<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Live · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=131126-30">
<script src="config.js?v=121126-8"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=131126-29"></script>
<script src="assets/sidebar.js?v=131126-16"></script>
<script src="assets/conversa.js?v=121126-27"></script>

<script src="assets/pulso.js?v=121126-24"></script>

<body class="tela-fila lv-tela">
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="minhavez"></nav>
  <main class="main mv lv">
    <div class="lv-fila" id="fila">
      <header class="cab">
        <div>
          <h1 class="live-tit"><span class="live-dot" aria-hidden="true"></span>Live</h1>
          <div class="sub" id="sub">Pegue a primeira linha e aperte o botão. O NIOGEN cuida do Chatwoot.</div>
        </div>
        <div class="cab-acoes" id="cab-acoes">
          <div class="seg mv-vista" role="group" aria-label="Vista"><button type="button" data-vista="lista">Lista</button><button type="button" data-vista="quadro">Quadro</button></div>
        </div>
      </header>
      <div id="pulso" class="pl" hidden></div>
      <div id="intro"></div>
      <nav id="funil" class="lv-stages" aria-label="Filtrar por etapa"></nav>
      <section class="lv-lista" id="lista" aria-label="Fila do backoffice"></section>
      <div id="quadro" class="mv-quadro" hidden></div>
    </div>
    <div class="lv-cliente" id="cliente" aria-label="Cliente" aria-hidden="true"></div>
  </main>
</div>
<div class="mv-feito" id="feito" role="status" aria-live="polite" hidden></div>
<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  // 12/11 (0144 · docs/Prompt_pulso_live_121126_1035.md): faixa de pulso no topo — 1 chamada (pulso_operacao), disparada antes
  // da lista para correr na mesma rodada; ela também entrega os selos do menu (o menu não chama status_operacao aqui).
  if (['admin', 'backoffice'].includes(eu.perfil)) { document.body.dataset.pulso = '1'; NGPulso.montar(document.getElementById('pulso')); }
  NGSidebar.montar();
  const listaEl = document.getElementById('lista');
  if (!['admin', 'backoffice'].includes(eu.perfil)) {
    listaEl.innerHTML = '<div class="vazio">O Live é do backoffice. Use o Funil de vendas.</div>';
    return;
  }
  const filaEl = document.getElementById('fila');
  const clienteEl = document.getElementById('cliente');
  const funilEl = document.getElementById('funil');
  const quadroEl = document.getElementById('quadro');
  const feitoEl = document.getElementById('feito');
  const movel = window.matchMedia('(max-width: 900px)');
  const ls = { ler: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, gravar: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* modo privado */ } } };

  let jor = { lista: [], todas: [] };
  // 13/11 (Ricardo: "destino também no Live"). Etapa 4b: o degrau e o destino vêm da escada única (v_leads) — a mesma conta da
  // tela Leads, do Funil de vendas, do Painel e da ficha — e o clique leva à Leads já filtrada.
  let funilMap = {};
  const funilDe = (j) => funilMap[j.conversa_id] || (j.venda_id ? funilMap[`v:${j.venda_id}`] : null);
  const funilHtml = (j) => {
    const f = funilDe(j);
    if (!f || !f.etapa) return '';
    if (f.destino === 'saida' || f.destino === 'instalada') {
      const q = f.destino === 'saida' ? `aba=saidas${f.saida_motivo ? `&amp;saida=${esc(f.saida_motivo)}` : ''}` : 'aba=instaladas';
      return ` · <a class="cv-dest" data-leads href="leads.html?${q}" title="${esc(`${f.destino === 'saida' ? `Saída${f.saida_sub ? `: ${f.saida_sub}` : ''}` : 'Instalada'} — clique para ver na tela Leads`)}">${f.destino === 'instalada' ? '✅' : '⛔'} ${esc(f.destino === 'saida' ? f.saida_nome || 'Saída' : 'Instalada')}</a>`;
    }
    return ` · <a class="cv-etp" data-leads href="leads.html?aba=todos&amp;etapa=${esc(f.etapa)}" title="${esc(`Degrau da escada: ${f.etapa_nome}${f.status_nome ? ` · ${f.status_nome}` : ''} — clique para ver todos deste degrau na tela Leads`)}">${esc(f.etapa_nome || f.etapa)}</a>`;
  };
  let conf = [];      // 0153: lista "Conferir" — ação do Chatwoot que falhou, conversa mexida fora do NIOGEN, parada com dono, docs 15 d
  let andPend = [];   // 0105: pedidos do portal sem venda ("casar pedido") e biometrias sem venda (GED360)
  let opsCanal = [];  // 0117: 🔥 oportunidades do canal parceiro
  let ops = [];       // 0107: 🔥 oportunidades (sem as que já pedem ação)
  let opAberta = null;     // conversa_id da linha com "Dispensar" aberto (motivo em 1 clique)
  const opFeitas = {};     // conversa_id → "Enviada · volta pra Mari" (o resultado fica na linha)
  let motivosDispensa = [{ codigo: 'ja_falei', nome: 'Já falei' }, { codigo: 'nao_vale', nome: 'Não vale' }, { codigo: 'depois', nome: 'Depois' }];
  NG.sb.from('config_oportunidades').select('parametros').eq('codigo', 'geral').maybeSingle().then(({ data }) => {
    const m = data && data.parametros && data.parametros.dispensa_motivos;
    if (Array.isArray(m) && m.length) motivosDispensa = m;
  }, () => {});
  // "Vale" da oportunidade = comissão do plano + transição (config_planos / config_bonus) — lido uma vez, sem segurar a lista.
  let tabelaVale = null;
  Promise.all([NG.sb.from('config_planos').select('nome, nome_curto, comissao, cluster').eq('ativo', true),
    NG.sb.from('config_bonus').select('tipo, cluster, valor, valido_de, valido_ate').eq('tipo', 'transicao')]).then(([rp, rb]) => {
    const hoje = NG.diaSP();
    tabelaVale = { planos: rp.data || [], trans: (rb.data || []).filter((b) => b.valido_de <= hoje && (!b.valido_ate || b.valido_ate >= hoje)) };
    if (ops.length) render();
  }, () => {});
  const valeDe = (o) => {
    const nm = String(o.plano || '').trim().toLowerCase();
    const pl = tabelaVale && nm ? tabelaVale.planos.find((x) => [x.nome, x.nome_curto].some((y) => String(y || '').trim().toLowerCase() === nm)) : null;
    if (pl && pl.comissao != null) {
      const t = tabelaVale.trans.find((b) => b.cluster === pl.cluster) || tabelaVale.trans.find((b) => b.cluster === 'regular');
      return { txt: NG.fmtMoeda(Number(pl.comissao) + (t ? Number(t.valor) : 0)), tit: `comissão ${NG.fmtMoeda(pl.comissao)}${t ? ` + transição ${NG.fmtMoeda(t.valor)}` : ''}` };
    }
    return o.valor_mes != null ? { txt: `${NG.fmtMoeda(o.valor_mes)}/mês`, tit: 'mensalidade (comissão do plano não encontrada na tabela)' } : { txt: '—', tit: '' };
  };
  let soVez = true;
  let etapaSel = null;
  let vista = ['lista', 'quadro'].includes(ls.ler('niogen.fila.vista')) ? ls.ler('niogen.fila.vista') : 'lista';

  const BOTAO = { assumir: 'Assumir', responder: 'Responder', viabilidade: 'Viabilidade', pedido: 'Gravar pedido', credito: 'Crédito', biometria: 'Biometria',
    os: 'Abrir a OS', agendar: 'Agendar', os_agendar: 'OS + agendar', reagendar: 'Reagendar', docs: 'Documentos', pendencia: 'Pendência', conferencia: 'Conferir', manual: 'Mandar à mão', abrir: 'Abrir' };
  const COR = Object.fromEntries(NG.JORNADA.map((e) => [e.n, e.cor]));
  const dot = (n) => `<i class="mv-dot" style="--c:${COR[n] || '#6E747C'}"></i>`;
  const ICO_ROBO = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2v3"/></svg>';
  const ICO_PESSOA = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/></svg>';
  const SETA = '<svg class="lv-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
  const donoHtml = (j) => {
    if (!j.dono_tipo) return '<span class="mv-dono apagado">sem dono</span>';
    const nome = j.dono_tipo === 'mari' ? 'Mari' : (NG.ehMeu(j.dono_nome) ? 'você' : j.dono_nome || 'time');
    return `<span class="mv-dono ${j.dono_tipo}">${j.dono_tipo === 'mari' ? ICO_ROBO : ICO_PESSOA}${esc(nome)}</span>`;
  };
  const haTempo = (iso) => {
    if (!iso) return '—';
    const min = Math.max(0, (Date.now() - new Date(iso)) / 60000);
    if (min < 60) return `${Math.round(min)} min`;
    if (min < 48 * 60) return `${Math.floor(min / 60)} h`;
    return `${Math.floor(min / 1440)} d`;
  };
  const telFmt = (t) => {
    const x = String(t || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    return x.length === 11 ? `(${x.slice(0, 2)}) ${x.slice(2, 7)}-${x.slice(7)}` : x.length === 10 ? `(${x.slice(0, 2)}) ${x.slice(2, 6)}-${x.slice(6)}` : x || '—';
  };
  const chaveFicha = (j) => (j.venda_id ? j.venda_id : `c:${j.conversa_id}`);
  const vez = (j) => !!j.precisa_acao;
  const PRAZO = { agora: 'agora', hoje: 'hoje', espera: 'aguardando', ok: '—', fora: 'saída' };
  const telaCheia = () => vista === 'lista' && !movel.matches;
  const filtroBase = (l) => l.filter((j) => j.precisa_acao || j.dono_tipo === 'pessoa' || j.dono_tipo === 'time' || (j.venda_id && j.dono_tipo !== 'mari') || j.pendencia);

  // fresco=true (padrão): após ação/Atualizar, descarta o cache. Carga inicial e timer usam o que a barra lateral já buscou.
  async function carregar(fresco = true) {
    if (fresco) NG.limparCache();
    const pOp = NG.rpcOportunidades();   // 0108: em paralelo com a jornada
    const pOpc = NG.oportunidadesCanal();
    const [r, ap, rf, fn, rcf] = await Promise.all([NG.jornada(), NG.sb.from('v_andamento_pendencias').select('*').order('desde'),
      NG.sb.from('v_leads').select('conversa_id, venda_id, etapa, etapa_nome, status_nome, destino, saida_motivo, saida_nome, saida_sub').limit(3000),
      null, NG.sb.rpc('live_conferir')]);
    conf = rcf && !rcf.error && Array.isArray(rcf.data) ? rcf.data : [];
    if (rf && !rf.error) {
      funilMap = {};
      (rf.data || []).forEach((l) => { if (l.conversa_id) funilMap[l.conversa_id] = l; if (l.venda_id) funilMap[`v:${l.venda_id}`] = l; });
    }
    andPend = ap.error ? [] : (ap.data || []);
    if (r.erro) { listaEl.innerHTML = `<div class="vazio">${esc(r.erro)}</div>`; return; }
    jor = { ...r, lista: filtroBase(r.lista) };
    render();
    const [ro, rc] = await Promise.all([NG.oportunidades(r, pOp), pOpc]);
    ops = ro.erro ? [] : ro.lista;
    opsCanal = (rc && rc.lista) || [];
    // 13/11 (aliviar a carga): ~0,8 s de banco — no máximo 1× a cada 5 min somando todas as abas e o Painel.
    if (NG.aCada('op_atualizar', 5 * 60000)) NG.sb.rpc('oportunidades_atualizar').then(() => {}, () => {});
    render();
    if (NGFicha.modo === 'cheia' && NGFicha.aberta) NGFicha.redesenhar();   // "1 de N na sua vez" e ↑ ↓ seguem a lista nova
  }

  // ---------- como usar (1º acesso) ----------
  function renderIntro() {
    const el = document.getElementById('intro');
    if (ls.ler('niogen.fila.intro2') === 'ok') { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="mv-intro"><div><b>Como usar, em 3 passos</b><ol>
      <li><b>Pegue a primeira linha.</b> "Para fazer" já vem na ordem: vermelho é agora, amarelo é hoje.</li>
      <li><b>Aperte o botão da linha.</b> O cliente abre em tela cheia: conversa à esquerda, ficha à direita; o card Agora diz o próximo passo.</li>
      <li><b>Responda pela conversa. Nada a responder (só despedida)? Aperte ✓ Nada a responder.</b> O próximo da fila abre sozinho. Etiqueta, atribuição e nota o NIOGEN faz.</li></ol></div>
      <button type="button" class="btn btn-sm" id="intro-ok">Entendi</button></div>`;
    document.getElementById('intro-ok').onclick = () => { ls.gravar('niogen.fila.intro2', 'ok'); renderIntro(); };
  }

  // ---------- faixa fina das etapas ----------
  function renderFunil() {
    const n = (e) => jor.lista.filter((j) => j.etapa === e).length;
    const nv = (e) => jor.lista.filter((j) => j.etapa === e && vez(j)).length;
    const sai = (jor.todas || []).filter((j) => j.etapa === 0).length;
    funilEl.innerHTML = NG.JORNADA.map((e) => `<button type="button" class="lv-stage${etapaSel === e.n ? ' on' : ''}" data-etapa="${e.n}" aria-pressed="${etapaSel === e.n}">${dot(e.n)}<span>${esc(e.nome)}</span><b>${n(e.n)}</b>${nv(e.n) ? `<small>sua vez ${nv(e.n)}</small>` : ''}</button>`).join('')
      + `<span class="lv-stage-out" title="Fora da jornada (com motivo)">Saída <b>${sai}</b></span>`
      + `<span class="lv-stage-lk"><a href="leads.html" data-leads title="${esc(NG.ajuda.live_leads)}">Todos os leads →</a><a href="funil.html" data-leads title="${esc(NG.ajuda.live_funil)}">Funil →</a></span>`;
  }

  function filtradas(comVez = soVez) {
    return jor.lista.filter((j) => (!etapaSel || j.etapa === etapaSel) && (!comVez || vez(j))).sort(NG.ordemJornada);
  }
  // Acompanhando: vendas que não pedem nada agora, mas que o time acompanha — biometria, instalação, pendência com terceiro;
  // conversa em espera (0101) ou em que o cliente só confirmou (0103).
  const acompanha = (j) => !vez(j) && ((!!j.venda_id && j.etapa >= 2 && j.etapa <= 5 && j.nivel !== 'ok' && j.nivel !== 'fora') || (!j.venda_id && (!!j.pendencia || !!j.cliente_confirmou)));
  function acompanhando() {
    return jor.lista.filter((j) => (!etapaSel || j.etapa === etapaSel) && acompanha(j)).sort(NG.ordemJornada);
  }
  // 0102 (trava B2): lead que a Mari passou e ninguém assumiu há mais de 30 min (horário de atendimento).
  const semDono = () => jor.lista.filter((j) => (j.sem_dono_min || 0) > 30);
  const faixaSemDono = () => {
    const l = semDono();
    if (!l.length) return '';
    return `<div class="faixa vermelho mv-semdono" role="alert"><b>${l.length} ${l.length === 1 ? 'cliente passado' : 'clientes passados'} pela Mari sem dono há mais de 30 min</b> — aperte <b>Assumir</b> na linha (estão no topo, em vermelho): ${l.slice(0, 4).map((j) => esc(j.nome || 'Contato')).join(', ')}${l.length > 4 ? '…' : ''}</div>`;
  };
  const abas = () => `${faixaSemDono()}<div class="lv-tabs" role="tablist" aria-label="Visão da lista">
      <button type="button" role="tab" data-aba="vez" aria-selected="${soVez}" class="lv-tab${soVez ? ' on' : ''}">Sua vez · ${filtradas(true).length} <span class="apagado">+ acompanhando ${acompanhando().length}</span></button>
      <button type="button" role="tab" data-aba="todas" aria-selected="${!soVez}" class="lv-tab${soVez ? '' : ' on'}">Todas · ${filtradas(false).length}</button>
      ${etapaSel ? `<button type="button" class="btn btn-sm" data-tirar-etapa>Filtro: ${esc(NG.JORNADA[etapaSel - 1].nome)} ✕</button>` : ''}</div>`;

  // ---------- lista ----------
  const situacao = (j) => [j.etapa_nome, j.pendencia ? `⏸ ${typeof j.pendencia === 'string' ? j.pendencia : 'pendência'}` : '', j.cliente_confirmou ? 'cliente confirmou' : ''].filter(Boolean).join(' · ');
  const linha = (j, paraFazer) => `<div class="lv-row n-${esc(j.nivel || 'ok')}${NGFicha.atual === chaveFicha(j) ? ' sel' : ''}" data-k="${esc(chaveFicha(j))}" tabindex="0" role="button">
      <div class="lv-who"><i class="lv-dot" aria-hidden="true"></i><div><b>${esc(j.nome || 'Contato')}</b><small>${esc([j.cidade, j.plano].filter(Boolean).join(' · ') || '—')} · há ${esc(haTempo(j.desde))}${funilHtml(j)}</small></div></div>
      <div class="lv-sit">${esc(situacao(j) || '—')}</div>
      <div class="lv-prox">${esc(j.o_que_fazer || '—')}</div>
      <div>${donoHtml(j)}</div>
      <div><span class="lv-pill">${esc(PRAZO[j.nivel] || '—')}</span></div>
      <div class="lv-act">${j.etapa >= 1 && j.etapa <= 3 ? NG.botaoOperador({ vendaId: j.venda_id, conversaId: j.conversa_id }, '⌖') : ''}<button type="button" class="btn btn-sm${paraFazer ? ' lv-go' : ''}" data-bt="${paraFazer ? esc(j.botao || 'abrir') : 'abrir'}" data-k="${esc(chaveFicha(j))}">${esc(paraFazer ? (BOTAO[j.botao] || 'Abrir') : 'Abrir')}${SETA}</button></div>
    </div>`;
  const cabTab = '<div class="lv-thead"><span>Cliente</span><span>Situação</span><span>Próximo passo</span><span>Dono</span><span>Prazo</span><span></span></div>';
  const secao = (tit, dica, corpo, cls = '') => `<section class="lv-sec${cls ? ` ${cls}` : ''}"><div class="lv-sec-h"><h2>${tit}</h2><span class="apagado">${dica}</span></div><div class="lv-table">${corpo}</div></section>`;
  // 0105: andamento na Nio sem venda — "casar pedido" (o nº do portal não bate com nenhuma venda: o BKO escolhe; nunca casa
  // sozinho pelo nome) e "biometria sem venda" (o CPF do GED360 não tem venda aberta).
  const andLinha = (p) => (p.tipo === 'casar_pedido'
    ? `<div class="lv-row n-hoje lv-and"><div class="lv-who"><i class="lv-dot"></i><div><b>${esc(p.nome || 'Cliente')}</b><small>portal: ${esc(p.rotulo)} · nº ${esc(p.chave)}${p.oferta ? ` · ${esc(p.oferta)}` : ''} · há ${esc(haTempo(p.desde))}</small></div></div>
        <div class="lv-sit">Casar pedido</div>
        <div class="lv-prox lv-and-bts">O nº do portal não bate com nenhuma venda. ${(p.sugestoes || []).length ? 'É uma destas?' : 'Nenhuma venda com nome parecido — abra a venda certa e confira o nº.'}
          ${(p.sugestoes || []).map((x) => `<button type="button" class="btn btn-sm" data-casar="${esc(p.chave)}" data-venda="${esc(x.venda_id)}" data-nome="${esc(x.nome)}">Casar com ${esc(x.nome)}${x.etapa ? ` · ${esc(x.etapa)}` : ''}${x.pedido ? ` · nº ${esc(x.pedido)}` : ''}</button>`).join(' ')}</div>
        <div><span class="mv-dono apagado">portal</span></div><div><span class="lv-pill">hoje</span></div><div class="lv-act"></div></div>`
    : `<div class="lv-row ${p.alerta ? 'n-agora' : 'n-hoje'} lv-and"><div class="lv-who"><i class="lv-dot"></i><div><b>Protocolo ${esc(p.chave)}</b><small>GED360: ${esc(p.rotulo)} · há ${esc(haTempo(p.desde))}</small></div></div>
        <div class="lv-sit">Biometria sem venda</div>
        <div class="lv-prox">${esc(p.alerta || 'O CPF desta biometria não tem venda aberta no NIOGEN — confira de quem é.')}</div>
        <div><span class="mv-dono apagado">GED360</span></div><div><span class="lv-pill">${p.alerta ? 'agora' : 'hoje'}</span></div>
        <div class="lv-act"><button type="button" class="btn btn-sm" data-visto="${esc(p.chave)}">Visto</button></div></div>`);
  // 0153 (etapa 1a): ninguém parado em silêncio. Cada linha diz o que travou e o que fazer; "Abrir" leva ao cliente.
  const CONF_SIT = { acao_falhou: 'Chatwoot não obedeceu', fora_niogen: 'Fora do NIOGEN', dono_parado: 'Parada com dono', handoff_parado: 'Ninguém pegou', pos_venda: 'Pós-venda', cancelar_nio: 'Cancelar na Nio', silencio_qualificado: 'Sem resposta', silencio_com_pedido: 'Sem resposta · com pedido', volta_hoje: 'Hora de voltar', docs_prazo: 'Documentos à Nio' };
  const confLinha = (c) => {
    const k = c.venda_id ? c.venda_id : c.conversa_id ? `c:${c.conversa_id}` : '';
    const urg = c.tipo === 'acao_falhou' || (c.tipo === 'docs_prazo' && /ATRASADOS/.test(c.texto || ''));
    const visto = c.tipo === 'fora_niogen' && /^(Atribuída|Adiada)/.test(c.texto || '');
    return `<div class="lv-row ${urg ? 'n-agora' : 'n-hoje'} lv-and"><div class="lv-who"><i class="lv-dot"></i><div><b>${esc(c.nome || 'Cliente')}</b><small>${c.desde ? `há ${esc(haTempo(c.desde))}` : ''}</small></div></div>
        <div class="lv-sit">${esc(CONF_SIT[c.tipo] || c.tipo)} ${NG.dicaTxt(NG.ajuda[`conf_${c.tipo}`] || NG.ajuda.conf_secao)}</div>
        <div class="lv-prox lv-and-bts">${esc(c.texto || '')}
          ${c.tipo === 'acao_falhou' ? `<button type="button" class="btn btn-sm" data-cf-retentar="${esc(c.chave)}" title="${esc(NG.ajuda.conf_tentar)}">Tentar de novo</button> <button type="button" class="btn btn-sm btn-ghost" data-cf-dispensar="${esc(c.chave)}" title="${esc(NG.ajuda.conf_dispensar)}">Dispensar</button>` : ''}
          ${c.tipo === 'cancelar_nio' ? `<button type="button" class="btn btn-sm" data-cf-cancelei="${esc(c.venda_id)}" title="${esc(NG.ajuda.conf_cancelei)}">Cancelei no portal</button>` : ''}
          ${c.tipo === 'silencio_qualificado' && c.venda_id ? `<button type="button" class="btn btn-sm btn-ghost" data-cf-semresp="${esc(c.venda_id)}" title="${esc(NG.ajuda.conf_semresp)}">Saída · Sem resposta</button>` : ''}
          ${visto ? `<button type="button" class="btn btn-sm btn-ghost" data-cf-visto="${esc(c.conversa_id)}" title="${esc(NG.ajuda.conf_visto)}">Visto</button>` : ''}</div>
        <div><span class="mv-dono apagado">conferir</span></div><div><span class="lv-pill">${urg ? 'agora' : 'hoje'}</span></div>
        <div class="lv-act">${k ? `<button type="button" class="btn btn-sm" data-cf-abrir="${esc(k)}">Abrir</button>` : ''}</div></div>`;
  };
  function renderLista() {
    const l = filtradas();
    const rol = listaEl.querySelector('.lv-rolar');
    const pos = rol ? rol.scrollTop : 0;
    let corpo = '';
    if (soVez) {
      const ac = acompanhando();
      const opL = ops.filter((o) => !etapaSel || etapaSel === 1);
      if (conf.length && !etapaSel) corpo += secao(`⚠ Conferir · ${conf.length} ${NG.dicaTxt(NG.ajuda.conf_secao)}`, 'o que ficou parado ou saiu do trilho — resolva ou dispense', conf.map(confLinha).join(''));
      corpo += secao(`Para fazer · ${l.length}`, 'ordem de urgência — pegue de cima para baixo', l.length ? cabTab + l.map((j) => linha(j, true)).join('') : '<div class="lv-vazio">Nada para fazer agora ✅ — acompanhe as vendas abaixo.</div>');
      corpo += secao(`Acompanhando · ${ac.length}`, 'esperando o cliente ou a Nio — volta para "Para fazer" sozinho na data', ac.length ? ac.map((j) => linha(j, false)).join('') : '<div class="lv-vazio">Nada sendo acompanhado.</div>');
      if (opL.length || opsCanal.length) {
        corpo += secao(`<span aria-hidden="true">🔥</span> Oportunidades · ${opL.length + opsCanal.length}`, 'o NIOGEN achou — não é obrigação; a mensagem sai pelo NIOGEN e a conversa volta para a Mari',
          `${opL.length ? `<div class="lv-thead lv-op"><span>Cliente</span><span>Por que agora · mensagem sugerida</span><span>Vale</span><span></span></div>${opL.map(opLinha).join('')}` : ''}${opsCanal.length ? `<div class="opc-bloco">${opsCanal.map((o) => NG.opCanalLinha(o)).join('')}</div>` : ''}`, 'lv-sec-op');
      }
      if (andPend.length) corpo += secao(`Andamento na Nio · ${andPend.length}`, 'pedido do portal ou biometria do GED360 sem venda no NIOGEN', andPend.map(andLinha).join(''));
    } else {
      corpo = secao(`Todas · ${l.length}`, '', l.length ? cabTab + l.map((j) => linha(j, vez(j))).join('') : '<div class="lv-vazio">Nenhuma linha.</div>');
    }
    listaEl.innerHTML = `${abas()}<div class="lv-rolar">${corpo}
      <div class="lv-legend"><span><span class="lv-pill n-agora">agora</span> cliente esperando ou prazo de 4 h</span><span><span class="lv-pill n-hoje">hoje</span> vence hoje</span><span><span class="lv-pill n-espera">aguardando</span> esperando terceiro, fora da sua vez até a data</span><span>a lista se atualiza a cada minuto</span></div></div>`;
    const novo = listaEl.querySelector('.lv-rolar');
    if (novo) novo.scrollTop = pos;   // a recarga de 1 min não joga a lista para o topo
  }

  // ---------- 🔥 oportunidades ----------
  // Cliente · motivo + mensagem sugerida (1 linha) · Vale · Enviar (oportunidade_enviar: a conversa volta para a Mari) · Ligar ·
  // Dispensar (motivo em 1 clique) · ⋯ (Editar e mandar · Mandar e assumir). Depois da ação, a linha mostra o resultado.
  function opLinha(o) {
    const cid = esc(o.conversa_id);
    const ligar = o.canal === 'ligar';   // 0110: janela fechada e template não aprovado → só ligar
    const jan = o.janela_fecha_em ? (new Date(o.janela_fecha_em) - Date.now()) / 60000 : -1;
    const janTxt = o.canal === 'template' ? ' · janela fechada → template' : ligar ? ' · janela fechada → ligar'
      : jan > 0 && jan <= 240 && o.codigo !== 'O1' ? ` · janela fecha em ${jan < 60 ? `${Math.round(jan)} min` : `${Math.floor(jan / 60)} h`}` : '';
    const vale = valeDe(o);
    const tel = String(o.telefone || '').replace(/\D/g, '');
    const feito = opFeitas[o.conversa_id];
    const acoes = feito ? `<span class="lv-pill n-ok">${esc(feito)}</span>`
      : opAberta === o.conversa_id ? `<span class="apagado">Por quê?</span>${motivosDispensa.map((m) => `<button type="button" class="btn btn-sm" data-opd="${cid}" data-motivo="${esc(m.codigo)}">${esc(m.nome)}</button>`).join('')}<button type="button" class="btn btn-sm btn-ghost" data-opx="${cid}" aria-label="Cancelar">×</button>`
      : `${ligar ? '' : `<button type="button" class="btn btn-sm lv-go" data-ope="${cid}" title="${o.canal === 'template' ? 'Manda o template aprovado' : 'Manda a mensagem sugerida'}: a Mari segue a conversa">Enviar</button>`}
         ${tel ? `<a class="btn btn-sm${ligar ? ' lv-go' : ''}" href="tel:+${esc(tel)}" data-oplig="${cid}" title="Abre o discador e registra a ligação">Ligar</a>` : ''}
         <button type="button" class="btn btn-sm" data-opn="${cid}" title="Some até amanhã (motivo em 1 clique)">Dispensar</button>
         ${ligar ? '' : `<details class="mv-op-menu"><summary class="btn btn-sm" title="Mais opções" aria-label="Mais opções">⋯</summary><button type="button" class="btn btn-sm" data-opm="${cid}">Editar e mandar</button><button type="button" class="btn btn-sm" data-opm="${cid}" data-assumir="1" title="Manda e atribui a você: a Mari cala e a cadência para">Mandar e assumir</button></details>`}`;
    return `<div class="lv-row lv-op" data-op="${cid}">
      <div class="lv-who"><span class="lv-fogo" aria-hidden="true">🔥</span><div><b>${esc(o.nome || 'Contato')}</b><small>${esc([o.cidade, o.plano].filter(Boolean).join(' · ') || '—')} · há ${esc(haTempo(o.parado_desde))}</small></div></div>
      <div class="lv-omot"><span title="${esc((o.regras || []).join(' + '))} · ${esc(String(o.pontos))} pontos">${esc(o.motivo || '')}<span class="warn-txt">${esc(janTxt)}</span></span>
        <small title="${esc(o.texto_sugerido || '')}">${ligar ? `Ligue para ${esc(telFmt(o.telefone))} — sem mensagem.` : `“${esc(o.texto_sugerido || '')}”`}</small></div>
      <div class="lv-vale" title="${esc(vale.tit)}">${esc(vale.txt)}</div>
      <div class="lv-act">${acoes}</div></div>`;
  }
  async function enviarOp(cid, b) {
    const o = ops.find((x) => x.conversa_id === cid);
    if (!o) return;
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('oportunidade_enviar', { p_conversa: cid, p_texto: o.canal === 'template' ? '' : (o.texto_sugerido || ''), p_assumir: false, p_template: o.canal === 'template' ? o.template : null });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    opFeitas[cid] = 'Enviada · volta pra Mari';
    NG.toast((data && data.resumo) || 'Mensagem enviada', 'ok');
    render();
    setTimeout(() => carregar(), 4000);
  }
  // Editar e mandar / Mandar e assumir: abre o cliente com o texto na caixa (Enter manda pela oportunidade_enviar). Celular/Quadro: janela.
  async function mandarOp(cid, assumir) {
    const o = ops.find((x) => x.conversa_id === cid);
    if (!o) return;
    const op = { codigo: o.codigo, texto: o.texto_sugerido || '', template: o.canal === 'template' ? o.template : null, assumir: !!assumir };
    if (telaCheia()) { NGFicha.oportunidadeCheia = op; abrirChave(`c:${cid}`); return; }
    const fd = await NG.modal(`
      <h3>🔥 ${esc(o.nome || 'Contato')}${o.cidade ? ` · ${esc(o.cidade)}` : ''}</h3>
      <p>${esc(o.motivo || '')}</p>
      <label class="campo">${op.template ? 'Template aprovado (janela de 24 h fechada)' : 'Mensagem (editável)'}<textarea name="texto" rows="5"${op.template ? ' readonly' : ''}>${esc(op.texto)}</textarea></label>
      <p class="nota-campo">${assumir ? 'Você assume a conversa: a Mari cala e a cadência para.' : 'Depois de mandar, a Mari segue a conversa (sem dono).'} Nunca desconto nem data de instalação.</p>`);
    if (!fd) return;
    const { data, error } = await NG.sb.rpc('oportunidade_enviar', { p_conversa: cid, p_texto: op.template ? '' : String(fd.get('texto') || ''), p_assumir: !!assumir, p_template: op.template });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opFeitas[cid] = assumir ? 'Enviada · com você' : 'Enviada · volta pra Mari';
    NG.toast((data && data.resumo) || 'Mensagem enviada', 'ok');
    await carregar();
  }
  // 0110: Ligar = abre o discador (tel:) e registra a ligação (nota no Chatwoot).
  async function ligarOp(cid) {
    const { data, error } = await NG.sb.rpc('oportunidade_ligar', { p_conversa: cid });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opFeitas[cid] = 'Ligação registrada';
    NG.toast((data && data.resumo) || 'Ligação registrada', 'ok');
    render();
  }
  async function dispensarOp(cid, motivo) {
    const { error } = await NG.sb.rpc('oportunidade_dispensar', { p_conversa: cid, p_motivo: motivo });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opAberta = null;
    opFeitas[cid] = 'Dispensada · some até amanhã';
    render();
  }

  // ---------- quadro (sem mudança nesta rodada: a ficha abre na gaveta) ----------
  function renderQuadro() {
    const atual = NGFicha.atual;
    const cols = NG.JORNADA.filter((e) => !etapaSel || e.n === etapaSel).map((e) => {
      const L = jor.lista.filter((j) => j.etapa === e.n && (!soVez || vez(j) || acompanha(j))).sort(NG.ordemJornada);
      const nv = jor.lista.filter((j) => j.etapa === e.n && vez(j)).length;
      return `<section class="mv-col"><div class="mv-colh"><b>${dot(e.n)}${e.n} · ${esc(e.nome)}</b><span class="${nv ? 'mv-vz' : 'apagado'}">${L.length}${nv ? ` · ${nv} sua vez` : ''}</span></div>
        <div class="mv-cards">${L.map((j) => `<div class="mv-kc ${j.nivel}${vez(j) ? '' : ' acomp'}${atual === chaveFicha(j) ? ' sel' : ''}" data-k="${esc(chaveFicha(j))}" tabindex="0" role="button">
          <b>${esc(j.nome || 'Contato')}</b><small>${esc([j.cidade, j.plano].filter(Boolean).join(' · ') || '—')}</small>
          <span class="mv-oque">${esc(j.o_que_fazer || '')}${j.portal_status ? ` <span class="chip dim" title="Status no portal PAP (Histórico de Pedidos)">portal: ${esc(j.portal_status.toLowerCase())}</span>` : ''}${j.biometria_ged ? ` <span class="chip dim" title="Biometria no GED360">bio: ${esc(j.biometria_ged.toLowerCase())}</span>` : ''}</span>
          <span class="mv-meta">${donoHtml(j)}<span class="apagado">há ${esc(haTempo(j.desde))}</span></span>
          ${vez(j) ? `<button type="button" class="btn btn-sm mv-go" data-bt="${esc(j.botao || 'abrir')}" data-k="${esc(chaveFicha(j))}">${esc(BOTAO[j.botao] || 'Abrir')}</button>` : ''}
        </div>`).join('') || '<span class="apagado mv-col-vazia">—</span>'}</div></section>`;
    }).join('');
    const sai = (jor.todas || []).filter((j) => j.etapa === 0);
    quadroEl.innerHTML = `${abas()}<div class="mv-board">${cols}</div>
      <div class="mv-saida apagado">Fora da jornada · <b>Saída ${sai.length}</b>${sai.length ? `: ${sai.slice(0, 8).map((j) => `${esc(NG.primeiroNome(j.nome))} (${esc(j.o_que_fazer)})`).join(' · ')}` : ''} · o card só muda de coluna pelo botão da ficha</div>`;
  }

  function render() {
    document.querySelectorAll('[data-vista]').forEach((b) => b.classList.toggle('on', b.dataset.vista === vista));
    renderIntro();
    renderFunil();
    listaEl.hidden = vista !== 'lista';
    quadroEl.hidden = vista !== 'quadro';
    if (vista === 'lista') renderLista(); else renderQuadro();
    sincCliente();
  }

  // ---------- cliente em tela cheia (Lista, computador) · gaveta (Quadro e celular) ----------
  const posicao = () => {
    const l = filtradas(true);
    const i = l.findIndex((j) => chaveFicha(j) === NGFicha.atual);
    return { i: i + 1, n: l.length, prev: i > 0 ? l[i - 1] : null, next: i >= 0 ? l[i + 1] || null : l[0] || null };
  };
  NGFicha.cheia(clienteEl, {
    posicao,
    aoNavegar(dir) {
      const p = posicao();
      const alvo = dir < 0 ? p.prev : p.next;
      if (alvo) abrirChave(chaveFicha(alvo));
    },
    // ✓ Nada a responder (0143): a ficha já dispensou o aviso no banco → abre o próximo de "Para fazer" (ou volta para a fila).
    aoConcluir() {
      const k = NGFicha.atual;
      const prox = filtradas(true).find((j) => chaveFicha(j) !== k);
      if (prox) { abrirChave(chaveFicha(prox)); NG.toast(`Aviso dispensado · próximo: ${NG.primeiroNome(prox.nome || 'Contato')}`, 'ok'); } else { NGFicha.fecharCheia(); NG.toast('Aviso dispensado · fila zerada ✅', 'ok'); }
    },
  });
  function modoFicha() {
    if (telaCheia()) NGFicha.usarCheia(); else NGFicha.usarGaveta();
  }
  // A tela do cliente desliza da direita e cobre a Fila (que recua um pouco para a esquerda).
  function sincCliente() {
    const aberto = NGFicha.modo === 'cheia' && NGFicha.aberta;
    clienteEl.classList.toggle('open', aberto);
    clienteEl.setAttribute('aria-hidden', String(!aberto));
    filaEl.classList.toggle('away', aberto);
    filaEl.setAttribute('aria-hidden', String(aberto));
    document.body.classList.toggle('lv-com-cliente', aberto);
  }
  NGFicha.aoFechar(() => { setTimeout(render, 0); });

  // ---------- "o NIOGEN fez sozinho" (Quadro e celular; na tela cheia o card Agora já mostra) ----------
  let feitoTimer = null;
  function avisoFeito(r) {
    if (!r || !r.feito || (telaCheia() && NGFicha.aberta)) return;
    feitoEl.innerHTML = `<b>O NIOGEN fez sozinho</b>${(r.feito || []).map((x) => `<span>✓ ${esc(x)}</span>`).join('')}
      ${r.aviso ? `<span class="warn-txt">${esc(r.aviso)}</span>` : ''}<button type="button" class="mv-feito-x" aria-label="Fechar o aviso">×</button>`;
    feitoEl.hidden = false;
    clearTimeout(feitoTimer);
    feitoTimer = setTimeout(() => { feitoEl.hidden = true; }, 9000);
  }
  feitoEl.addEventListener('click', (ev) => { if (ev.target.closest('.mv-feito-x')) feitoEl.hidden = true; });
  NGFicha.aoMudar((v, r) => { carregar(); if (r) avisoFeito(r); });

  // ---------- cliques ----------
  function abrirChave(k) {
    if (String(k).startsWith('c:')) NGFicha.abrirConversa(k.slice(2)); else NGFicha.abrir(k);
    setTimeout(sincCliente, 0);
  }
  async function botao(b) {
    const k = b.dataset.k;
    const j = jor.lista.find((x) => chaveFicha(x) === k);
    if (!j) return;
    if (b.dataset.bt === 'assumir') {
      b.disabled = true;
      const r = await NG.momento(j.venda_id || null, 'assumir', j.venda_id ? {} : { conversa_id: j.conversa_id });
      if (!r) { b.disabled = false; return; }
      avisoFeito(r);
      abrirChave(k);
      await carregar();
      return;
    }
    abrirChave(k);
  }
  async function casar(b) {
    if (!confirm(`Casar o pedido ${b.dataset.casar} do portal com a venda de ${b.dataset.nome}? O status do portal passa a valer para essa venda.`)) return;
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('portal_pedido_casar', { p_pedido: b.dataset.casar, p_venda: b.dataset.venda });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    NG.toast(`Pedido casado${data && data.feito ? ` · ${data.feito}` : ''}${data && data.alerta ? ` · ${data.alerta}` : ''}`, data && data.alerta ? 'bad' : 'ok');
    await carregar();
  }
  async function conferir(b) {
    if (b.dataset.cfAbrir) { abrirChave(b.dataset.cfAbrir); return; }
    if (b.dataset.cfCancelei && !confirm('Confirma que o pedido desta venda já foi cancelado no portal da Nio?')) return;
    if (b.dataset.cfSemresp && !confirm('Registrar a Saída · Sem resposta desta venda? Se o cliente escrever de novo, ela volta.')) return;
    b.disabled = true;
    const [fn, arg] = b.dataset.cfCancelei ? ['venda_cancelada_no_portal', { p_venda: b.dataset.cfCancelei }]
      : b.dataset.cfSemresp ? ['lead_sair', { p_conversa: null, p_venda: b.dataset.cfSemresp, p_motivo: 'sem_resposta' }]
      : b.dataset.cfRetentar ? ['chatwoot_acao_retentar', { p_id: Number(b.dataset.cfRetentar) }]
      : b.dataset.cfDispensar ? ['chatwoot_acao_dispensar', { p_id: Number(b.dataset.cfDispensar) }]
        : ['conversa_alerta_visto', { p_conversa: b.dataset.cfVisto }];
    const { data, error } = await NG.sb.rpc(fn, arg);
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    if (data && data.resumo) NG.toast(data.resumo, 'ok');
    await carregar();
  }
  async function vistoBio(b) {
    b.disabled = true;
    const { error } = await NG.sb.rpc('andamento_alerta_visto', { p_origem: 'ged360', p_chave: b.dataset.visto });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    await carregar();
  }
  function clique(ev) {
    if (ev.target.closest('a[data-leads]')) { ev.stopPropagation(); return; }   // 4b: o degrau da linha leva à tela Leads (o link segue)
    if (ev.target.closest('.mv-op-menu summary')) { ev.stopPropagation(); return; }
    const oe = ev.target.closest('[data-ope]');
    if (oe) { ev.stopPropagation(); enviarOp(oe.dataset.ope, oe); return; }
    const om = ev.target.closest('[data-opm]');
    if (om) { ev.stopPropagation(); mandarOp(om.dataset.opm, om.dataset.assumir === '1'); return; }
    const on = ev.target.closest('[data-opn]');
    if (on) { ev.stopPropagation(); opAberta = on.dataset.opn; render(); return; }
    const ox = ev.target.closest('[data-opx]');
    if (ox) { ev.stopPropagation(); opAberta = null; render(); return; }
    const olg = ev.target.closest('[data-oplig]');
    if (olg) { ev.stopPropagation(); ligarOp(olg.dataset.oplig); return; }   // o link tel: segue e abre o discador
    const od = ev.target.closest('[data-opd]');
    if (od) { ev.stopPropagation(); od.disabled = true; dispensarOp(od.dataset.opd, od.dataset.motivo); return; }
    if (ev.target.closest('.lv-op, .opc-bloco')) return;
    const cf = ev.target.closest('[data-cf-retentar], [data-cf-dispensar], [data-cf-visto], [data-cf-abrir], [data-cf-cancelei], [data-cf-semresp]');
    if (cf) { ev.stopPropagation(); conferir(cf); return; }
    const bc = ev.target.closest('[data-casar]');
    if (bc) { ev.stopPropagation(); casar(bc); return; }
    const bv = ev.target.closest('[data-visto]');
    if (bv) { ev.stopPropagation(); vistoBio(bv); return; }
    if (ev.target.closest('[data-tirar-etapa]')) { etapaSel = null; render(); return; }
    const b = ev.target.closest('[data-bt]');
    if (b) { ev.stopPropagation(); botao(b); return; }
    const t = ev.target.closest('[data-aba]');
    if (t) { soVez = t.dataset.aba === 'vez'; render(); return; }
    const r = ev.target.closest('.lv-row[data-k], .mv-kc[data-k]');
    if (r) abrirChave(r.dataset.k);
  }
  listaEl.addEventListener('click', clique);
  NG.ligarOpCanal(listaEl, () => carregar());   // 0117: Mandar mensagem / Agora não do canal parceiro
  quadroEl.addEventListener('click', clique);
  [listaEl, quadroEl].forEach((el) => el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.matches('.lv-row[data-k], .mv-kc[data-k]')) abrirChave(ev.target.dataset.k);
  }));
  funilEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-etapa]');
    if (!b) return;
    const n = Number(b.dataset.etapa);
    etapaSel = etapaSel === n ? null : n;
    render();
  });
  document.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => {
    vista = b.dataset.vista;
    ls.gravar('niogen.fila.vista', vista);
    modoFicha();
    render();
  }));
  movel.addEventListener('change', () => { modoFicha(); render(); });
  window.addEventListener('hashchange', () => setTimeout(sincCliente, 0));
  window.addEventListener('popstate', () => setTimeout(sincCliente, 0));

  NG.botaoAtualizar(() => carregar());
  modoFicha();
  // 11/11: a lista aparece na hora com a última jornada vista nesta aba (até 10 min) e é trocada pelo dado novo logo em seguida.
  const snap = NG.jornadaSnap();
  if (snap) {
    jor = { ...snap, lista: filtroBase(snap.lista) };
    try { render(); } catch (e) { /* a carga de verdade vem logo abaixo */ }
  }
  NGFicha.iniciar();   // #venda=<id> / #conversa=<id> no endereço: o cliente abre junto com a lista
  sincCliente();
  await carregar(false);
  // O refresh de 1 min também atualiza a ficha aberta (quieto: só redesenha se mudou, nunca por cima de formulário).
  setInterval(() => { if (document.visibilityState === 'visible') { carregar(false); if (NGFicha.atual) NGFicha.recarregar({ quieto: true }); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregar(false); });
})();
</script>
</body>
</html>
