<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  // 12/11 (0144 · docs/Prompt_pulso_live_121126_1035.md): faixa de pulso no topo — 1 chamada (pulso_operacao), disparada antes
  // da lista para correr na mesma rodada; ela também entrega os selos do menu (o menu não chama status_operacao aqui).
  if (['admin', 'backoffice'].includes(eu.perfil)) { document.body.dataset.pulso = '1'; NGPulso.montar(document.getElementById('pulso')); }
  NGSidebar.montar();
  const listaEl = document.getElementById('lista');
  if (!['admin', 'backoffice'].includes(eu.perfil)) {
    listaEl.innerHTML = '<div class="vazio">O Live é do backoffice. Use o Funil de vendas.</div>';
    return;
  }
  const filaEl = document.getElementById('fila');
  const clienteEl = document.getElementById('cliente');
  const funilEl = document.getElementById('funil');
  const quadroEl = document.getElementById('quadro');
  const feitoEl = document.getElementById('feito');
  const movel = window.matchMedia('(max-width: 900px)');
  const ls = { ler: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, gravar: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* modo privado */ } } };

  let jor = { lista: [], todas: [] };
  // 13/11 (Ricardo: "destino também no Live"). Etapa 4b: o degrau e o destino vêm da escada única (v_leads) — a mesma conta da
  // tela Leads, do Funil de vendas, do Painel e da ficha — e o clique leva à Leads já filtrada.
  let funilMap = {};
  const funilDe = (j) => funilMap[j.conversa_id] || (j.venda_id ? funilMap[`v:${j.venda_id}`] : null);
  const funilHtml = (j) => {
    const f = funilDe(j);
    if (!f || !f.etapa) return '';
    if (f.destino === 'saida' || f.destino === 'instalada') {
      const q = f.destino === 'saida' ? `aba=saidas${f.saida_motivo ? `&amp;saida=${esc(f.saida_motivo)}` : ''}` : 'aba=instaladas';
      return ` · <a class="cv-dest" data-leads href="leads.html?${q}" title="${esc(`${f.destino === 'saida' ? `Saída${f.saida_sub ? `: ${f.saida_sub}` : ''}` : 'Instalada'} — clique para ver na tela Leads`)}">${f.destino === 'instalada' ? '✅' : '⛔'} ${esc(f.destino === 'saida' ? f.saida_nome || 'Saída' : 'Instalada')}</a>`;
    }
    return ` · <a class="cv-etp" data-leads href="leads.html?aba=todos&amp;etapa=${esc(f.etapa)}" title="${esc(`Degrau da escada: ${f.etapa_nome}${f.status_nome ? ` · ${f.status_nome}` : ''} — clique para ver todos deste degrau na tela Leads`)}">${esc(f.etapa_nome || f.etapa)}</a>`;
  };
  let mira = [];      // 0206: 👀 Na mira — cliente escrevendo agora em Viabilidade/Pré-qualificado/Qualificado, ou que alguém acompanha
  let conf = [];      // 0153: lista "Conferir" — ação do Chatwoot que falhou, conversa mexida fora do NIOGEN, parada com dono, docs 15 d
  let andPend = [];   // 0105: pedidos do portal sem venda ("casar pedido") e biometrias sem venda (GED360)
  // 18/11 (Ricardo: "na Live, quando for uma instalação… botão de consultar a OS… inline"): última leitura guardada por venda
  // (selo "Nio: …"), a leitura de agora (faixa embaixo da linha) e quem está sendo lido.
  let osa = {};
  let osNum = {};     // venda → nº da OS/pedido (a v_jornada não traz; vem da v_vendas, só as vendas em Ativação/Agenda)
  const osLidas = {};
  const osLendo = {};
  // 19/11 (Ricardo: "Lead qualificado, que é o mais importante, aparece como na Live?" → "Sim, faz isso"): a venda que está perto
  // de fechar (Lead qualificado e Pedido/OS, etapas 2–3) sobe para o topo da Sua fila — logo abaixo do que está atrasado — e toda
  // linha de venda mostra quanto vale (vendas.comissao_prevista; sem ela, a comissão do plano na tabela).
  let comVenda = {};
  const valeVenda = (vid, plano) => {
    const c = vid ? Number(comVenda[vid]) : 0;
    if (c > 0) return { txt: NG.fmtMoeda(c), tit: 'comissão prevista desta venda' };
    const v = valeDe({ plano });
    return v.txt !== '—' && !/mês/.test(v.txt) ? v : null;
  };
  // a jornada pode ainda dizer "Conversa" de um lead que a escada (v_leads) já pôs em Lead qualificado (caso Gabriel Vinicius, 19/11)
  const quaseVenda = (j) => !!(j && ((j.venda_id && (j.etapa === 2 || j.etapa === 3)) || ((funilDe(j) || {}).etapa === 'qualificado' && (funilDe(j) || {}).destino === 'em_andamento')));
  // 19/11 (Ricardo: "Sim, troca"): o nome do degrau segue o ícone — a jornada ainda diz "Conversa" de quem a escada já qualificou.
  const etapaNome0 = (j) => (j && quaseVenda(j) && j.etapa < 2 ? 'Lead qualificado' : (j && j.etapa_nome) || '');
  // 21/11 (0342, fase 2 passo 4b (d) — debate da Live com o Ricardo): a Live lê a SITUAÇÃO GRAVADA pela porta (lead_estado).
  // "Sim, pela vez do time": vez do time na situação gravada entra no Para fazer, na ordem do prazo gravado. "Para fazer, como
  // alarme": os alarmes da v_jornada (precisa_acao) seguem lá, com o texto deles. "Sim, as 15": a coluna diz a situação.
  // "Sim, da situação": sem alarme, o texto e o botão são os da situação. Sem a leitura (0342 fora do ar), a Live de antes.
  let sitMap = {};
  const sitDe = (j) => (j && ((j.conversa_id && sitMap[`c:${j.conversa_id}`]) || (j.venda_id && sitMap[`v:${j.venda_id}`]))) || null;
  const vezTime = (j) => (sitDe(j) || {}).vez === 'time';
  const etapaNome = (j) => (sitDe(j) || {}).nome || etapaNome0(j);
  // a linha que entrou só pela vez gravada (sem alarme): texto, botão e prazo da situação
  const pelaSituacao = (j) => {
    if (j.precisa_acao || !vezTime(j)) return j;
    const st = sitDe(j);
    const venceu = st.prazo_em && new Date(st.prazo_em) <= Date.now();
    return { ...j, precisa_acao: true, pela_situacao: true, o_que_fazer: st.o_que_fazer || j.o_que_fazer, botao: st.botao || 'abrir',
      nivel: venceu ? 'agora' : 'hoje', desde: st.prazo_em || st.em || j.desde };
  };
  let feitosHoje = null;   // 19/11 (0315): ações suas hoje que passaram pela porta (porta_sombra.por = você)
  let opsCanal = [];  // 0117: 🔥 oportunidades do canal parceiro
  let ops = [];       // 0107: 🔥 oportunidades (sem as que já pedem ação)
  let opAberta = null;     // conversa_id da linha com "Dispensar" aberto (motivo em 1 clique)
  const opFeitas = {};     // conversa_id → "Enviada · volta pra Mari" (o resultado fica na linha)
  let motivosDispensa = [{ codigo: 'ja_falei', nome: 'Já falei' }, { codigo: 'nao_vale', nome: 'Não vale' }, { codigo: 'depois', nome: 'Depois' }];
  NG.sb.from('config_oportunidades').select('parametros').eq('codigo', 'geral').maybeSingle().then(({ data }) => {
    const m = data && data.parametros && data.parametros.dispensa_motivos;
    if (Array.isArray(m) && m.length) motivosDispensa = m;
  }, () => {});
  // "Vale" da oportunidade = comissão do plano + transição (config_planos / config_bonus) — lido uma vez, sem segurar a lista.
  let tabelaVale = null;
  Promise.all([NG.sb.from('config_planos').select('nome, nome_curto, comissao, cluster').eq('ativo', true),
    NG.sb.from('config_bonus').select('tipo, cluster, valor, valido_de, valido_ate').eq('tipo', 'transicao')]).then(([rp, rb]) => {
    const hoje = NG.diaSP();
    tabelaVale = { planos: rp.data || [], trans: (rb.data || []).filter((b) => b.valido_de <= hoje && (!b.valido_ate || b.valido_ate >= hoje)) };
    render();   // 19/11: o R$ das vendas (fallback pela tabela) também usa a tabela
  }, () => {});
  const valeDe = (o) => {
    const nm = String(o.plano || '').trim().toLowerCase();
    const pl = tabelaVale && nm ? tabelaVale.planos.find((x) => [x.nome, x.nome_curto].some((y) => String(y || '').trim().toLowerCase() === nm)) : null;
    if (pl && pl.comissao != null) {
      const t = tabelaVale.trans.find((b) => b.cluster === pl.cluster) || tabelaVale.trans.find((b) => b.cluster === 'regular');
      return { txt: NG.fmtMoeda(Number(pl.comissao) + (t ? Number(t.valor) : 0)), tit: `comissão ${NG.fmtMoeda(pl.comissao)}${t ? ` + transição ${NG.fmtMoeda(t.valor)}` : ''}` };
    }
    return o.valor_mes != null ? { txt: `${NG.fmtMoeda(o.valor_mes)}/mês`, tit: 'mensalidade (comissão do plano não encontrada na tabela)' } : { txt: '—', tit: '' };
  };
  let soVez = true;
  let etapaSel = null;
  let vista = ['lista', 'quadro'].includes(ls.ler('niogen.fila.vista')) ? ls.ler('niogen.fila.vista') : 'lista';

  const BOTAO = { assumir: 'Assumir', responder: 'Responder', viabilidade: 'Viabilidade', pedido: 'Gravar pedido', credito: 'Crédito', biometria: 'Biometria',
    os: 'OS e agenda', agendar: 'Agendar', os_agendar: 'OS e agenda', cartao: 'Cartão', reagendar: 'Reagendar', docs: 'Documentos', pendencia: 'Pendência', conferencia: 'Conferir', manual: 'Mandar à mão', abrir: 'Abrir' };
  const COR = Object.fromEntries(NG.JORNADA.map((e) => [e.n, e.cor]));
  const dot = (n) => `<i class="mv-dot" style="--c:${COR[n] || '#6E747C'}"></i>`;
  const ICO_ROBO = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2v3"/></svg>';
  const ICO_PESSOA = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/></svg>';
  const SETA = '<svg class="lv-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>';
  const donoHtml = (j) => {
    if (!j.dono_tipo) return '<span class="mv-dono apagado">sem dono</span>';
    const nome = j.dono_tipo === 'mari' ? 'Mari' : (NG.ehMeu(j.dono_nome) ? 'você' : j.dono_nome || 'time');
    return `<span class="mv-dono ${j.dono_tipo}">${j.dono_tipo === 'mari' ? ICO_ROBO : ICO_PESSOA}${esc(nome)}</span>`;
  };
  const haTempo = (iso) => {
    if (!iso) return '—';
    const min = Math.max(0, (Date.now() - new Date(iso)) / 60000);
    if (min < 60) return `${Math.round(min)} min`;
    if (min < 48 * 60) return `${Math.floor(min / 60)} h`;
    return `${Math.floor(min / 1440)} d`;
  };
  const telFmt = (t) => {
    const x = String(t || '').replace(/\D/g, '').replace(/^55(?=\d{10,11}$)/, '');
    return x.length === 11 ? `(${x.slice(0, 2)}) ${x.slice(2, 7)}-${x.slice(7)}` : x.length === 10 ? `(${x.slice(0, 2)}) ${x.slice(2, 6)}-${x.slice(6)}` : x || '—';
  };
  const chaveFicha = (j) => (j.venda_id ? j.venda_id : `c:${j.conversa_id}`);
  const vez = (j) => !!j.precisa_acao;
  const PRAZO = { agora: 'agora', hoje: 'hoje', espera: 'aguardando', ok: '—', fora: 'saída' };
  const telaCheia = () => vista === 'lista' && !movel.matches;
  // 15/11 (0219, Ricardo: "Pode fechar as 7 caixas"): a Live mostra a CAIXA de cada lead, calculada só no banco (v_jornada.caixa).
  // 2 Time precisa agir + 5 Sem caixa = Para fazer · 3 Com o time + 4 Venda andando = Acompanhando · 1 Mari conduzindo = uma linha
  // de radar · 6 Saída e 7 Instalada ficam fora. Sem a coluna (cache antigo), a regra de antes.
  const comCaixa = (j) => j.caixa !== undefined && j.caixa !== null;
  const filtroBase = (l) => l.filter((j) => vezTime(j) || (comCaixa(j) ? (j.precisa_acao || [3, 4].includes(j.caixa)) : (j.precisa_acao || j.dono_tipo === 'pessoa' || j.dono_tipo === 'time' || (j.venda_id && j.dono_tipo !== 'mari') || j.pendencia)));

  const LIVE_MAX_MS = 2 * 60000;   // 14/11 (0190): recarga obrigatória da Live mesmo sem gravação no banco
  // fresco=true (padrão): após ação/Atualizar, descarta o cache. Carga inicial e timer usam o que a barra lateral já buscou.
  async function carregar(fresco = true) {
    if (fresco) NG.limparCache();
    NG.mudou('live', LIVE_MAX_MS);   // 14/11 (0190): marca o carimbo desta carga — o timer só refaz se o banco mudar depois
    const pOp = NG.rpcOportunidades();   // 0108: em paralelo com a jornada
    const pOpc = NG.oportunidadesCanal();
    // 22/11 (0358, debate da Live — Ricardo: "A + C: uma chamada, pacote menor"): as 8 leituras que não são a jornada vêm num pacote
    // só (live_carga) — 2 idas e voltas a Oregon em vez de 9. Sem o pacote (perfil de fora ou 0358 fora do ar), as 8 chamadas de antes.
    const oito = () => Promise.all([NG.sb.from('v_andamento_pendencias').select('*').order('desde'),
      NG.sb.from('v_leads').select('conversa_id, venda_id, etapa, etapa_nome, status_nome, destino, saida_motivo, saida_nome, saida_sub').limit(3000),
      NG.sb.rpc('live_na_mira'), NG.sb.rpc('live_conferir'),
      NG.sb.from('v_os_andamento').select('venda_id, estado_nome, status_ordem, status_agendamento, agendamento_data, janela, pendencia, acao, excecao, mudou_em').not('venda_id', 'is', null),
      NG.sb.from('v_vendas').select('id, nio_os, nio_pedido, comissao_prevista').in('status', ['0_qualificado', '1_vendido', '2_aguardando_instalacao']),
      NG.sb.from('porta_sombra').select('id', { count: 'exact', head: true }).eq('por', eu.id).gte('em', `${NG.diaSP()}T00:00:00-03:00`),
      NG.sb.rpc('live_situacoes')]);   // 0342: a situação gravada de cada lead (~ms)
    const pacote = async () => {
      const k = await NG.sb.rpc('live_carga');
      const d = k && !k.error && k.data;
      if (!d || typeof d !== 'object') return oito();
      const ok = (x) => ({ data: x || [], error: null });
      return [ok(d.pendencias), ok(d.leads), ok(d.mira), ok(d.conferir), ok(d.os), ok(d.vendas), { count: Number(d.feitos) || 0, error: null }, ok(d.situacoes)];
    };
    const [r, [ap, rf, fn, rcf, rosa, rosn, rfeitos, rsit]] = await Promise.all([NG.jornada(), pacote()]);
    if (rfeitos && !rfeitos.error) feitosHoje = rfeitos.count || 0;
    if (rosn && !rosn.error) { osNum = {}; comVenda = {}; (rosn.data || []).forEach((v) => { osNum[v.id] = String(v.nio_os || v.nio_pedido || ''); comVenda[v.id] = v.comissao_prevista; }); }
    if (rosa && !rosa.error) { osa = {}; (rosa.data || []).forEach((o) => { const a = osa[o.venda_id]; if (!a || String(o.mudou_em) > String(a.mudou_em)) osa[o.venda_id] = o; }); }
    conf = rcf && !rcf.error && Array.isArray(rcf.data) ? rcf.data : [];
    mira = fn && !fn.error && Array.isArray(fn.data) ? fn.data : [];
    if (rf && !rf.error) {
      funilMap = {};
      (rf.data || []).forEach((l) => { if (l.conversa_id) funilMap[l.conversa_id] = l; if (l.venda_id) funilMap[`v:${l.venda_id}`] = l; });
    }
    andPend = ap.error ? [] : (ap.data || []);
    if (r.erro) { listaEl.innerHTML = `<div class="vazio">${esc(r.erro)}</div>`; return; }
    if (rsit && !rsit.error && Array.isArray(rsit.data)) {
      sitMap = {};
      rsit.data.forEach((x) => { if (x.conversa_id) sitMap[`c:${x.conversa_id}`] = x; if (x.venda_id && !sitMap[`v:${x.venda_id}`]) sitMap[`v:${x.venda_id}`] = x; });
    }
    jor = { ...r, lista: filtroBase(r.lista).map(pelaSituacao) };
    render();
    const [ro, rc] = await Promise.all([NG.oportunidades(r, pOp), pOpc]);
    ops = ro.erro ? [] : ro.lista;
    opsCanal = (rc && rc.lista) || [];

          sit: partes[0] || 'Oportunidade', selo: fvSelo(jPorConv[o.conversa_id]), oque: [partes.slice(1).join(' · '), o.canal === 'ligar' ? `Ligue para ${telFmt(o.telefone)} — sem mensagem` : ''].filter(Boolean).join(' · '),
          vez: vezTxt(vale.txt !== '—' ? `vale ${vale.txt}` : 'Mari', vale.txt !== '—' ? 'vale' : ''),
          prazo: jan > 0 && jan <= 240 ? 'hoje' : '—', urg: false, rank: jan > 0 && jan <= 240 ? 1 : 2, t: o.parado_desde, row: opLinha(o),
          bts: o.canal === 'ligar' ? '' : `<button type="button" class="btn btn-sm lv-go" data-ope="${esc(o.conversa_id)}">Enviar</button>` });
      });
    }
    // 19/11 (caso Gabriel — venda esperando o cliente): linha do Acompanhando que carrega um aviso do Conferir (Parada com dono,
    // OS na Nio…) é obrigação — sobe para a Sua fila como Conferir, com o aviso e os botões dele. Sem aviso, segue no Radar.
    ac.forEach((j) => {
      const avisos = confDe(j);
      if (!avisos.length) { L.push({ ...jItem(j, 'acomp'), rank: 5 }); return; }
      const urg = avisos.some(confUrg);
      const a0 = avisos[0];
      const txt = String(a0.texto || '');
      const corte = txt.indexOf(' — ');
      L.push({ ...jItem(j, 'conf'), selo: saidaSelo(j) + fvSelo(j) + osSelo(j),   // 19/11: o aviso já está no título — sem repetir no selo
        sit: `${CONF_SIT[a0.tipo] || confSit(a0.tipo)} · ${etapaNome(j) || 'Lead'}`, oque: corte > 0 ? txt.slice(corte + 3) : txt,
        prazo: urg ? 'agora' : 'hoje', urg, rank: urg ? 0 : 1 });
    });
    // 18/11 (0284): leads da Fila Vero com a Mari conduzindo (caixa 1) não saem do radar — o Ricardo quer vê-los entrando.
    if (!etapaSel || etapaSel === 1) {
      const jaTem = new Set(L.map((x) => x.k).filter(Boolean));
      (jor.todas || []).filter((j) => j.origem === 'fila_vero' && j.caixa === 1 && !jaTem.has(chaveFicha(j)) && !(j.conversa_id && jaTem.has(`c:${j.conversa_id}`)))
        .forEach((j) => L.push({ ...jItem(j, 'fv'), sit: `Com a Mari${etapaNome0(j) ? ` · ${etapaNome0(j)}` : ''}`,
          oque: j.o_que_fazer || 'A Mari está conduzindo; sobe para Para fazer se precisar de você', vez: vezTxt('Mari'), prazo: '—', urg: false, rank: 4 }));
    }
    const tms = (x) => new Date(x || 0).getTime() || 0;
    // atrasado (agora) primeiro; depois a venda perto de fechar; depois o resto pelo prazo — e, no empate, o mais antigo
    const prio = (x) => (x.rank === 0 ? (x.quali ? -0.5 : 0) : x.quali && x.rank < 5 ? 0.5 : x.rank);
    return L.sort((a, b) => prio(a) - prio(b) || (b.quali ? 1 : 0) - (a.quali ? 1 : 0) || tms(a.t) - tms(b.t));
  }
  const confSit = (tipo) => CONF_SIT[tipo] || String(tipo || 'Conferir').replace(/_/g, ' ').replace(/^./, (x) => x.toUpperCase());
  // 19/11 (Ricardo: "um selo (ícone mesmo) nas linhas que são Qualificados e Instalação… para bater o olho e saber do que aquela
  // linha se trata"): ícone do degrau da jornada antes do nome — o mesmo em toda parte da Live.
  const SELO_ETAPA = { 0: ['↩', 'Saída — lead que saiu da venda (Retomada, volta futura)'], 1: ['💬', 'Conversa — ainda não qualificou'],
    2: ['⭐', 'Lead qualificado — venda perto de fechar'], 3: ['📝', 'Pedido (OS) — pedido no portal, biometria e crédito'],
    4: ['🔧', 'Instalação — Ativação/Agenda na Nio'], 5: ['🏠', 'Instalada — pós-venda'] };
  const seloEtapa = (j) => {
    if (!j || j.etapa == null) return '';
    const e = quaseVenda(j) && j.etapa < 2 ? 2 : j.etapa;
    const s = SELO_ETAPA[e];
    return s ? `<span class="lv2-etp e${e}" title="${esc(s[1])}" aria-label="${esc(s[1])}">${s[0]}</span>` : '';
  };
  // 19/11 (caso Kell L-208 — "Ela está sem viabilidade e foi pra Live"): a linha de quem está em Saída diz POR QUÊ, em vermelho
  // (⛔ Fachada não atendida…), para ninguém oferecer plano a quem a Nio não atende. Vem da escada (v_leads), sem chamada nova.
  const saidaSelo = (j) => {
    const f = j && funilDe(j);
    if (!f || f.destino !== 'saida') return '';
    return ` <span class="lv2-sai" title="${esc(`Saída${f.saida_sub ? `: ${f.saida_sub}` : ''} — não ofereça plano antes de resolver isto`)}">⛔ ${esc(f.saida_nome || 'Saída')}</span>`;
  };
  const corBloco = (b) => (BLOCOS.find((x) => x.id === b) || {}).cor || (b === 'feito' ? '#57D38C' : '#8D97A3');
  const tagHtml = (b) => `<span class="lv2-tag" style="--c:${corBloco(b)}">${esc(b === 'feito' ? '✓ Feito' : NOME_BLOCO[b])}</span>`;
  // os botões da linha são os mesmos de antes (tirados da linha antiga): Abrir/Conferi, Enviar/Ligar/Dispensar, Casar, Acompanhar…
  const acoesDe = (html) => { const tp = document.createElement('template'); tp.innerHTML = html || ''; const a = tp.content.querySelector('.lv-act'); return a ? a.innerHTML : ''; };
  const itemLista = (it) => `<div class="lv2-it b-${it.bloco}${it.urg ? ' urg' : ''}${it.k && NGFicha.atual === it.k ? ' sel' : ''}" style="--c:${corBloco(it.bloco)}"${it.k ? ` data-k="${esc(it.k)}" tabindex="0" role="button"` : ''}>
      ${tagHtml(it.bloco)}
      <div class="lv2-who"><b>${it.etp || ''}${esc(it.nome)}${it.vale ? ` <span class="lv2-vale${it.quali ? ' q' : ''}" title="${esc(it.vale.tit || '')}">${esc(it.vale.txt)}</span>` : ''}</b><small>${esc(it.sub || '—')}</small></div>
      <div class="lv2-oque"${it.dica ? ` title="${esc(it.dica)}"` : ''}><b>${esc(it.sit || '')}${it.selo || ''}</b><span title="${esc([it.oque, it.dica].filter(Boolean).join(' — '))}">${esc(it.oque || '')}</span></div>
      <div>${it.vez || ''}</div>
      <div><span class="lv-pill n-${it.prazo === 'agora' ? 'agora' : it.prazo === 'hoje' ? 'hoje' : 'espera'}">${esc(it.prazo || '—')}</span></div>
      <div class="lv-act">${acoesDe(it.row)}</div>${osFaixa(it.vid)}
    </div>`;
  // 19/11 (0315, Ricardo: "nem sempre vejo uma forma de limpar a tela"): placar do dia. "Faltam" conta só o que é obrigação do time
  // (Para fazer · Conferir · Andamento na Nio); Na mira, 🔥 Oportunidades, Fila Vero e Acompanhando são radar e não entram (regra 18).
  const OBRIGA = ['fazer', 'conf', 'and'];
  const placar = (todos) => {
    const falta = todos.filter((x) => OBRIGA.includes(x.bloco)).length;
    const fz = feitosHoje == null ? '' : `${feitosHoje} ${feitosHoje === 1 ? 'feita' : 'feitas'} hoje · `;
    const dica = 'Feitas hoje: as suas ações que passaram pela porta do NIOGEN (Responder, Nada a responder, botões da ficha, Saída, ligação da Retomada…). Faltam: Para fazer + Conferir + Andamento na Nio — o resto é radar.';
    return falta
      ? `<span class="lv2-placar" title="${esc(dica)}">${esc(fz)}<b>faltam ${falta}</b></span>`
      : `<span class="lv2-placar ok" title="${esc(dica)}">${esc(fz)}<b>Fila limpa ✅</b> o resto está com a Mari ou esperando o cliente</span>`;
  };
  function filtros(todos) {
    const n = (b) => todos.filter((x) => x.bloco === b).length;
    return `<div class="lv2-filtros" role="group" aria-label="Mostrar só">
      <button type="button" class="lv2-chip${bloco ? '' : ' on'}" data-bloco="">Tudo <b>${todos.length}</b></button>
      ${BLOCOS.map((b) => `<button type="button" class="lv2-chip${bloco === b.id ? ' on' : ''}" data-bloco="${b.id}" style="--c:${b.cor}"><i aria-hidden="true"></i>${esc(b.nome)} <b>${n(b.id)}</b></button>`).join('')}
      ${placar(todos)}<span class="lv2-ordem apagado">o que vence primeiro fica em cima</span></div>`;
  }
  // 19/11 (Ricardo: "quando notifica… que é pra eu responder e eu respondo, a linha desaparece da Live porque eu respondi, mas
  // deveria ficar um tempo"): a linha que sai da Sua fila fica 15 min no mesmo lugar, apagada, com "✓ saiu da sua fila há N min —
  // agora: …" e o Abrir. Não conta no "faltam". A mesma linha no Radar espera esses 15 min (sem duplicar). Só nesta aba.
  const RECENTE_MS = 15 * 60000;
  const SS_RECENTES = 'niogen.live.recentes';
  let recentes = {};
  try { recentes = JSON.parse(sessionStorage.getItem(SS_RECENTES) || '{}') || {}; } catch (e) { recentes = {}; }
  let filaAnt = null;
  let filaAntSel = null;
  function lembrarSaidas(todos) {
    const agora = Date.now();
    const naFila = {};
    todos.filter((x) => OBRIGA.includes(x.bloco) && x.k).forEach((x) => { naFila[x.k] = x; });
    if (filaAnt && filaAntSel === etapaSel) {
      Object.keys(filaAnt).forEach((k) => {
        if (naFila[k] || recentes[k]) return;
        const x = filaAnt[k];
        recentes[k] = { t: agora, nome: x.nome, sub: x.sub, sit: x.sit, etp: x.etp, vale: x.vale, quali: x.quali };
      });
    }
    Object.keys(recentes).forEach((k) => { if (naFila[k] || agora - recentes[k].t > RECENTE_MS) delete recentes[k]; });
    filaAnt = naFila;
    filaAntSel = etapaSel;
    try { sessionStorage.setItem(SS_RECENTES, JSON.stringify(recentes)); } catch (e) { /* sem armazenamento: vale só até recarregar */ }
  }
  const itemRecente = (k, todos) => {
    const r = recentes[k];
    const ag = todos.find((x) => x.k === k);
    const min = Math.max(1, Math.round((Date.now() - r.t) / 60000));
    const agora = ag ? `agora: ${NOME_BLOCO[ag.bloco] || ag.bloco}${ag.sit ? ` · ${ag.sit}` : ''}` : 'agora: fora da Live (com a Mari ou encerrada)';
    return { bloco: 'feito', k, etp: r.etp, nome: r.nome, sub: r.sub, vale: r.vale, quali: r.quali, sit: `✓ ${r.sit || 'Feito'}`,
      oque: `saiu da sua fila há ${min} min — ${agora}`, vez: '', prazo: '—', urg: false,
      row: `<div class="lv-act"><button type="button" class="btn btn-sm btn-ghost" data-cf-abrir="${esc(k)}">Abrir</button></div>` };
  };
  function renderLista() {
    const rol = listaEl.querySelector('.lv-rolar');
    const pos = rol ? rol.scrollTop : 0;
    const todosC = itens();
    lembrarSaidas(todosC);
    const recK = new Set(Object.keys(recentes));
    const todos = todosC.filter((x) => !(x.k && recK.has(x.k) && !OBRIGA.includes(x.bloco)));   // a linha espera no lugar antigo
    const fantasmas = !bloco ? [...recK].map((k) => itemRecente(k, todosC)) : [];
    const vis = todos.filter((x) => !bloco || x.bloco === bloco);
    // 19/11 (Ricardo: "Separar trabalho e radar" · Radar aberto, só embaixo · 🔥 em faixa própria): três partes, de cima para baixo.
    // Sua fila = obrigação do time (Para fazer · Conferir · Andamento na Nio) — é o que o "faltam" conta e o que zera.
    // 🔥 Oportunidades = venda a pegar, à vista, sem contar como pendência (regra 18). Radar = não precisa de você agora
    // (Na mira · Acompanhando · Fila Vero · Mari conduzindo) — sempre aberto, como o Acompanhando já era (18/11).
    const trab = vis.filter((x) => OBRIGA.includes(x.bloco));
    const opsV = vis.filter((x) => x.bloco === 'op');
    const ordemRadar = { mira: 0, acomp: 1, fv: 2 };
    const radarTodo = vis.filter((x) => x.bloco in ordemRadar).sort((a, b) => ordemRadar[a.bloco] - ordemRadar[b.bloco]);
    // 19/11 (caso Sergio L-209 — "Esse não deveria ficar no topo da Live?" → "Sim, pode fazer assim"): venda (Lead qualificado ou
    // Pedido) em que o time falou por último fica no topo do Radar, numa faixa própria, a de mais tempo calada primeiro. Não conta
    // no "faltam" — a vez é do cliente —, mas não some no meio do Na mira.
    const vendaEsp = radarTodo.filter((x) => x.bloco === 'acomp' && x.quali)
      .sort((a, b) => (a.t ? new Date(a.t) : 0) - (b.t ? new Date(b.t) : 0));
    const radar = radarTodo.filter((x) => !vendaEsp.includes(x));
    const mariC = (jor.todas || []).filter((j) => j.caixa === 1 && (!etapaSel || j.etapa === etapaSel));
    const divisor = (tit, dica) => `<div class="lv2-div"><b>${tit}</b>${dica ? `<span>${dica}</span>` : ''}</div>`;
    const comOps = opsV.length || (opsCanal.length && (!bloco || bloco === 'op'));
    const comRadar = radarTodo.length || (mariC.length && !bloco);
    const faixaVenda = vendaEsp.length
      ? `<div class="lv2-sub">💰 <b>Venda esperando o cliente · ${vendaEsp.length}</b><span>você falou por último — sobe para a Sua fila quando ele responder ou se ficar parada</span></div>${vendaEsp.map(itemLista).join('')}${radar.length ? '<div class="lv2-sub fim"></div>' : ''}`
      : '';
    const parteTrab = !bloco || OBRIGA.includes(bloco)
      ? `${divisor('Sua fila', trab.length ? `faltam ${trab.length}` : '')}${trab.length ? trab.map(itemLista).join('') : '<div class="lv-vazio">Fila limpa ✅ — nada pede você agora</div>'}${fantasmas.map(itemLista).join('')}`
      : '';
    const parteOps = comOps
      ? `${divisor(`🔥 Oportunidades · ${opsV.length + (bloco && bloco !== 'op' ? 0 : opsCanal.length)}`, 'venda a pegar — não conta como pendência')}${opsV.map(itemLista).join('')}${opsCanal.length && (!bloco || bloco === 'op') ? `<div class="opc-bloco">${opsCanal.map((o) => NG.opCanalLinha(o)).join('')}</div>` : ''}`
      : '';
    const parteRadar = comRadar
      ? `${divisor('Radar', 'não precisa de você agora — sobe para a Sua fila sozinho se precisar')}${faixaVenda}${radar.map(itemLista).join('')}
        ${mariC.length && !bloco ? `<div class="lv-radar apagado" style="padding:10px 4px;font-size:13px"><span aria-hidden="true">🤖</span> <b>Mari conduzindo · ${mariC.length}</b> — sobe para cá sozinho se precisar de você · <a href="leads.html" data-leads>ver em Todos os leads →</a></div>` : ''}`
      : '';
    listaEl.innerHTML = `${abas()}${filtros(todos)}<div class="lv-rolar lv2">${parteTrab}${parteOps}${parteRadar}</div>`;
    const novo = listaEl.querySelector('.lv-rolar');
    if (novo) novo.scrollTop = pos;   // a recarga de 1 min não joga a lista para o topo
  }

  // ---------- 🔥 oportunidades ----------
  // Cliente · motivo + mensagem sugerida (1 linha) · Vale · Enviar (oportunidade_enviar: a conversa volta para a Mari) · Ligar ·
  // Dispensar (motivo em 1 clique) · ⋯ (Editar e mandar · Mandar e assumir). Depois da ação, a linha mostra o resultado.
  function opLinha(o) {
    const cid = esc(o.conversa_id);
    const ligar = o.canal === 'ligar';   // 0110: janela fechada e template não aprovado → só ligar
    const jan = o.janela_fecha_em ? (new Date(o.janela_fecha_em) - Date.now()) / 60000 : -1;
    const janTxt = o.canal === 'template' ? ' · janela fechada → template' : ligar ? ' · janela fechada → ligar'
      : jan > 0 && jan <= 240 && o.codigo !== 'O1' ? ` · janela fecha em ${jan < 60 ? `${Math.round(jan)} min` : `${Math.floor(jan / 60)} h`}` : '';
    const vale = valeDe(o);
    const tel = String(o.telefone || '').replace(/\D/g, '');
    const feito = opFeitas[o.conversa_id];
    const acoes = feito ? `<span class="lv-pill n-ok">${esc(feito)}</span>`
      : opAberta === o.conversa_id ? `<span class="apagado">Por quê?</span>${motivosDispensa.map((m) => `<button type="button" class="btn btn-sm" data-opd="${cid}" data-motivo="${esc(m.codigo)}">${esc(m.nome)}</button>`).join('')}<button type="button" class="btn btn-sm btn-ghost" data-opx="${cid}" aria-label="Cancelar">×</button>`
      : `${ligar ? '' : `<button type="button" class="btn btn-sm lv-go" data-ope="${cid}" title="${o.canal === 'template' ? 'Manda o template aprovado' : 'Manda a mensagem sugerida'}: a Mari segue a conversa">Enviar</button>`}
         ${tel ? `<a class="btn btn-sm${ligar ? ' lv-go' : ''}" href="tel:+${esc(tel)}" data-oplig="${cid}" title="Abre o discador e registra a ligação">Ligar</a>` : ''}
         <button type="button" class="btn btn-sm" data-opn="${cid}" title="Some até amanhã (motivo em 1 clique)">Dispensar</button>
         ${ligar ? '' : `<details class="mv-op-menu"><summary class="btn btn-sm" title="Mais opções" aria-label="Mais opções">⋯</summary><button type="button" class="btn btn-sm" data-opm="${cid}">Editar e mandar</button><button type="button" class="btn btn-sm" data-opm="${cid}" data-assumir="1" title="Manda e atribui a você: a Mari cala e a cadência para">Mandar e assumir</button></details>`}`;
    return `<div class="lv-row lv-op" data-op="${cid}">
      <div class="lv-who"><span class="lv-fogo" aria-hidden="true">🔥</span><div><b>${esc(o.nome || 'Contato')}</b><small>${esc([o.cidade, o.plano].filter(Boolean).join(' · ') || '—')} · há ${esc(haTempo(o.parado_desde))}</small></div></div>
      <div class="lv-omot"><span title="${esc((o.regras || []).join(' + '))} · ${esc(String(o.pontos))} pontos">${esc(o.motivo || '')}<span class="warn-txt">${esc(janTxt)}</span></span>
        <small title="${esc(o.texto_sugerido || '')}">${ligar ? `Ligue para ${esc(telFmt(o.telefone))} — sem mensagem.` : `“${esc(o.texto_sugerido || '')}”`}</small></div>
      <div class="lv-vale" title="${esc(vale.tit)}">${esc(vale.txt)}</div>
      <div class="lv-act">${acoes}</div></div>`;
  }
  async function enviarOp(cid, b) {
    const o = ops.find((x) => x.conversa_id === cid);
    if (!o) return;
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('oportunidade_enviar', { p_conversa: cid, p_texto: o.canal === 'template' ? '' : (o.texto_sugerido || ''), p_assumir: false, p_template: o.canal === 'template' ? o.template : null });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    opFeitas[cid] = 'Enviada · volta pra Mari';
    NG.toast((data && data.resumo) || 'Mensagem enviada', 'ok');
    render();
    setTimeout(() => carregar(), 4000);
  }
  // Editar e mandar / Mandar e assumir: abre o cliente com o texto na caixa (Enter manda pela oportunidade_enviar). Celular/Quadro: janela.
  async function mandarOp(cid, assumir) {
    const o = ops.find((x) => x.conversa_id === cid);
    if (!o) return;
    const op = { codigo: o.codigo, texto: o.texto_sugerido || '', template: o.canal === 'template' ? o.template : null, assumir: !!assumir };
    if (telaCheia()) { NGFicha.oportunidadeCheia = op; abrirChave(`c:${cid}`); return; }
    const fd = await NG.modal(`
      <h3>🔥 ${esc(o.nome || 'Contato')}${o.cidade ? ` · ${esc(o.cidade)}` : ''}</h3>
      <p>${esc(o.motivo || '')}</p>
      <label class="campo">${op.template ? 'Template aprovado (janela de 24 h fechada)' : 'Mensagem (editável)'}<textarea name="texto" rows="5"${op.template ? ' readonly' : ''}>${esc(op.texto)}</textarea></label>
      <p class="nota-campo">${assumir ? 'Você assume a conversa: a Mari cala e a cadência para.' : 'Depois de mandar, a Mari segue a conversa (sem dono).'} Nunca desconto nem data de instalação.</p>`);
    if (!fd) return;
    const { data, error } = await NG.sb.rpc('oportunidade_enviar', { p_conversa: cid, p_texto: op.template ? '' : String(fd.get('texto') || ''), p_assumir: !!assumir, p_template: op.template });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opFeitas[cid] = assumir ? 'Enviada · com você' : 'Enviada · volta pra Mari';
    NG.toast((data && data.resumo) || 'Mensagem enviada', 'ok');
    await carregar();
  }
  // 0110: Ligar = abre o discador (tel:) e registra a ligação (nota no Chatwoot).
  async function ligarOp(cid) {
    const { data, error } = await NG.sb.rpc('oportunidade_ligar', { p_conversa: cid });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opFeitas[cid] = 'Ligação registrada';
    NG.toast((data && data.resumo) || 'Ligação registrada', 'ok');
    render();
  }
  async function dispensarOp(cid, motivo) {
    const { error } = await NG.sb.rpc('oportunidade_dispensar', { p_conversa: cid, p_motivo: motivo });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opAberta = null;
    opFeitas[cid] = 'Dispensada · some até amanhã';
    render();
  }

  // ---------- quadro (17/11, passo 6): as 6 colunas são os blocos da Lista; dentro da coluna, quem vence primeiro fica em cima.
  // O card só muda de coluna pelo que acontece com o lead (o botão abre a ficha ou faz a ação da linha) — sem arrastar.
  function renderQuadro() {
    const atual = NGFicha.atual;
    const todos = itens();
    const cols = BLOCOS.filter((b) => !bloco || b.id === bloco).map((b) => {
      const L = todos.filter((x) => x.bloco === b.id);
      return `<section class="mv-col lv2-col" style="--c:${b.cor}"><div class="mv-colh"><b><i class="lv2-pt" aria-hidden="true"></i>${esc(b.nome)}</b><span class="apagado">${L.length}</span></div>
        <div class="mv-cards">${L.map((it) => `<div class="mv-kc lv2-kc${it.urg ? ' urg' : ''}${it.k && atual === it.k ? ' sel' : ''}"${it.k ? ` data-k="${esc(it.k)}" tabindex="0" role="button"` : ''}>
          <b>${esc(it.nome)}</b><small>${esc(it.sub || '—')}</small>
          <span class="mv-oque" title="${esc(it.oque)}">${esc(it.oque)}</span>
          <span class="mv-meta"><span class="lv-pill">${esc(it.prazo)}</span></span>
          ${it.bts ? `<div class="lv2-kbts">${it.bts}</div>` : ''}${osFaixa(it.vid)}
        </div>`).join('') || '<span class="apagado mv-col-vazia">—</span>'}</div></section>`;
    }).join('');
    quadroEl.innerHTML = `${abas()}${filtros(todos)}<div class="mv-board lv2-board">${cols}</div>`;
  }

  function render() {
    document.querySelectorAll('[data-vista]').forEach((b) => b.classList.toggle('on', b.dataset.vista === vista));
    // 17/11 (passo 6): sem o "Como usar" e sem a faixa das etapas — os filtros por tipo ficam junto da fila.
    document.getElementById('intro').innerHTML = '';
    funilEl.hidden = true;
    listaEl.hidden = vista !== 'lista';
    quadroEl.hidden = vista !== 'quadro';
    if (vista === 'lista') renderLista(); else renderQuadro();
    sincCliente();
  }

  // ---------- cliente em tela cheia (Lista, computador) · gaveta (Quadro e celular) ----------
  const posicao = () => {
    const l = filtradas(true);
    const i = l.findIndex((j) => chaveFicha(j) === NGFicha.atual);
    return { i: i + 1, n: l.length, prev: i > 0 ? l[i - 1] : null, next: i >= 0 ? l[i + 1] || null : l[0] || null };
  };
  NGFicha.cheia(clienteEl, {
    posicao,
    aoNavegar(dir) {
      const p = posicao();
      const alvo = dir < 0 ? p.prev : p.next;
      if (alvo) abrirChave(chaveFicha(alvo));
    },
    // ✓ Nada a responder (0143): a ficha já dispensou o aviso no banco → abre o próximo de "Para fazer" (ou volta para a fila).
    aoConcluir() {
      const k = NGFicha.atual;
      const prox = filtradas(true).find((j) => chaveFicha(j) !== k);
      if (prox) { abrirChave(chaveFicha(prox)); NG.toast(`Aviso dispensado · próximo: ${NG.primeiroNome(prox.nome || 'Contato')}`, 'ok'); } else { NGFicha.fecharCheia(); NG.toast('Aviso dispensado · fila zerada ✅', 'ok'); }
    },
  });
  function modoFicha() {
    if (telaCheia()) NGFicha.usarCheia(); else NGFicha.usarGaveta();
  }
  // A tela do cliente desliza da direita e cobre a Fila (que recua um pouco para a esquerda).
  function sincCliente() {
    const aberto = NGFicha.modo === 'cheia' && NGFicha.aberta;
    clienteEl.classList.toggle('open', aberto);
    clienteEl.setAttribute('aria-hidden', String(!aberto));
    filaEl.classList.toggle('away', aberto);
    filaEl.setAttribute('aria-hidden', String(aberto));
    document.body.classList.toggle('lv-com-cliente', aberto);
  }
  NGFicha.aoFechar(() => { setTimeout(render, 0); });

  // ---------- "o NIOGEN fez sozinho" (Quadro e celular; na tela cheia o card Agora já mostra) ----------
  let feitoTimer = null;
  function avisoFeito(r) {
    if (!r || !r.feito || (telaCheia() && NGFicha.aberta)) return;
    feitoEl.innerHTML = `<b>O NIOGEN fez sozinho</b>${(r.feito || []).map((x) => `<span>✓ ${esc(x)}</span>`).join('')}
      ${r.aviso ? `<span class="warn-txt">${esc(r.aviso)}</span>` : ''}<button type="button" class="mv-feito-x" aria-label="Fechar o aviso">×</button>`;
    feitoEl.hidden = false;
    clearTimeout(feitoTimer);
    feitoTimer = setTimeout(() => { feitoEl.hidden = true; }, 9000);
  }
  feitoEl.addEventListener('click', (ev) => { if (ev.target.closest('.mv-feito-x')) feitoEl.hidden = true; });
  NGFicha.aoMudar((v, r) => { carregar(); if (r) avisoFeito(r); });

  // ---------- cliques ----------
  function abrirChave(k) {
    if (String(k).startsWith('c:')) NGFicha.abrirConversa(k.slice(2)); else NGFicha.abrir(k);
    setTimeout(sincCliente, 0);
  }
  async function botao(b) {
    const k = b.dataset.k;
    const j = jor.lista.find((x) => chaveFicha(x) === k);
    if (!j) return;
    if (b.dataset.bt === 'assumir') {
      b.disabled = true;
      const r = await NG.momento(j.venda_id || null, 'assumir', j.venda_id ? {} : { conversa_id: j.conversa_id });
      if (!r) { b.disabled = false; return; }
      avisoFeito(r);
      abrirChave(k);
      await carregar();
      return;
    }
    abrirChave(k);
  }
  async function casar(b) {
    if (!confirm(`Casar o pedido ${b.dataset.casar} do portal com a venda de ${b.dataset.nome}? O status do portal passa a valer para essa venda.`)) return;
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('portal_pedido_casar', { p_pedido: b.dataset.casar, p_venda: b.dataset.venda });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    NG.toast(`Pedido casado${data && data.feito ? ` · ${data.feito}` : ''}${data && data.alerta ? ` · ${data.alerta}` : ''}`, data && data.alerta ? 'bad' : 'ok');
    await carregar();
  }
  async function conferir(b) {
    if (b.dataset.cfAbrir) { if (b.dataset.cfEtapa && window.NGFicha) NGFicha.etapaInicial = b.dataset.cfEtapa; abrirChave(b.dataset.cfAbrir); return; }
    if (b.dataset.cfCancelei && !confirm('Confirma que o pedido desta venda já foi cancelado no portal da Nio?')) return;
    if (b.dataset.cfRtx) { const m = prompt('Descartar este retorno. Por quê? (opcional)'); if (m === null) return; b.dataset.motivo = m; }   // 0379
    if (b.dataset.cfDescartar && !confirm(`Descartar ${b.dataset.nome}? Sai da Live com Saída · Sem resposta; se escrever de novo, volta.`)) return;
    if (b.dataset.cfSemresp && !confirm('Registrar a Saída · Sem resposta desta venda? Se o cliente escrever de novo, ela volta.')) return;
    if (b.dataset.cfDevolver !== undefined && !confirm('Devolver esta conversa para a Mari? Ela retoma, sem dono.')) return;
    if (b.dataset.cfReabrir !== undefined && !confirm('Reabrir este lead? Sai da Saída e volta para o time.')) return;
    b.disabled = true;
    const vOuNulo = (x) => x || null;
    // 0318: as saídas novas do Conferir
    const [fn, arg] = b.dataset.cfDevolver !== undefined ? ['backoffice_momento', { p_venda: vOuNulo(b.dataset.venda), p_momento: 'devolver_mari', p_dados: { conversa_id: b.dataset.cfDevolver } }]
      : b.dataset.cfNada ? ['backoffice_conversa_dispensar', { p_conversa: b.dataset.cfNada }]
      : b.dataset.cfReabrir !== undefined ? ['lead_reabrir', { p_conversa: b.dataset.venda ? null : vOuNulo(b.dataset.cfReabrir), p_venda: vOuNulo(b.dataset.venda) }]
      : b.dataset.cfAdiar !== undefined ? ['lead_volta_adiar', { p_conversa: vOuNulo(b.dataset.cfAdiar), p_venda: vOuNulo(b.dataset.venda), p_dias: 7 }]
      : b.dataset.cfOsvisto ? ['os_excecao_visto', { p_pedido: b.dataset.cfOsvisto }]
      : b.dataset.cfOsciente ? ['os_agenda_ciente', { p_pedido: b.dataset.cfOsciente }]
      : b.dataset.cfContavisto ? ['conferencia_visto', { p_codigo: b.dataset.cfContavisto }]
      : b.dataset.cfDocs ? ['venda_docs_entregues', { p_venda: b.dataset.cfDocs }]
      : b.dataset.cfCancelei ? ['venda_cancelada_no_portal', { p_venda: b.dataset.cfCancelei }]
      : b.dataset.cfSemresp ? ['lead_sair', { p_conversa: null, p_venda: b.dataset.cfSemresp, p_motivo: 'sem_resposta' }]
      : b.dataset.cfRetentar ? ['chatwoot_acao_retentar', { p_id: Number(b.dataset.cfRetentar) }]
      : b.dataset.cfDispensar ? ['chatwoot_acao_dispensar', { p_id: Number(b.dataset.cfDispensar) }]
      : b.dataset.cfRtfeito ? ['retorno_fechar', { p_retorno: b.dataset.cfRtfeito, p_como: 'feito', p_motivo: null }]
      : b.dataset.cfRtok ? ['retorno_fechar', { p_retorno: b.dataset.cfRtok, p_como: 'confirmar', p_motivo: null }]
      : b.dataset.cfRtx ? ['retorno_fechar', { p_retorno: b.dataset.cfRtx, p_como: 'descartar', p_motivo: b.dataset.motivo || null }]
      : b.dataset.cfRua ? ['cobertura_rua_conferida', { p_conversa: b.dataset.cfRua }]
      : b.dataset.cfUnidade ? ['cobertura_unidade_conferida', { p_conversa: b.dataset.cfUnidade }]
      : b.dataset.cfDescartar ? ['lead_sair', { p_conversa: b.dataset.cfDescartar, p_venda: b.dataset.venda || null, p_motivo: 'sem_resposta', p_obs: 'Descartado na Live (Fila Vero sem caixa)' }]
        : ['conversa_alerta_visto', { p_conversa: b.dataset.cfVisto }];
    const { data, error } = await NG.sb.rpc(fn, arg);
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    if (data && data.resumo) NG.toast(data.resumo, 'ok');
    await carregar();
  }
  async function vendaJanela(b) {
    const acao = b.dataset.jfAcao;
    if (acao === 'template') {
      const ok = await NG.modal(`<h3>Mandar o template</h3>
        <p>A janela de 24 h fechou: só sai mensagem aprovada pela Meta. Vai o template do degrau — <b>Lead qualificado</b>: "Oi, …! Aqui é você, que está cuidando do seu pedido… Quer continuar de onde paramos?"; <b>Pedido</b>: o lembrete da biometria.</p>
        <p class="apagado">A conversa segue com você. Se ele responder, a janela abre de novo e a linha vai para o topo da Sua fila.</p>`);
      if (!ok) return;
    }
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('venda_janela', { p_conversa: b.dataset.jf, p_acao: acao, p_motivo: null });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    NG.toast((data && data.resumo) || 'Registrado', 'ok');
    await carregar();
    if (acao === 'atendeu' && b.dataset.jfK) abrirChave(b.dataset.jfK);
  }
  async function retomadaLigacao(b) {
    const res = b.dataset.rlRes;
    let motivo = null;
    if (res === 'pular') {
      const fd = await NG.modal(`<h3>Pular a ligação da Retomada</h3>
        <p>A linha sai do Conferir. A Mari segue: se o cliente não responder, o D7 sai na data.</p>
        <label class="campo">Por quê?<select name="motivo" required><option value="">Escolha…</option><option>Telefone inválido</option><option>Já falei por mensagem</option><option>Não vale ligar</option><option>Outro</option></select></label>`);
      if (!fd) return;
      motivo = String(fd.get('motivo') || '') || null;
    }
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('retomada_ligacao', { p_conversa: b.dataset.rl, p_resultado: res, p_motivo: motivo });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    NG.toast((data && data.resumo) || 'Ligação registrada', 'ok');
    await carregar();
    if (res === 'atendeu' && b.dataset.rlK) abrirChave(b.dataset.rlK);
  }
  async function vistoBio(b) {
    b.disabled = true;
    const { error } = await NG.sb.rpc('andamento_alerta_visto', { p_origem: 'ged360', p_chave: b.dataset.visto });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    await carregar();
  }
  function clique(ev) {
    if (ev.target.closest('a[data-leads]')) { ev.stopPropagation(); return; }   // 4b: o degrau da linha leva à tela Leads (o link segue)
    if (ev.target.closest('.mv-op-menu summary')) { ev.stopPropagation(); return; }
    const oe = ev.target.closest('[data-ope]');
    if (oe) { ev.stopPropagation(); enviarOp(oe.dataset.ope, oe); return; }
    const om = ev.target.closest('[data-opm]');
    if (om) { ev.stopPropagation(); mandarOp(om.dataset.opm, om.dataset.assumir === '1'); return; }
    const on = ev.target.closest('[data-opn]');
    if (on) { ev.stopPropagation(); opAberta = on.dataset.opn; render(); return; }
    const ox = ev.target.closest('[data-opx]');
    if (ox) { ev.stopPropagation(); opAberta = null; render(); return; }
    const olg = ev.target.closest('[data-oplig]');
    if (olg) { ev.stopPropagation(); ligarOp(olg.dataset.oplig); return; }   // o link tel: segue e abre o discador
    const od = ev.target.closest('[data-opd]');
    if (od) { ev.stopPropagation(); od.disabled = true; dispensarOp(od.dataset.opd, od.dataset.motivo); return; }
    if (ev.target.closest('.lv-op, .opc-bloco, .lv2-it.b-op .lv-act')) return;
    const mi = ev.target.closest('[data-mira]');
    if (mi) { ev.stopPropagation(); acompanhar(mi); return; }
    const ma = ev.target.closest('[data-mira-abrir]');
    if (ma) {
      ev.stopPropagation();
      if (ma.dataset.vistoMira) NG.sb.rpc('conversa_acompanhar_visto', { p_conversa: ma.dataset.miraAbrir.slice(2) }).then(() => {}, () => {});
      abrirChave(ma.dataset.miraAbrir); return;
    }
    const osl = ev.target.closest('[data-os-ler]');
    if (osl) { ev.stopPropagation(); lerOs(osl.dataset.osLer); return; }
    const osx = ev.target.closest('[data-os-x]');
    if (osx) { ev.stopPropagation(); delete osLidas[osx.dataset.osX]; render(); return; }
    if (ev.target.closest('.lv2-os')) return;   // a faixa da leitura da OS não abre a ficha
    if (ev.target.closest('a.lv-rl[href^="tel:"]')) { ev.stopPropagation(); return; }   // 0315: o link segue e abre o discador
    const jfb = ev.target.closest('[data-jf]');
    if (jfb) { ev.stopPropagation(); vendaJanela(jfb); return; }
    const rl = ev.target.closest('[data-rl]');
    if (rl) { ev.stopPropagation(); retomadaLigacao(rl); return; }
    const cf = ev.target.closest('[data-cf-retentar], [data-cf-dispensar], [data-cf-visto], [data-cf-abrir], [data-cf-cancelei], [data-cf-semresp], [data-cf-rua], [data-cf-unidade], [data-cf-descartar], [data-cf-devolver], [data-cf-nada], [data-cf-reabrir], [data-cf-adiar], [data-cf-osvisto], [data-cf-osciente], [data-cf-contavisto], [data-cf-docs], [data-cf-rtfeito], [data-cf-rtx], [data-cf-rtok]');
    if (cf) { ev.stopPropagation(); conferir(cf); return; }
    const bc = ev.target.closest('[data-casar]');
    if (bc) { ev.stopPropagation(); casar(bc); return; }
    const bv = ev.target.closest('[data-visto]');
    if (bv) { ev.stopPropagation(); vistoBio(bv); return; }
    const fb = ev.target.closest('[data-bloco]');
    if (fb) { bloco = fb.dataset.bloco || null; ls.gravar('niogen.fila.bloco', bloco || ''); render(); return; }
    if (ev.target.closest('[data-semdono-x]')) { ls.gravar('niogen.fila.semdono_visto', chaveSemDono(semDono())); render(); return; }
    if (ev.target.closest('[data-tirar-etapa]')) { etapaSel = null; render(); return; }
    const b = ev.target.closest('[data-bt]');
    if (b) { ev.stopPropagation(); botao(b); return; }
    const t = ev.target.closest('[data-aba]');
    if (t) { soVez = t.dataset.aba === 'vez'; render(); return; }
    const r = ev.target.closest('.lv-row[data-k], .mv-kc[data-k], .lv2-it[data-k]');
    if (r && r.querySelector('[data-visto-mira]')) NG.sb.rpc('conversa_acompanhar_visto', { p_conversa: r.dataset.k.slice(2) }).then(() => {}, () => {});
    if (r) abrirChave(r.dataset.k);
  }
  listaEl.addEventListener('click', clique);
  NG.ligarOpCanal(listaEl, () => carregar());   // 0117: Mandar mensagem / Agora não do canal parceiro
  quadroEl.addEventListener('click', clique);
  [listaEl, quadroEl].forEach((el) => el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.matches('.lv-row[data-k], .mv-kc[data-k], .lv2-it[data-k]')) abrirChave(ev.target.dataset.k);
  }));
  funilEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-etapa]');
    if (!b) return;
    const n = Number(b.dataset.etapa);
    etapaSel = etapaSel === n ? null : n;
    render();
  });
  document.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => {
    vista = b.dataset.vista;
    ls.gravar('niogen.fila.vista', vista);
    modoFicha();
    render();
  }));
  movel.addEventListener('change', () => { modoFicha(); render(); });
  window.addEventListener('hashchange', () => setTimeout(sincCliente, 0));
  window.addEventListener('popstate', () => setTimeout(sincCliente, 0));

  NG.botaoAtualizar(() => carregar());
  modoFicha();
  // 11/11: a lista aparece na hora com a última jornada vista nesta aba (até 10 min) e é trocada pelo dado novo logo em seguida.
  const snap = NG.jornadaSnap();
  if (snap) {
    jor = { ...snap, lista: filtroBase(snap.lista) };
    try { render(); } catch (e) { /* a carga de verdade vem logo abaixo */ }
  }
  NGFicha.iniciar();   // #venda=<id> / #conversa=<id> no endereço: o cliente abre junto com a lista
  sincCliente();
  await carregar(false);
  // 21/11 (0339 · Ricardo: "Quero a faixa na Live"): faixa de atendimento pelas mensagens, depois da lista (não atrasa a fila).
  NGAtendimento.montar(document.getElementById('atendimento'));
  // O refresh de 1 min também atualiza a ficha aberta (quieto: só redesenha se mudou, nunca por cima de formulário).
  // 14/11 (0190 — Supabase engasgado): o tick de 1 min só refaz se algo foi gravado no banco (NG.mudou) ou a cada 2 min
  // (prazos que vencem com o relógio). Lead novo, mensagem ou ação de qualquer pessoa mudam o carimbo e entram no tick seguinte.
  setInterval(async () => {
    if (document.visibilityState !== 'visible' || !(await NG.mudou('live', LIVE_MAX_MS))) return;
    carregar(false); if (NGFicha.atual) NGFicha.recarregar({ quieto: true });
  }, 60000);
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && await NG.mudou('live', LIVE_MAX_MS)) carregar(false); });
})();
</script>
</body>
</html>
