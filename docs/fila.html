<!doctype html>
<!-- NIOGEN | docs/fila.html | 09/11/2026 — Claude Code
     "Live" (antiga "Minha vez", renomeada em 10/11 14h14): a tela de rotina do backoffice (1ª do menu).
     10/11 (0107 · docs/Prompt_mari_ao_vivo_oportunidades_101126_1400.md): grupo "🔥 Oportunidades" entre Para fazer e Acompanhando —
     v_oportunidades sem as que já pedem ação; Mandar mensagem abre a conversa aqui com o texto sugerido na caixa (Enter manda pela
     oportunidade_enviar: a Mari segue) · ▾ Mandar e assumir · Agora não (motivo em 1 clique, some até amanhã).
     09/11 (0089/0090 · docs/Prompt_ajustes_operacao_ficha_conversa_091126_1535.md · ponto 5): tudo vem da v_jornada (a regra única de
     "precisa de ação" — o mesmo número do menu, do Funil, do Painel e da Mari). Funil fino com as 5 etapas (total + "sua vez N",
     clique filtra) · abas Sua vez | Todas · Lista | Quadro (uma coluna por etapa; o card só muda pelo botão, sem arrastar) · ficha ao
     lado (Lista) ou em gaveta (Quadro) · a conversa abre no espaço da lista (Quadro: painel à esquerda da ficha) · depois de cada
     ação, "o NIOGEN fez sozinho" + "Próximo da fila: nome →" · 1º acesso: "Como usar, em 3 passos" (some em "Entendi").
     10/11 (0105): bloco "Andamento na Nio" no topo da Sua vez — "Casar pedido" (pedido do portal sem venda: botões com as
     sugestões pelo nome, casa só no clique) e "Biometria sem venda" (GED360) — e etiquetas portal/bio nas linhas.
     Cores discretas: bolinha por etapa, filete fino de urgência, verde cheio só no botão principal da ficha. Sem CPF nem endereço. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Live · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=101126-12">
<script src="config.js?v=101126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=101126-12"></script>
<script src="assets/sidebar.js?v=101126-12"></script>
<script src="assets/conversa.js?v=101126-12"></script>
<script src="assets/ficha.js?v=101126-12"></script>
</head>
<body class="tela-fila">
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="minhavez"></nav>
  <main class="main mv">
    <header class="cab">
      <div>
        <h1 class="live-tit"><span class="live-dot" aria-hidden="true"></span>Live</h1>
        <div class="sub" id="sub">Pegue a primeira linha e aperte o botão — a ficha abre ao lado. O NIOGEN cuida do Chatwoot.</div>
      </div>
      <div class="cab-acoes" id="cab-acoes">
        <div class="seg mv-vista" role="group" aria-label="Vista"><button type="button" data-vista="lista">Lista</button><button type="button" data-vista="quadro">Quadro</button></div>
      </div>
    </header>
    <div id="intro"></div>
    <div id="funil" class="mv-funil" aria-label="Etapas da jornada"></div>
    <div class="mv-trab" id="trab">
      <section class="mv-lista" id="lista" aria-label="Fila do backoffice"></section>
      <aside class="mv-ficha" id="ficha-lado" aria-label="Ficha" hidden></aside>
      <div class="mv-ficha-vazia" id="ficha-vazia"><span>Clique numa linha para abrir a ficha.</span></div>
    </div>
    <div id="quadro" class="mv-quadro" hidden></div>
  </main>
</div>
<div class="mv-feito" id="feito" role="status" aria-live="polite" hidden></div>
<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  NGSidebar.montar();
  const listaEl = document.getElementById('lista');
  if (!['admin', 'backoffice'].includes(eu.perfil)) {
    listaEl.innerHTML = '<div class="vazio">O Live é do backoffice. Use o Funil de vendas.</div>';
    return;
  }
  const funilEl = document.getElementById('funil');
  const quadroEl = document.getElementById('quadro');
  const trabEl = document.getElementById('trab');
  const fichaLado = document.getElementById('ficha-lado');
  const fichaVazia = document.getElementById('ficha-vazia');
  const feitoEl = document.getElementById('feito');
  const movel = window.matchMedia('(max-width: 900px)');
  const ls = { ler: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, gravar: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* modo privado */ } } };

  let jor = { lista: [], todas: [] };
  let andPend = [];   // 0105: pedidos do portal sem venda ("casar pedido") e biometrias sem venda (GED360)
  let ops = [];       // 0107: 🔥 oportunidades (v_oportunidades, sem as que já pedem ação)
  let opAtualizado = 0;
  let opAberta = null;   // conversa_id da linha com "Agora não" aberto (motivos em 1 clique)
  let motivosDispensa = [{ codigo: 'ja_falei', nome: 'Já falei' }, { codigo: 'nao_vale', nome: 'Não vale' }, { codigo: 'depois', nome: 'Depois' }];
  NG.sb.from('config_oportunidades').select('parametros').eq('codigo', 'geral').maybeSingle().then(({ data }) => {
    const m = data && data.parametros && data.parametros.dispensa_motivos;
    if (Array.isArray(m) && m.length) motivosDispensa = m;
  }, () => {});
  let soVez = true;
  let etapaSel = null;
  let vista = ['lista', 'quadro'].includes(ls.ler('niogen.fila.vista')) ? ls.ler('niogen.fila.vista') : 'lista';
  let conv = null;   // { id, nome, comp } — conversa aberta no lugar da lista

  const BOTAO = { assumir: 'Assumir', responder: 'Responder', viabilidade: 'Viabilidade', pedido: 'Gravar pedido', biometria: 'Biometria',
    os: 'Abrir a OS', agendar: 'Agendar', os_agendar: 'OS + agendar', reagendar: 'Reagendar', docs: 'Documentos', pendencia: 'Pendência', conferencia: 'Conferir', manual: 'Mandar à mão', abrir: 'Abrir' };
  const COR = Object.fromEntries(NG.JORNADA.map((e) => [e.n, e.cor]));
  const dot = (n) => `<i class="mv-dot" style="--c:${COR[n] || '#6E747C'}"></i>`;
  const ICO_ROBO = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2v3"/></svg>';
  const ICO_PESSOA = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/></svg>';
  const donoHtml = (j) => {
    if (!j.dono_tipo) return '<span class="mv-dono apagado">sem dono</span>';
    const nome = j.dono_tipo === 'mari' ? 'Mari' : (j.dono_nome === eu.nome ? 'você' : j.dono_nome || 'time');
    return `<span class="mv-dono ${j.dono_tipo}">${j.dono_tipo === 'mari' ? ICO_ROBO : ICO_PESSOA}${esc(nome)}</span>`;
  };
  const haTempo = (iso) => {
    if (!iso) return '—';
    const min = Math.max(0, (Date.now() - new Date(iso)) / 60000);
    if (min < 60) return `${Math.round(min)} min`;
    if (min < 48 * 60) return `${Math.floor(min / 60)} h`;
    return `${Math.floor(min / 1440)} d`;
  };
  const chaveFicha = (j) => (j.venda_id ? j.venda_id : `c:${j.conversa_id}`);
  const vez = (j) => !!j.precisa_acao;

  async function carregar() {
    const [r, ap] = await Promise.all([NG.jornada(), NG.sb.from('v_andamento_pendencias').select('*').order('desde')]);
    andPend = ap.error ? [] : (ap.data || []);
    if (r.erro) { listaEl.innerHTML = `<div class="vazio">${esc(r.erro)}</div>`; return; }
    // 0102 (Ricardo, 10/11): Live = só o que é humano. Linha que precisa de ação ou com dono pessoa/time; conversa que a
    // Mari está tocando sozinha sai também do "Todas" (supervisão dela é na tela Mari IA).
    // 0107: 🔥 oportunidades (calculadas sobre a jornada inteira, antes do filtro: o que já pede ação não vira oportunidade).
    const ro = await NG.oportunidades(r);
    ops = ro.erro ? [] : ro.lista;
    if (!opAtualizado || Date.now() - opAtualizado > 5 * 60000) {   // grava "mostrada" e os resultados (idempotente)
      opAtualizado = Date.now();
      NG.sb.rpc('oportunidades_atualizar').then(() => {}, () => {});
    }
    r.lista = r.lista.filter((j) => j.precisa_acao || j.dono_tipo === 'pessoa' || j.dono_tipo === 'time' || (j.venda_id && j.dono_tipo !== 'mari') || j.pendencia);
    jor = r;
    render();
    reporConversaFoco();
  }

  // ---------- como usar (1º acesso) ----------
  function renderIntro() {
    const el = document.getElementById('intro');
    if (ls.ler('niogen.fila.intro') === 'ok' || conv) { el.innerHTML = ''; return; }
    el.innerHTML = `<div class="mv-intro"><div><b>Como usar, em 3 passos</b><ol>
      <li><b>Pegue a primeira linha.</b> "Sua vez" já vem na ordem: vermelho é agora, amarelo é hoje.</li>
      <li><b>Aperte o botão da linha.</b> A ficha abre ao lado e diz o próximo passo. Um botão por vez.</li>
      <li><b>Fale com o cliente pela barra "Conversa" da ficha.</b> Etiqueta, atribuição e nota o NIOGEN faz sozinho.</li></ol>
      <span class="apagado">Funil, Mari e Instalações continuam no menu para consultar.</span></div><button type="button" class="btn btn-sm" id="intro-ok">Entendi</button></div>`;
    document.getElementById('intro-ok').onclick = () => { ls.gravar('niogen.fila.intro', 'ok'); renderIntro(); };
  }

  // ---------- funil fino ----------
  function renderFunil() {
    const n = (e) => jor.lista.filter((j) => j.etapa === e).length;
    const nv = (e) => jor.lista.filter((j) => j.etapa === e && vez(j)).length;
    const sai = (jor.todas || []).filter((j) => j.etapa === 0).length;
    if (conv && vista === 'lista') {
      funilEl.className = 'mv-funil fino';
      funilEl.innerHTML = NG.JORNADA.map((e) => `<button type="button" data-etapa="${e.n}" class="${etapaSel === e.n ? 'sel' : ''}">${dot(e.n)}${esc(e.nome)} <b>${n(e.n)}</b>${nv(e.n) ? `<span class="mv-vz">· ${nv(e.n)}</span>` : ''}</button>`).join('');
      return;
    }
    funilEl.className = 'mv-funil';
    funilEl.innerHTML = NG.JORNADA.map((e) => `<button type="button" class="mv-st${etapaSel === e.n ? ' sel' : ''}" data-etapa="${e.n}" aria-pressed="${etapaSel === e.n}">
        <span class="mv-st-n">ETAPA ${e.n}</span><b>${dot(e.n)}${esc(e.nome)}</b>
        <span class="mv-st-c"><strong>${n(e.n)}</strong><span class="${nv(e.n) ? 'mv-vz' : 'apagado'}">${nv(e.n) ? `sua vez ${nv(e.n)}` : '—'}</span></span></button>`).join('')
      + `<span class="mv-fora" title="Fora da jornada (com motivo)">Saída ${sai}</span>`;
  }

  function filtradas(comVez = soVez) {
    return jor.lista.filter((j) => (!etapaSel || j.etapa === etapaSel) && (!comVez || vez(j))).sort(NG.ordemJornada);
  }
  // Acompanhando: vendas que não pedem nada agora, mas que o time acompanha — biometria, instalação, pendência com terceiro.
  // (As conversas que a Mari está tocando sozinha não aparecem no Live — nem em "Todas" — desde a 0102.)
  // 0101: conversa em espera ("⏸ Aguardando · motivo · até DD/MM") também fica em Acompanhando.
  // 0103: conversa em que o cliente só confirmou ("ok", 👍) também fica em Acompanhando; volta para a Sua vez em 4 h úteis.
  const acompanha = (j) => !vez(j) && ((!!j.venda_id && j.etapa >= 2 && j.etapa <= 5 && j.nivel !== 'ok' && j.nivel !== 'fora') || (!j.venda_id && (!!j.pendencia || !!j.cliente_confirmou)));
  function acompanhando() {
    return jor.lista.filter((j) => (!etapaSel || j.etapa === etapaSel) && acompanha(j)).sort(NG.ordemJornada);
  }
  // 0102 (trava B2): lead que a Mari passou e ninguém assumiu há mais de 30 min (contando só o horário de atendimento).
  const semDono = () => jor.lista.filter((j) => (j.sem_dono_min || 0) > 30);
  const faixaSemDono = () => {
    const l = semDono();
    if (!l.length) return '';
    return `<div class="faixa vermelho mv-semdono" role="alert"><b>${l.length} ${l.length === 1 ? 'cliente passado' : 'clientes passados'} pela Mari sem dono há mais de 30 min</b> — aperte <b>Assumir</b> na linha (estão no topo, em vermelho): ${l.slice(0, 4).map((j) => esc(j.nome || 'Contato')).join(', ')}${l.length > 4 ? '…' : ''}</div>`;
  };
  const abas = () => `${faixaSemDono()}<div class="mv-abas"><div class="mv-tabs" role="tablist">
      <button type="button" role="tab" data-aba="vez" aria-selected="${soVez}" class="${soVez ? 'on' : ''}" title="O que é para fazer agora e hoje, e embaixo o que você acompanha">Sua vez · ${filtradas(true).length}<span class="mv-acomp-n"> + acompanhando ${acompanhando().length}</span></button>
      <button type="button" role="tab" data-aba="todas" aria-selected="${!soVez}" class="${soVez ? '' : 'on'}">Todas · ${filtradas(false).length}</button></div>
      <span class="apagado">${etapaSel ? `Só ${esc(NG.JORNADA[etapaSel - 1].nome)} · clique de novo na etapa para tirar` : 'Clique numa etapa para filtrar'}</span></div>`;

  // ---------- lista ----------
  function renderLista() {
    if (conv) return;   // a conversa está no lugar da lista
    const l = filtradas();
    const atual = NGFicha.atual;
    const linha = (j) => `<div class="mv-row ${j.nivel}${vez(j) ? '' : ' acomp'}${atual === chaveFicha(j) ? ' sel' : ''}" data-k="${esc(chaveFicha(j))}" tabindex="0" role="button">
        <span class="mv-et" title="${esc(j.etapa_nome)}">${dot(j.etapa)}<span>${esc(j.etapa_nome)}</span></span>
        <span class="mv-cli"><b>${esc(j.nome || 'Contato')}</b><small>${esc([j.cidade, j.plano].filter(Boolean).join(' · ') || '—')}<span class="mv-ha-2"> · há ${esc(haTempo(j.desde))}</span></small></span>
        <span class="mv-oque">${esc(j.o_que_fazer || '')}${j.portal_status ? ` <span class="chip dim" title="Status no portal PAP (Histórico de Pedidos)">portal: ${esc(j.portal_status.toLowerCase())}</span>` : ''}${j.biometria_ged ? ` <span class="chip dim" title="Biometria no GED360">bio: ${esc(j.biometria_ged.toLowerCase())}</span>` : ''}</span>
        <span class="mv-ha apagado">${esc(haTempo(j.desde))}</span>
        ${donoHtml(j)}
        <span class="mv-bt"><button type="button" class="btn btn-sm${vez(j) ? ' mv-go' : ''}" data-bt="${vez(j) ? esc(j.botao || 'abrir') : 'abrir'}" data-k="${esc(chaveFicha(j))}">${esc(vez(j) ? (BOTAO[j.botao] || 'Abrir') : 'Abrir')}</button></span>
      </div>`;
    const ac = soVez ? acompanhando() : [];
    const grupo = (tit, sub) => `<div class="mv-grupo"><b>${tit}</b><span class="apagado">${sub}</span></div>`;
    let linhas = l.map(linha).join('');
    // 0105: andamento na Nio sem venda — "casar pedido" (o nº do portal não bate com nenhuma venda: o BKO escolhe; nunca casa
    // sozinho pelo nome) e "biometria sem venda" (o CPF do GED360 não tem venda aberta).
    const andLinha = (p) => p.tipo === 'casar_pedido'
      ? `<div class="mv-row hoje mv-and"><span class="mv-et">${dot(3)}<span>Casar pedido</span></span>
          <span class="mv-cli"><b>${esc(p.nome || 'Cliente')}</b><small>portal: ${esc(p.rotulo)} · nº ${esc(p.chave)}${p.oferta ? ` · ${esc(p.oferta)}` : ''}</small></span>
          <span class="mv-oque">O nº do portal não bate com nenhuma venda. ${(p.sugestoes || []).length ? 'É uma destas?' : 'Nenhuma venda com nome parecido — abra a venda certa e confira o nº.'}
            ${(p.sugestoes || []).map((x) => `<button type="button" class="btn btn-sm" data-casar="${esc(p.chave)}" data-venda="${esc(x.venda_id)}" data-nome="${esc(x.nome)}">Casar com ${esc(x.nome)}${x.etapa ? ` · ${esc(x.etapa)}` : ''}${x.pedido ? ` · nº ${esc(x.pedido)}` : ''}</button>`).join(' ')}</span>
          <span class="mv-ha apagado">${esc(haTempo(p.desde))}</span><span class="mv-dono apagado">portal</span><span class="mv-bt"></span></div>`
      : `<div class="mv-row ${p.alerta ? 'agora' : 'hoje'} mv-and"><span class="mv-et">${dot(3)}<span>Biometria sem venda</span></span>
          <span class="mv-cli"><b>Protocolo ${esc(p.chave)}</b><small>GED360: ${esc(p.rotulo)}</small></span>
          <span class="mv-oque">${esc(p.alerta || 'O CPF desta biometria não tem venda aberta no NIOGEN — confira de quem é.')}</span>
          <span class="mv-ha apagado">${esc(haTempo(p.desde))}</span><span class="mv-dono apagado">GED360</span>
          <span class="mv-bt"><button type="button" class="btn btn-sm" data-visto="${esc(p.chave)}">Visto</button></span></div>`;
    const blocoAnd = soVez && andPend.length
      ? grupo(`Andamento na Nio · ${andPend.length}`, 'pedido do portal ou biometria do GED360 sem venda no NIOGEN') + andPend.map(andLinha).join('') : '';
    if (soVez) {
      const opL = ops.filter((o) => !etapaSel || etapaSel === 1);
      linhas = (l.length ? grupo(`Para fazer · ${l.length}`, 'vermelho = agora · amarelo = hoje') + linhas
        : '<div class="mv-nada">Nada para fazer agora ✅ — acompanhe as vendas abaixo.</div>')
        + (opL.length ? `<div class="mv-grupo mv-grupo-op"><b>🔥 Oportunidades · a Mari acha que uma mensagem sua esquenta · ${opL.length}</b><span class="apagado">não é obrigação: mande, assuma ou "Agora não". Depois de mandar, a Mari segue a conversa.</span></div>`
          + opL.map((o, i) => opLinha(o, i)).join('') : '')
        + (ac.length ? grupo(`Acompanhando · ${ac.length}`, 'esperando o cliente ou a Nio — biometria, instalação, pendência. Volta para "Para fazer" sozinha quando precisar.') + ac.map(linha).join('') : '');
    }
    listaEl.innerHTML = `${abas()}
      <div class="mv-rolar"><div class="mv-row mv-cab mono"><span>ETAPA</span><span>CLIENTE</span><span>O QUE FAZER</span><span>HÁ</span><span>DONO</span><span></span></div>
      ${blocoAnd}${linhas || `<div class="vazio">${soVez ? 'Nada para fazer nem acompanhar agora ✅ — veja "Todas".' : 'Nenhuma linha.'}</div>`}</div>
      <div class="mv-pe apagado">Vermelho = agora (cliente esperando ou prazo de 4 h) · amarelo = hoje · ⏸ azul = esperando terceiro, fora da sua vez até a data · a lista se atualiza a cada minuto</div>`;
  }

  // ---------- 🔥 oportunidades (0107) ----------
  // Linha: nome · cidade · motivo · plano/valor · Mandar mensagem (abre a conversa aqui com o texto na caixa) · ▾ Mandar e assumir ·
  // Agora não (motivo em 1 clique). A sugestão aparece embaixo da 1ª; nas outras, ao passar o mouse.
  function opLinha(o, i) {
    const cid = esc(o.conversa_id);
    const jan = o.janela_fecha_em ? (new Date(o.janela_fecha_em) - Date.now()) / 60000 : -1;
    const janTxt = o.canal === 'template' ? ' · <span class="warn-txt">janela fechada → template</span>'
      : jan > 0 && jan <= 240 && o.codigo !== 'O1' ? ` · <span class="warn-txt">janela fecha em ${jan < 60 ? `${Math.round(jan)} min` : `${Math.floor(jan / 60)} h`}</span>` : '';
    const valor = o.valor_mes != null ? `${NG.fmtMoeda(o.valor_mes)}/mês` : '';
    const acoes = opAberta === o.conversa_id
      ? `<span class="apagado">Por quê?</span>${motivosDispensa.map((m) => `<button type="button" class="btn btn-sm" data-opd="${cid}" data-motivo="${esc(m.codigo)}">${esc(m.nome)}</button>`).join('')}<button type="button" class="btn btn-sm btn-ghost" data-opx="${cid}" aria-label="Cancelar">×</button>`
      : `<details class="mv-op-menu"><summary class="btn btn-sm" title="Mais opções">▾</summary><button type="button" class="btn btn-sm" data-opm="${cid}" data-assumir="1" title="Manda e atribui a você: a Mari cala e a cadência para">Mandar e assumir</button></details>
         <button type="button" class="btn btn-sm" data-opn="${cid}" title="Some até amanhã (pede o motivo em 1 clique)">Agora não</button>`;
    return `<div class="mv-row mv-op${i === 0 ? ' prim' : ''}" data-k="c:${cid}" tabindex="0" role="button">
        <span class="mv-et" title="Oportunidade (${esc((o.regras || []).join(' + '))} · ${esc(String(o.pontos))} pontos)"><span class="mv-fogo" aria-hidden="true">🔥</span><span>Oportunidade</span></span>
        <span class="mv-cli"><b>${esc(o.nome || 'Contato')}</b><small>${esc([o.cidade, o.plano].filter(Boolean).join(' · ') || '—')}${valor ? ` · ${esc(valor)}` : ''}</small></span>
        <span class="mv-oque">${esc(o.motivo || '')}${janTxt}</span>
        <span class="mv-ha apagado">${esc(haTempo(o.parado_desde))}</span>
        <span class="mv-dono mari">${ICO_ROBO}Mari</span>
        <span class="mv-bt"><button type="button" class="btn btn-sm mv-go" data-opm="${cid}">${o.canal === 'template' ? 'Mandar template' : 'Mandar mensagem'}</button></span>
        <div class="mv-op-pe"><span class="mv-sug">${o.canal === 'template' ? 'Template (janela fechada)' : 'Sugestão (editável)'}: “${esc(o.texto_sugerido || '')}”</span><span class="mv-op-acoes">${acoes}</span></div>
      </div>`;
  }
  async function mandarOp(cid, assumir) {
    const o = ops.find((x) => x.conversa_id === cid);
    if (!o) return;
    const op = { codigo: o.codigo, texto: o.texto_sugerido || '', template: o.canal === 'template' ? o.template : null, assumir: !!assumir };
    if (podeFoco()) {
      // Abre a ficha da conversa e a conversa no lugar da lista, com o texto na caixa (Enter manda pela oportunidade_enviar).
      abrirChave(`c:${cid}`);
      entrarFoco({ conversa_id: cid, nome: o.nome }, op);
      return;
    }
    // Quadro e celular: a mesma mensagem numa janela (texto editável; template não muda).
    const fd = await NG.modal(`
      <h3>🔥 ${esc(o.nome || 'Contato')}${o.cidade ? ` · ${esc(o.cidade)}` : ''}</h3>
      <p>${esc(o.motivo || '')}</p>
      <label class="campo">${op.template ? 'Template aprovado (janela de 24 h fechada)' : 'Mensagem (editável)'}<textarea name="texto" rows="5"${op.template ? ' readonly' : ''}>${esc(op.texto)}</textarea></label>
      <p class="nota-campo">${assumir ? 'Você assume a conversa: a Mari cala e a cadência para.' : 'Depois de mandar, a Mari segue a conversa (sem dono).'} Nunca desconto nem data de instalação.</p>`);
    if (!fd) return;
    const { data, error } = await NG.sb.rpc('oportunidade_enviar', { p_conversa: cid, p_texto: op.template ? '' : String(fd.get('texto') || ''), p_assumir: !!assumir, p_template: op.template });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    NG.toast((data && data.resumo) || 'Mensagem enviada', 'ok');
    await carregar();
  }
  async function dispensarOp(cid, motivo) {
    const { error } = await NG.sb.rpc('oportunidade_dispensar', { p_conversa: cid, p_motivo: motivo });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); return; }
    opAberta = null;
    NG.toast('Some até amanhã', 'ok');
    await carregar();
  }

  // ---------- quadro ----------
  function renderQuadro() {
    const atual = NGFicha.atual;
    const cols = NG.JORNADA.filter((e) => !etapaSel || e.n === etapaSel).map((e) => {
      const L = jor.lista.filter((j) => j.etapa === e.n && (!soVez || vez(j) || acompanha(j))).sort(NG.ordemJornada);
      const nv = jor.lista.filter((j) => j.etapa === e.n && vez(j)).length;
      return `<section class="mv-col"><div class="mv-colh"><b>${dot(e.n)}${e.n} · ${esc(e.nome)}</b><span class="${nv ? 'mv-vz' : 'apagado'}">${L.length}${nv ? ` · ${nv} sua vez` : ''}</span></div>
        <div class="mv-cards">${L.map((j) => `<div class="mv-kc ${j.nivel}${vez(j) ? '' : ' acomp'}${atual === chaveFicha(j) ? ' sel' : ''}" data-k="${esc(chaveFicha(j))}" tabindex="0" role="button">
          <b>${esc(j.nome || 'Contato')}</b><small>${esc([j.cidade, j.plano].filter(Boolean).join(' · ') || '—')}</small>
          <span class="mv-oque">${esc(j.o_que_fazer || '')}${j.portal_status ? ` <span class="chip dim" title="Status no portal PAP (Histórico de Pedidos)">portal: ${esc(j.portal_status.toLowerCase())}</span>` : ''}${j.biometria_ged ? ` <span class="chip dim" title="Biometria no GED360">bio: ${esc(j.biometria_ged.toLowerCase())}</span>` : ''}</span>
          <span class="mv-meta">${donoHtml(j)}<span class="apagado">há ${esc(haTempo(j.desde))}</span></span>
          ${vez(j) ? `<button type="button" class="btn btn-sm mv-go" data-bt="${esc(j.botao || 'abrir')}" data-k="${esc(chaveFicha(j))}">${esc(BOTAO[j.botao] || 'Abrir')}</button>` : ''}
        </div>`).join('') || '<span class="apagado mv-col-vazia">—</span>'}</div></section>`;
    }).join('');
    const sai = (jor.todas || []).filter((j) => j.etapa === 0);
    quadroEl.innerHTML = `${abas()}<div class="mv-board">${cols}</div>
      <div class="mv-saida apagado">Fora da jornada · <b>Saída ${sai.length}</b>${sai.length ? `: ${sai.slice(0, 8).map((j) => `${esc(NG.primeiroNome(j.nome))} (${esc(j.o_que_fazer)})`).join(' · ')}` : ''} · o card só muda de coluna pelo botão da ficha</div>`;
  }

  function render() {
    const lista = vista === 'lista' && !movel.matches;
    document.querySelectorAll('[data-vista]').forEach((b) => b.classList.toggle('on', b.dataset.vista === vista));
    document.getElementById('sub').hidden = !!conv && lista;
    renderIntro();
    renderFunil();
    trabEl.hidden = vista !== 'lista';
    quadroEl.hidden = vista !== 'quadro';
    fichaVazia.hidden = !lista || !!NGFicha.atual;
    if (vista === 'lista') renderLista(); else renderQuadro();
  }

  // ---------- ficha: ao lado (Lista, computador) · gaveta (Quadro e celular) ----------
  NGFicha.lado(fichaLado);
  function modoFicha() {
    sairFoco(true);
    if (vista === 'lista' && !movel.matches) { NGFicha.usarLado(); NGFicha.aoConversa(abrirConversaLista); } else { fecharConversa(); NGFicha.usarGaveta(); NGFicha.aoConversa(null); }
  }
  NGFicha.aoFechar(() => { if (foco) sairFoco(); else { fecharConversa(); render(); } });

  // ---------- 10/11: modo foco (Lista, computador) ----------
  // Clicar numa linha abre o caso na área toda: a lista some, a conversa (se houver) fica à esquerda e a ficha à direita;
  // sem conversa, a ficha usa a largura toda em 2 colunas. "← Lista" e Esc voltam para a lista no mesmo lugar.
  let foco = false;
  let rolagemLista = 0;
  const podeFoco = () => vista === 'lista' && !movel.matches;
  const ecoFicha = (r) => NGFicha.recarregar({ quieto: !!(r && r.eco) });
  function entrarFoco(j, oportunidade) {
    if (!podeFoco() || !j) return;
    const rol = listaEl.querySelector('.mv-rolar');
    if (!foco && rol) rolagemLista = rol.scrollTop;
    foco = true;
    const temConv = !!j.conversa_id;
    document.body.classList.add('mv-foco');
    trabEl.classList.add('foco');
    trabEl.classList.toggle('so-ficha', !temConv);
    NGFicha.aoVoltar(() => sairFoco());
    NGFicha.largo(!temConv);
    if (temConv) setTimeout(() => abrirConversaLista({ conversaId: j.conversa_id, nome: j.nome, aoMudar: ecoFicha, oportunidade }), 50);
  }
  function sairFoco(quieto) {
    if (!foco) return;
    foco = false;
    document.body.classList.remove('mv-foco');
    trabEl.classList.remove('foco', 'so-ficha');
    NGFicha.aoVoltar(null);
    NGFicha.largo(false);
    fecharConversa();
    if (quieto === true) return;
    render();
    const rol = listaEl.querySelector('.mv-rolar');
    if (rol) rol.scrollTop = rolagemLista;
  }
  document.addEventListener('keydown', (ev) => {
    if (ev.key !== 'Escape' || !foco || ev.defaultPrevented) return;
    if (document.querySelector('dialog[open], .gaveta.aberta, .dica-pop')) return;
    sairFoco();
  });

  // ---------- conversa no lugar da lista ----------
  // 10/11 (Ricardo: "a janela da conversa fecha … clico em Abrir a conversa para responder e nada acontece"): se a mesma conversa
  // já está viva na tela, só traz o cursor para a caixa; se o estado ficou preso (conversa "aberta" sem estar na tela), monta de novo.
  function conversaViva() { return !!(conv && conv.comp && listaEl.querySelector('.cvp-raiz') && trabEl.classList.contains('com-conversa') && !trabEl.classList.contains('so-ficha')); }
  function abrirConversaLista({ conversaId, nome, aoMudar, oportunidade }) {
    if (conv && conv.id === conversaId && conversaViva() && !oportunidade) { conv.comp.focar(); return; }
    if (foco && trabEl.classList.contains('so-ficha')) { trabEl.classList.remove('so-ficha'); NGFicha.largo(false); }
    if (conv && conv.comp) conv.comp.destruir();
    conv = null;
    conv = { id: conversaId, nome };
    trabEl.classList.add('com-conversa');
    render();
    conv.comp = NGConversa.montar(listaEl, { conversaId, nome, rotuloFechar: '← Lista', oportunidade: oportunidade || null,
      aoFechar: () => { if (foco) sairFoco(); else { fecharConversa(); render(); } },
      aoMudar: (r) => { carregar(); if (aoMudar) aoMudar(r); } });
  }
  function fecharConversa() {
    if (!conv) return;
    if (conv.comp) conv.comp.destruir();
    conv = null;
    trabEl.classList.remove('com-conversa');
  }

  // ---------- "o NIOGEN fez sozinho" + próximo da fila ----------
  let feitoTimer = null;
  function avisoFeito(r) {
    if (!r || !r.feito) return;
    const atual = NGFicha.atual;
    const prox = filtradas(true).find((j) => chaveFicha(j) !== atual);
    feitoEl.innerHTML = `<b>O NIOGEN fez sozinho</b>${(r.feito || []).map((x) => `<span>✓ ${esc(x)}</span>`).join('')}
      ${r.aviso ? `<span class="warn-txt">${esc(r.aviso)}</span>` : ''}
      ${prox ? `<button type="button" class="btn btn-acc btn-sm" data-prox="${esc(chaveFicha(prox))}">Próximo da fila: ${esc(NG.primeiroNome(prox.nome || 'Contato'))} →</button>` : '<span class="apagado">Fila zerada ✅</span>'}
      <button type="button" class="mv-feito-x" aria-label="Fechar o aviso">×</button>`;
    feitoEl.hidden = false;
    clearTimeout(feitoTimer);
    feitoTimer = setTimeout(() => { feitoEl.hidden = true; }, 9000);
  }
  feitoEl.addEventListener('click', (ev) => {
    if (ev.target.closest('.mv-feito-x')) { feitoEl.hidden = true; return; }
    const b = ev.target.closest('[data-prox]');
    if (b) { feitoEl.hidden = true; const j = jor.lista.find((x) => chaveFicha(x) === b.dataset.prox); abrirChave(b.dataset.prox); if (foco) entrarFoco(j); }
  });
  NGFicha.aoMudar((v, r) => { carregar(); if (r) avisoFeito(r); });

  // ---------- cliques ----------
  function abrirChave(k) {
    fecharConversa();
    if (String(k).startsWith('c:')) NGFicha.abrirConversa(k.slice(2)); else NGFicha.abrir(k);
    setTimeout(render, 0);
  }
  async function botao(b) {
    const k = b.dataset.k;
    const j = jor.lista.find((x) => chaveFicha(x) === k);
    if (!j) return;
    if (b.dataset.bt === 'assumir') {
      b.disabled = true;
      const r = await NG.momento(j.venda_id || null, 'assumir', j.venda_id ? {} : { conversa_id: j.conversa_id });
      if (!r) { b.disabled = false; return; }
      avisoFeito(r);
      abrirChave(k);
      await carregar();
      entrarFoco(j);
      return;
    }
    abrirChave(k);
    entrarFoco(j);
  }
  async function casar(b) {
    if (!confirm(`Casar o pedido ${b.dataset.casar} do portal com a venda de ${b.dataset.nome}? O status do portal passa a valer para essa venda.`)) return;
    b.disabled = true;
    const { data, error } = await NG.sb.rpc('portal_pedido_casar', { p_pedido: b.dataset.casar, p_venda: b.dataset.venda });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    NG.toast(`Pedido casado${data && data.feito ? ` · ${data.feito}` : ''}${data && data.alerta ? ` · ${data.alerta}` : ''}`, data && data.alerta ? 'bad' : 'ok');
    await carregar();
  }
  async function vistoBio(b) {
    b.disabled = true;
    const { error } = await NG.sb.rpc('andamento_alerta_visto', { p_origem: 'ged360', p_chave: b.dataset.visto });
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    await carregar();
  }
  function clique(ev) {
    // 0107: 🔥 oportunidades
    if (ev.target.closest('.mv-op-menu summary')) { ev.stopPropagation(); return; }
    const om = ev.target.closest('[data-opm]');
    if (om) { ev.stopPropagation(); mandarOp(om.dataset.opm, om.dataset.assumir === '1'); return; }
    const on = ev.target.closest('[data-opn]');
    if (on) { ev.stopPropagation(); opAberta = on.dataset.opn; render(); return; }
    const ox = ev.target.closest('[data-opx]');
    if (ox) { ev.stopPropagation(); opAberta = null; render(); return; }
    const od = ev.target.closest('[data-opd]');
    if (od) { ev.stopPropagation(); od.disabled = true; dispensarOp(od.dataset.opd, od.dataset.motivo); return; }
    if (ev.target.closest('.mv-op-pe')) return;
    const bc = ev.target.closest('[data-casar]');
    if (bc) { ev.stopPropagation(); casar(bc); return; }
    const bv = ev.target.closest('[data-visto]');
    if (bv) { ev.stopPropagation(); vistoBio(bv); return; }
    const b = ev.target.closest('[data-bt]');
    if (b) { ev.stopPropagation(); botao(b); return; }
    const t = ev.target.closest('[data-aba]');
    if (t) { soVez = t.dataset.aba === 'vez'; render(); return; }
    const r = ev.target.closest('.mv-row[data-k], .mv-kc[data-k]');
    if (r) abrirLinha(r.dataset.k);
  }
  function abrirLinha(k) {
    const j = jor.lista.find((x) => chaveFicha(x) === k);
    abrirChave(k);
    entrarFoco(j);   // só na Lista do computador; no Quadro e no celular segue a gaveta
  }
  listaEl.addEventListener('click', (ev) => { if (!conv) clique(ev); });
  quadroEl.addEventListener('click', clique);
  [listaEl, quadroEl].forEach((el) => el.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter' && ev.target.matches('.mv-row[data-k], .mv-kc[data-k]')) abrirLinha(ev.target.dataset.k);
  }));
  funilEl.addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-etapa]');
    if (!b) return;
    const n = Number(b.dataset.etapa);
    if (conv) { fecharConversa(); etapaSel = n; } else etapaSel = etapaSel === n ? null : n;
    render();
  });
  document.querySelectorAll('[data-vista]').forEach((b) => b.addEventListener('click', () => {
    vista = b.dataset.vista;
    ls.gravar('niogen.fila.vista', vista);
    modoFicha();
    render();
  }));
  movel.addEventListener('change', () => { modoFicha(); render(); });
  // Trocou de ficha pelo endereço (#venda= / #conversa=): a conversa aberta no lugar da lista era do cliente anterior — fecha.
  // 10/11: só fecha se o endereço apontar para OUTRO cliente — o mesmo cliente (venda ↔ conversa dele) mantém a conversa aberta.
  window.addEventListener('hashchange', () => {
    if (!conv) { setTimeout(render, 0); return; }
    const h = location.hash;
    const m = h.match(/#conversa=([0-9a-f-]+)/i);
    const mv = h.match(/#venda=([0-9a-f-]+)/i);
    const mesmo = (m && m[1] === conv.id) || (mv && jor.lista.some((j) => j.venda_id === mv[1] && j.conversa_id === conv.id));
    if (!mesmo) { if (foco) sairFoco(); else { fecharConversa(); render(); } }
  });
  // Modo foco sem a conversa (fechou por fora): reabre a conversa do cliente da ficha em vez de mostrar a lista no lugar dela.
  function reporConversaFoco() {
    if (!foco || conv || trabEl.classList.contains('so-ficha')) return;
    const k = NGFicha.atual;
    const j = k && jor.lista.find((x) => chaveFicha(x) === k);
    if (j && j.conversa_id) abrirConversaLista({ conversaId: j.conversa_id, nome: j.nome, aoMudar: ecoFicha });
  }

  NG.botaoAtualizar(() => carregar());
  modoFicha();
  await carregar();
  NGFicha.iniciar();
  render();
  // 10/11: o refresh de 1 min também atualiza a ficha aberta (quieto: só redesenha se mudou, nunca por cima de formulário).
  setInterval(() => { if (document.visibilityState === 'visible') { carregar(); if (NGFicha.atual) NGFicha.recarregar({ quieto: true }); } }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') carregar(); });
})();
</script>
</body>
</html>
