<!doctype html>
<!-- NIOGEN | docs/conversas.html | 09/11/2026 — Claude Code
     "Conversas": todas as conversas do WhatsApp num lugar só, como o Chatwoot (Ricardo, 09/11 ~19h40: "tá difícil ter que ir atrás do
     cliente para falar com ele quando preciso"). À esquerda a lista (v_conversas, 0094: última mensagem, cliente esperando, dono,
     etapa), com busca e filtros; à direita a conversa — o mesmo componente do Live (assets/conversa.js: status, atribuição,
     etiquetas, Responder | Nota privada, respostas rápidas, Enter envia). "Abrir a ficha" abre a ficha em gaveta.
     Endereço direto: conversas.html#c=<id>. Só admin/backoffice (a tabela da Mari só abre para eles).
     15/11 (NIOGEN no celular · protótipo docs/LAYOUT_conversas_mobile_151126_1304.html, aprovado pelo Ricardo): HOME do app
     instalado. Em tela ≤ 640 px vira o padrão WhatsApp — lista com avatar, nome, última mensagem com o autor (Mari: / Time:),
     hora, badge de não lidas (v_conversas.nao_lidas, 0215), selo da janela de 24 h e quanto vale (comissão da venda ou o plano
     por mês); quentes no topo (esperando resposta, depois janela fechando). A conversa abre em TELA CHEIA (NGConversa movel:
     cabeçalho fixo com voltar, faixa de contexto, Devolver para a Mari, composer no rodapé); o voltar do Android fecha a
     conversa. Desktop (> 640 px) fica como estava. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Conversas · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icones/niogen_apple_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=201126-9">
<script src="config.js?v=111126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=201126-13"></script>
<script src="assets/sidebar.js?v=161126-21"></script>
<script src="assets/conversa.js?v=201126-1sp2"></script>
<script src="assets/ficha.js?v=201126-13"></script>
</head>
<body class="tela-conversas">
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="conversas"></nav>
  <main class="main cv-main">
    <header class="cab">
      <div>
        <h1>Conversas</h1>
        <div class="sub">Todas as conversas do WhatsApp. Escolha à esquerda e responda à direita — o NIOGEN cuida do Chatwoot.</div>
      </div>
      <div class="cab-acoes" id="cab-acoes"></div>
    </header>
    <div class="cv-trab" id="trab">
      <section class="cv-lista" aria-label="Lista de conversas">
        <div class="cv-busca"><input type="search" id="busca" placeholder="Buscar nome, telefone, cidade ou L-142" autocomplete="off" aria-label="Buscar conversa"></div>
        <div class="cv-filtros" id="filtros" role="tablist"></div>
        <div class="cv-funil"><select id="f-destino" aria-label="Filtrar por destino"></select><select id="f-etapa" aria-label="Filtrar por etapa"></select><select id="f-dono" aria-label="Filtrar por quem atende"></select></div>
        <div class="cv-itens" id="itens"><div class="carregando">Carregando…</div></div>
      </section>
      <section class="cv-direita" id="direita">
        <div class="cv-vazia">Escolha uma conversa à esquerda.</div>
      </section>
    </div>
  </main>
</div>
<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  NGSidebar.montar();
  const itensEl = document.getElementById('itens');
  const direita = document.getElementById('direita');
  const trab = document.getElementById('trab');
  if (!['admin', 'backoffice'].includes(eu.perfil)) { itensEl.innerHTML = '<div class="vazio">As conversas são do backoffice.</div>'; return; }
  const ls = { ler: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, gravar: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* */ } } };

  let lista = [];
  let furos = new Set();   // 0102: esperando há 3 min ou mais e fora do Live = "deveria estar no Live"
  let fnome = { etapa: {}, destino: {} };   // 0147: nomes de etapa e destino (config_funil)
  // 13/11 (Ricardo: "filtro por destino e por etapa"): ?destino=…&etapa=… na URL vale por cima do último usado.
  const URLQ = new URLSearchParams(location.search);
  let fDestino = URLQ.get('destino') ?? ls.ler('niogen.conversas.destino') ?? '';
  let fEtapa = URLQ.get('etapa') ?? ls.ler('niogen.conversas.etapa') ?? '';
  // 14/11 (Ricardo: "na tela Conversas não tem filtro por atribuição (backoffice x mari)"): ?dono=mari|time.
  let fDono = URLQ.get('dono') ?? ls.ler('niogen.conversas.dono') ?? '';
  if (!['', 'mari', 'time'].includes(fDono)) fDono = '';
  // Mari = a Mari atende (sem dono no Chatwoot); Time = com o time backoffice ou com uma pessoa (assumida).
  const ladoDono = (c) => (c.dono_tipo === 'mari' ? 'mari' : c.dono_tipo === 'pessoa' || c.dono_tipo === 'time' ? 'time' : '');
  const doDono = (c) => !fDono || ladoDono(c) === fDono;
  // 0144: ?filtro=esperando (botão do alerta da faixa de pulso) vale por cima do último filtro usado.
  const FILTRO_URL = new URLSearchParams(location.search).get('filtro');
  const IDS_FILTRO = ['esperando', 'minhas', 'abertas', 'fora', 'todas', 'encerradas'];
  let filtro = IDS_FILTRO.includes(FILTRO_URL) ? FILTRO_URL
    : IDS_FILTRO.includes(ls.ler('niogen.conversas.filtro')) ? ls.ler('niogen.conversas.filtro') : 'abertas';
  let atual = null;     // id da conversa aberta
  const MQ = window.matchMedia('(max-width: 640px)');   // 15/11: celular = padrão WhatsApp
  const movel = () => MQ.matches;
  const COR_AV = ['#22c55e', '#6FA8FF', '#F2B84B', '#C79BFF', '#FF8A65', '#4DD0E1'];
  const corAv = (id) => COR_AV[[...String(id)].reduce((a, ch) => a + ch.charCodeAt(0), 0) % COR_AV.length];
  const iniciais = (n) => (String(n || '').trim().split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0]).join('') || '?').toUpperCase();
  // janela de 24 h (a mesma conta da conversa: 23 h depois da última fala do cliente)
  const janelaMin = (c) => (c.ult_lead ? (new Date(c.ult_lead).getTime() + 23 * 3600000 - Date.now()) / 60000 : null);
  const durTxt = (min) => (min < 60 ? `${Math.max(1, Math.round(min))} min` : `${Math.floor(min / 60)} h`);
  const valeTxt = (c) => (c.comissao != null ? NG.fmtMoeda(c.comissao).replace(/,00$/, '') : c.valor_mes != null ? `${NG.fmtMoeda(c.valor_mes).replace(/,00$/, '')}/mês` : '');
  let comp = null;      // NGConversa
  const COR = Object.fromEntries(NG.JORNADA.map((e) => [e.n, e.cor]));
  const NOME_ET = Object.fromEntries(NG.JORNADA.map((e) => [e.n, e.nome]));
  const ICO_ROBO = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2v3"/></svg>';
  const ICO_PESSOA = '<svg class="ico-dono" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="2.5"/><path d="M3 14c0-2.8 2.2-4.5 5-4.5s5 1.7 5 4.5"/></svg>';
  const minha = (c) => c.dono_tipo === 'pessoa' && NG.ehMeu(c.dono_nome);   // 0181: pelo vínculo do Chatwoot (Configurações › Equipe)
  const aberta = (c) => !c.encerrada && c.chatwoot_status !== 'resolved';
  const FILTROS = [
    ['esperando', 'Esperando resposta', (c) => c.cliente_esperando && !c.encerrada],
    ['minhas', 'Minhas', (c) => minha(c) && !c.encerrada],
    ['abertas', 'Abertas', aberta],
    ['fora', '⚠ Fora do NIOGEN', (c) => !!c.funil_alerta],   // 0147: resolvida ou respondida direto no Chatwoot
    ['todas', 'Todas', () => true],   // 12/11 (Ricardo: "toda conversa precisa aparecer no sistema"): inclui encerradas e silenciadas
    ['encerradas', 'Encerradas', (c) => c.encerrada],
  ];
  const quando = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    if (NG.diaSP(d) === NG.diaSP()) return NG.fmtHora(d);
    const min = (Date.now() - d) / 60000;
    if (min < 7 * 1440) return NG.fmtDiaSemana(d);
    return NG.fmtData(d).slice(0, 5);
  };
  const previa = (c) => {
    const txt = NGConversa.textoTurno(c.ultima_txt) || '—';
    const quem = c.ultima_quem === 'mari' ? 'Mari: ' : c.ultima_quem === 'humano' ? 'Time: ' : '';
    return quem + txt;
  };

  async function carregar() {
    const { data, error } = await NG.sb.from('v_conversas').select('*').order('ultima_em', { ascending: false }).limit(500);
    if (error) { itensEl.innerHTML = `<div class="vazio">${esc(NG.msgErro(error))}</div>`; return; }
    lista = (data || []).map((c) => ({ ...c, nome: NG.nomeLegivel(c.nome, c.telefone) }));   // 16/11: nome legível (conversa 119)
    const [fu, fn] = await Promise.all([NG.furosJornada(), NG.funilNomes()]);
    furos = fu.ids || new Set();
    fnome = fn;
    render();
  }

  function render() {
    const q = document.getElementById('busca').value.trim().toLowerCase();
    const qd = NG.soDigitos(q);
    const casa = (c) => !q || [c.nome, c.cidade].some((x) => String(x || '').toLowerCase().includes(q)) || (qd.length >= 3 && NG.soDigitos(c.telefone).includes(qd));
    const doFunil = (c) => (!fDestino || (c.funil_destino || 'em_andamento') === fDestino) && (!fEtapa || (c.funil_etapa || 'nova') === fEtapa) && doDono(c);
    const porBusca = lista.filter(casa);
    const base = porBusca.filter(doFunil);
    // contagem de cada opção com o outro filtro aplicado (o número diz o que você vai ver)
    const opc = (sel, tipo, atual, outro) => {
      const campo = tipo === 'destino' ? 'funil_destino' : 'funil_etapa';
      const pad = tipo === 'destino' ? 'em_andamento' : 'nova';
      const universo = porBusca.filter(outro);
      const n = (k) => universo.filter((c) => (c[campo] || pad) === k).length;
      sel.innerHTML = `<option value="">${tipo === 'destino' ? 'Destino: todos' : 'Etapa: todas'} (${universo.length})</option>`
        + Object.entries(fnome[tipo] || {}).map(([k, nome]) => `<option value="${esc(k)}"${atual === k ? ' selected' : ''}>${esc(nome)} (${n(k)})</option>`).join('');
      sel.classList.toggle('on', !!atual);
    };
    opc(document.getElementById('f-destino'), 'destino', fDestino, (c) => (!fEtapa || (c.funil_etapa || 'nova') === fEtapa) && doDono(c));
    opc(document.getElementById('f-etapa'), 'etapa', fEtapa, (c) => (!fDestino || (c.funil_destino || 'em_andamento') === fDestino) && doDono(c));
    const uDono = porBusca.filter((c) => (!fDestino || (c.funil_destino || 'em_andamento') === fDestino) && (!fEtapa || (c.funil_etapa || 'nova') === fEtapa));
    const selDono = document.getElementById('f-dono');
    selDono.innerHTML = [['', `Atendimento: todos (${uDono.length})`], ['mari', `Mari (${uDono.filter((c) => ladoDono(c) === 'mari').length})`], ['time', `Time backoffice (${uDono.filter((c) => ladoDono(c) === 'time').length})`]]
      .map(([v, t]) => `<option value="${v}"${fDono === v ? ' selected' : ''}>${esc(t)}</option>`).join('');
    selDono.classList.toggle('on', !!fDono);
    // 12/11: com busca, acha a conversa em qualquer filtro (encerrada ou silenciada inclusive).
    const fn = q ? () => true : (FILTROS.find((f) => f[0] === filtro) || FILTROS[2])[2];
    const silenciada = (c) => (c.etiquetas || []).includes('suporte-nio');
    document.getElementById('filtros').innerHTML = FILTROS.map(([id, nome, f]) => {
      const n = base.filter(f).length;
      return `<button type="button" role="tab" data-filtro="${id}" aria-selected="${filtro === id}" class="${filtro === id ? 'on' : ''}${id === 'esperando' && n ? ' alerta' : ''}">${esc(nome)} <b>${n}</b></button>`;
    }).join('');
    const l = base.filter(fn).sort((a, b) => (filtro === 'esperando' ? (b.esperando_min || 0) - (a.esperando_min || 0) : new Date(b.ultima_em) - new Date(a.ultima_em)));
    if (movel()) {
      // 18/11 (Ricardo: "as mensagens mais recentes não estão subindo para o topo"): o celular segue a mesma ordem do
      // computador e do WhatsApp — última mensagem no topo. A urgência fica nos selos (🔥 esperando, ⏱ janela) e na aba Esperando.
      itensEl.innerHTML = l.length ? l.map(itemMovel).join('') : '<div class="vazio">Nenhuma conversa neste filtro.</div>';
      return;
    }
    itensEl.innerHTML = l.length ? l.map((c) => `<button type="button" class="cv-item${c.id === atual ? ' sel' : ''}${c.cliente_esperando && !c.encerrada ? ' esperando' : ''}${c.encerrada ? ' enc' : ''}" data-id="${esc(c.id)}">
        <span class="cv-l1"><i class="mv-dot" style="--c:${COR[c.etapa] || '#6E747C'}" title="${esc(NOME_ET[c.etapa] || '')}"></i><b>${esc(c.nome)}</b><span class="cv-hora">${esc(quando(c.ultima_em))}</span></span>
        <span class="cv-l2">${esc(previa(c))}</span>
        <span class="cv-l3">${c.dono_tipo === 'mari' ? `${ICO_ROBO}Mari` : c.dono_tipo ? `${ICO_PESSOA}${esc(NG.ehMeu(c.dono_nome) ? 'você' : c.dono_nome)}` : 'sem dono'}
          ${c.cidade ? `<span>· ${esc(c.cidade)}</span>` : ''}${silenciada(c) ? '<span class="cv-sil" title="Silenciada: cliente Nio com suporte/reclamação. A Mari não responde e a conversa não volta para o Live. Para desfazer: Abrir a ficha › 🔔 Reativar.">· 📵 silenciada</span>' : c.encerrada ? '<span>· encerrada</span>' : c.chatwoot_status === 'resolved' ? '<span>· resolvida</span>' : ''}
          ${c.cliente_esperando && !c.encerrada && c.esperando_min != null ? `<span class="cv-esp">esperando ${c.esperando_min < 60 ? `${c.esperando_min} min` : `${Math.floor(c.esperando_min / 60)} h`}</span>` : ''}
          ${c.funil_destino && !['em_andamento', 'teste_duplicada'].includes(c.funil_destino) ? `<span class="cv-dest" title="Destino da conversa${c.funil_detalhe ? ': ' + esc(c.funil_detalhe) : ''}">· ${c.funil_destino === 'instalada' ? '✅' : '⛔'} ${esc(fnome.destino[c.funil_destino] || c.funil_destino)}</span>` : c.funil_etapa ? `<span class="cv-etp" title="Etapa mais alta alcançada">· ${esc(fnome.etapa[c.funil_etapa] || c.funil_etapa)}</span>` : ''}
          ${c.funil_alerta ? `<span class="cv-furo" title="${esc(NG.FUNIL_ALERTA[c.funil_alerta] || '')}">${({ resolvida_fora_niogen: 'resolvida fora do NIOGEN', mensagem_fora_niogen: 'respondida pelo Chatwoot', atribuida_fora_niogen: 'atribuída pelo Chatwoot', adiada_fora_niogen: 'adiada pelo Chatwoot' })[c.funil_alerta] || 'fora do NIOGEN'}</span>` : ''}
          ${furos.has(c.id) ? '<span class="cv-furo" title="Cliente esperando e fora do Live: é defeito da regra (já ficou registrado). Responda daqui e avise o Ricardo.">deveria estar no Live</span>' : ''}</span>
      </button>`).join('') : '<div class="vazio">Nenhuma conversa neste filtro.</div>';
  }

  // 15/11: linha do celular (padrão WhatsApp)
  function itemMovel(c) {
    const quem = c.ultima_quem === 'mari' ? 'Mari: ' : c.ultima_quem === 'humano' ? 'Time: ' : '';
    const txt = NGConversa.textoTurno(c.ultima_txt) || '—';
    const nl = c.nao_lidas || 0;
    const jm = janelaMin(c);
    const selos = [];
    if (c.cliente_esperando && !c.encerrada && c.esperando_min != null) selos.push(`<span class="cv-tag quente">🔥 esperando ${durTxt(c.esperando_min)}</span>`);
    if (!c.encerrada && jm != null) selos.push(jm > 0 ? `<span class="cv-tag${jm <= 240 ? ' aviso' : ''}" title="Janela de 24 h do WhatsApp: depois dela, só template aprovado">⏱ 24 h · fecha em ${durTxt(jm)}</span>` : '<span class="cv-tag apagada" title="Janela de 24 h fechada: só template aprovado">janela fechada</span>');
    const vale = valeTxt(c);
    if (vale) selos.push(`<span class="cv-tag dinheiro" title="${c.comissao != null ? 'Comissão prevista da venda' : 'Plano escolhido, por mês'}">${esc(vale)}</span>`);
    selos.push(`<span class="cv-tag dono">${c.dono_tipo === 'mari' ? 'Mari' : c.dono_tipo ? esc(NG.ehMeu(c.dono_nome) ? 'você' : 'humano') : 'sem dono'}</span>`);
    if ((c.etiquetas || []).includes('suporte-nio')) selos.push('<span class="cv-tag apagada">📵 silenciada</span>');
    else if (c.funil_destino && !['em_andamento', 'teste_duplicada'].includes(c.funil_destino)) selos.push(`<span class="cv-tag apagada">${c.funil_destino === 'instalada' ? '✅' : '⛔'} ${esc(fnome.destino[c.funil_destino] || c.funil_destino)}</span>`);
    if (c.funil_alerta) selos.push(`<span class="cv-tag ruim" title="${esc(NG.FUNIL_ALERTA[c.funil_alerta] || '')}">mexida no Chatwoot</span>`);
    if (furos.has(c.id)) selos.push('<span class="cv-tag ruim" title="Cliente esperando e fora do Live: é defeito da regra (já ficou registrado). Responda daqui e avise o Ricardo.">deveria estar no Live</span>');
    return `<button type="button" class="cv-item cv-mv${c.cliente_esperando && !c.encerrada ? ' esperando' : ''}${nl ? ' naolida' : ''}${c.encerrada ? ' enc' : ''}" data-id="${esc(c.id)}">
      <span class="cv-av" style="--av:${corAv(c.id)}" aria-hidden="true">${esc(iniciais(c.nome))}</span>
      <span class="cv-mv-meio">
        <span class="cv-l1"><b>${esc(c.nome)}</b><span class="cv-hora">${esc(quando(c.ultima_em))}</span></span>
        <span class="cv-l2"><span class="cv-prev">${quem ? `<i class="cv-quem">${quem}</i>` : ''}${esc(txt)}</span>${nl ? `<span class="cv-nl" aria-label="${nl} ${nl === 1 ? 'mensagem não lida' : 'mensagens não lidas'}">${nl > 99 ? '99+' : nl}</span>` : ''}</span>
        <span class="cv-l3">${selos.join('')}</span>
      </span>
    </button>`;
  }

  function abrir(id) {
    if (!id) return;
    if (movel()) { abrirMovel(id); return; }
    atual = id;
    const c = lista.find((x) => x.id === id);
    if (location.hash !== `#c=${id}`) history.replaceState(null, '', `${location.pathname}${location.search}#c=${id}`);
    trab.classList.add('com-conversa');
    direita.innerHTML = `<div class="cv-topo"><button type="button" class="btn btn-sm cv-voltar" id="voltar">← Conversas</button>
      ${c && c.venda_id ? `<a class="btn btn-sm" href="#venda=${esc(c.venda_id)}">Abrir a ficha da venda</a>` : `<a class="btn btn-sm" href="#conversa=${esc(id)}">Abrir a ficha</a>`}
      ${c && (c.funil_destino || 'em_andamento') === 'em_andamento' && !c.encerrada && !['agendada', 'instalada'].includes(c.funil_etapa) ? NG.botaoOperador({ vendaId: c.venda_id, conversaId: c.venda_id ? null : id }) : ''}
      ${c ? `<span class="apagado">${esc(NOME_ET[c.etapa] || '')}${c.telefone ? ` · ${esc(c.telefone)}` : ''}</span>` : ''}</div><div class="cv-host"></div>`;   // 13/11: ⌖ Consultar (viabilidade e crédito pelo operador), só admin/backoffice e lead em andamento antes da Instalação
    document.getElementById('voltar').onclick = fechar;
    if (comp) comp.destruir();
    comp = NGConversa.montar(direita.querySelector('.cv-host'), { conversaId: id, nome: c ? c.nome : null, aoMudar: () => carregar() });
    render();
  }
  // 15/11: celular — a conversa em tela cheia; o voltar do Android (history) fecha.
  function abrirMovel(id) {
    atual = id;
    const c = lista.find((x) => x.id === id);
    if (!(history.state && history.state.mvConversa === id)) history.pushState({ mvConversa: id }, '', `${location.pathname}${location.search}#c=${id}`);
    document.body.classList.add('mv-thread');
    trab.classList.add('com-conversa');
    direita.innerHTML = '<div class="cv-host"></div>';
    if (comp) comp.destruir();
    comp = NGConversa.montar(direita.querySelector('.cv-host'), {
      conversaId: id, nome: c ? c.nome : null, movel: true,
      aoFechar: () => { if (history.state && history.state.mvConversa) history.back(); else fechar(); },
      contexto: c ? { cidade: c.cidade, plano: c.plano, vale: valeTxt(c) } : null,
      aoMudar: () => carregar(),
    });
  }
  window.addEventListener('popstate', () => { if (atual && !(history.state && history.state.mvConversa)) fechar(); });
  MQ.addEventListener('change', () => { const id = atual; if (id) { fechar(); abrir(id); } else render(); });

  function fechar() {
    document.body.classList.remove('mv-thread');
    atual = null;
    if (comp) { comp.destruir(); comp = null; }
    trab.classList.remove('com-conversa');
    direita.innerHTML = '<div class="cv-vazia">Escolha uma conversa à esquerda.</div>';
    history.replaceState(null, '', `${location.pathname}${location.search}`);
    render();
  }

  itensEl.addEventListener('click', (ev) => { const b = ev.target.closest('[data-id]'); if (b) abrir(b.dataset.id); });
  document.getElementById('filtros').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-filtro]');
    if (!b) return;
    filtro = b.dataset.filtro; ls.gravar('niogen.conversas.filtro', filtro); render();
  });
  document.getElementById('busca').addEventListener('input', render);
  // 0296: "L-142" + Enter abre a ficha do lead
  document.getElementById('busca').addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && NG.abrirLeadNumero) NG.abrirLeadNumero(ev.target.value); });
  // Destino ou etapa escolhido: a aba vai para Todas (senão "Abertas" esconderia as saídas).
  document.getElementById('f-dono').addEventListener('change', (ev) => { fDono = ev.target.value; ls.gravar('niogen.conversas.dono', fDono); render(); });
  ['f-destino', 'f-etapa'].forEach((idSel) => document.getElementById(idSel).addEventListener('change', (ev) => {
    if (idSel === 'f-destino') { fDestino = ev.target.value; ls.gravar('niogen.conversas.destino', fDestino); }
    else { fEtapa = ev.target.value; ls.gravar('niogen.conversas.etapa', fEtapa); }
    if (ev.target.value && filtro !== 'todas') { filtro = 'todas'; ls.gravar('niogen.conversas.filtro', filtro); }
    render();
  }));
  NGFicha.aoMudar(() => { carregar(); if (comp) comp.recarregar(); });
  NG.botaoAtualizar(() => carregar());

  await carregar();
  const m = location.hash.match(/^#c=([0-9a-f-]{36})$/i);
  if (m) abrir(m[1]);
  NGFicha.iniciar();
  NG.mudou('conversas', 2 * 60000);
  // 14/11 (0190): o tick de 30 s só refaz se o banco foi gravado (mensagem nova muda o carimbo) ou a cada 2 min.
  setInterval(async () => { if (document.visibilityState === 'visible' && await NG.mudou('conversas', 2 * 60000)) carregar(); }, 30000);
  NG.aoVoltarAba(() => carregar(), 30000);   // 13/11: trocar de aba só recarrega depois de 30 s (o timer de 30 s segue)
})();
</script>
