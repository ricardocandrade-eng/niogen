<!doctype html>
<!-- NIOGEN | docs/painel.html | 03/11/2026 · 05/11 rodada noturna — Painel no padrão de telas.
     Topo: Período (padrão Este mês) + 4 KPIs (Vendidas/meta com barra · Instaladas · Comissão prevista · Precisam de ação).
     Abaixo: "Precisam de ação agora" (as 8 primeiras, clique → ficha da venda em gaveta) e blocos curtos que levam às telas:
     Vendas por etapa → Quadro · Instalações de hoje · Mari: conversas que precisam de humano (admin/backoffice) · Cobertura JF.
     Nada de tabela larga: o gráfico por dia e as quebras por origem/cidade/vendedor/plano/forma saíram daqui (vão para o Placar).
     08/11 (0064): bloco "Em espera" (n · vencidas, ordenado pela data de revisão → vendas.html?aba=espera).
     09/11 (onda 2.1, 0075): faixa "primeira venda" no topo, para todos os perfis — meta do mês × instaladas (painel_meta_ritmo,
     a mesma conta do resumo diário), ritmo "faltam N em D dias → X por dia" e paradas por etapa (NG.paradaDe; vermelho = prazo do
     contrato vencido, de config_regras) — clique abre vendas.html?vista=lista&parada=<etapa>.
     09/11 (onda 3.2, 0077): cartão "Resumo de ontem" (só admin) com o texto de resumo_diario(ontem) e botão Copiar — o mesmo
     resumo vai às 8h (seg–sáb) pelo WhatsApp do Ricardo (n8n resumo_diario, template resumo_diario_interno — 0080).
     Dados: v_funil (KPIs e lista, mesma regra da tela Vendas), contatos_cliente, mari_conversas/mari_turnos, v_dfv_resumo, importacoes. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Painel · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=121126-25">
<script src="config.js?v=111126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=111126-12"></script>
<script src="assets/sidebar.js?v=121126-24"></script>
<script src="assets/conversa.js?v=121126-25"></script>
<script src="assets/ficha.js?v=121126-14"></script>
</head>
<body>
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="painel"></nav>
  <main class="main com-fab">
    <header class="cab">
      <div>
        <h1 id="titulo">Painel</h1>
        <div class="sub" id="sub">Carregando…</div>
      </div>
      <div class="cab-acoes">
        <span id="f-periodo"></span>
        <a class="btn btn-acc acao-principal" href="vendas.html#nova">＋ Nova venda</a>
      </div>
    </header>

    <!-- 0102: alarmes da operação (só admin/backoffice): respostas fora do NIOGEN hoje · qualidade do número da WABA Nio -->
    <section class="alarmes-op" id="alarmes-op" aria-label="Alarmes da operação" hidden></section>
    <section class="faixa-meta" id="faixa-meta" aria-label="Meta do mês e vendas paradas"><div class="carregando">Carregando…</div></section>
    <!-- 0087: funil do mês — quantos entraram em cada etapa (lead qualificado ≠ venda; venda = OS aberta) -->
    <section class="funil-mes" id="funil-mes" aria-label="Funil do mês"></section>

    <section class="kpis quatro" id="kpis" aria-label="Resumo do período"></section>
    <!-- 0107: 🔥 oportunidades (só admin/backoffice) — mostradas · enviadas · responderam · qualificaram · pedidos (7 dias no mouse) -->
    <a class="painel-op" id="op-linha" href="fila.html" hidden></a>

    <section class="painel" aria-labelledby="t-acao">
      <div class="q-linha"><h2 id="t-acao">Precisam de ação agora</h2><a class="muted" href="vendas.html?vista=lista&amp;aba=acao" id="ver-acao">ver todas →</a></div>
      <div class="lista-acao" id="lista-acao"><div class="carregando">Carregando…</div></div>
    </section>

    <div class="painel-grade" id="blocos"></div>
  </main>
</div>
<a class="fab" href="vendas.html#nova" aria-label="Nova venda">＋</a>
<script>
(async function () {
  const { esc, ETAPAS } = NG;
  const eu = await NG.exigirLogin();
  NGSidebar.montar();

  const per = NG.filtroPeriodo(document.getElementById('f-periodo'), { padrao: 'mes', aoMudar: render });
  const veMari = ['admin', 'backoffice'].includes(eu.perfil);
  let vendas = [], metas = [], ultimoContato = {}, base, osab = null, mari;   // base/mari: undefined = carregando
  let alarmes = null;   // 0102: {fora: n, fora_conv: n, waba: {quality_rating, lida_em}|null}
  let portal = null;   // sessão do portal PAP (viabilidade oficial): só o estado, nunca o token
  let ritmo = null, regras = {};
  const ehAdmin = eu.perfil === 'admin';
  let funil = null;   // 0087: funil_mes()
  let jor = { lista: [], porVenda: {} };   // 0090: v_jornada (a regra única de "precisa de ação")
  let resumo;   // onda 3.2: resumo_diario(ontem) — undefined = carregando   // onda 2.1: painel_meta_ritmo() e config_regras (prazos do contrato)

  // O principal (vendas) desenha primeiro; Cobertura (v_dfv_resumo, pesada) e Mari chegam depois, sem segurar a tela.
  let extrasPedidos = false;
  async function carregar() {
    const [rv, rm, rc, ri, rr, rg, rf, rj] = await Promise.all([
      NG.sb.from('v_funil').select('*').order('criado_em', { ascending: false }).limit(2000),
      NG.sb.from('config_metas').select('*'),
      NG.sb.from('contatos_cliente').select('venda_id, em').not('venda_id', 'is', null).order('em', { ascending: false }).limit(5000),
      NG.sb.from('importacoes').select('aplicado_em, dt_ref').eq('tipo', 'osab').not('aplicado_em', 'is', null).order('aplicado_em', { ascending: false }).limit(1),
      NG.sb.rpc('painel_meta_ritmo', { p_hoje: NG.diaSP() }),
      NG.sb.from('config_regras').select('chave, valor'),
      NG.sb.rpc('funil_mes', { p_mes: NG.diaSP() }),
      NG.jornada(),
    ]);
    jor = rj && !rj.erro ? rj : jor;
    if (rv.error) { NG.toast(NG.msgErro(rv.error), 'bad'); document.getElementById('lista-acao').innerHTML = `<div class="placeholder">${esc(NG.msgErro(rv.error))}</div>`; return; }
    vendas = rv.data || [];
    metas = rm.data || [];
    ultimoContato = NG.ultimosContatos(rc.data);
    osab = (ri.data || [])[0] || null;
    ritmo = rr && !rr.error ? rr.data : null;
    regras = Object.fromEntries(((rg && rg.data) || []).map((x) => [x.chave, x.valor]));
    funil = rf && !rf.error ? rf.data : null;
    render();
    if (!extrasPedidos) { extrasPedidos = true; carregarExtras(); }
  }
  // 0107: linha "🔥 Oportunidades hoje" — atualiza os resultados (idempotente) e lê o resumo de hoje e de 7 dias.
  async function carregarOportunidades() {
    const el = document.getElementById('op-linha');
    await NG.sb.rpc('oportunidades_atualizar');
    const { data, error } = await NG.sb.rpc('oportunidades_resumo', { p_dias: 7 });
    if (error || !data) { el.hidden = true; return; }
    const h = data.hoje || {}, p = data.periodo || {}, k = data.controle || {};
    const n = (x) => NG.fmtNum(Number(x || 0));
    el.innerHTML = `<b>🔥 Oportunidades hoje:</b> ${n(h.mostradas)} mostradas · ${n(h.enviadas)} enviadas · ${n(h.responderam)} responderam · ${n(h.qualificaram)} qualificaram · ${n(h.pedidos)} pedidos <span class="apagado">· ver no Live →</span>`;
    el.title = `Últimos ${p.dias || 7} dias: ${n(p.mostradas)} mostradas · ${n(p.enviadas)} enviadas · ${n(p.dispensadas)} dispensadas · ${n(p.responderam)} responderam em 24 h · ${n(p.qualificaram)} qualificaram · ${n(p.pedidos)} pedidos.\nControle (mostradas sem mensagem do time): ${n(k.sem_mensagem)}, das quais ${n(k.responderam)} responderam em 24 h mesmo assim.`;
    el.hidden = false;
  }
  async function carregarExtras() {
    if (veMari) { carregarAlarmes(); carregarOportunidades(); }
    const [rz, rmari, rp, rres] = await Promise.all([
      NG.sb.from('v_dfv_resumo').select('*').eq('uf', 'MG').eq('municipio', 'JUIZ DE FORA').maybeSingle(),
      veMari ? carregarMari() : Promise.resolve(null),
      veMari ? NG.sb.rpc('nio_portal_sessao_status') : Promise.resolve({ data: null }),
      ehAdmin ? NG.sb.rpc('resumo_diario', { p_dia: NG.somaDias(NG.diaSP(), -1) }) : Promise.resolve(null),
    ]);
    base = rz.error ? { erro: NG.msgErro(rz.error) } : (rz.data || false);
    mari = rmari || { lista: [] };
    portal = rp && !rp.error ? rp.data : null;
    resumo = !rres ? null : rres.error ? { erro: NG.msgErro(rres.error) } : rres.data;
    render();
  }

  // 0102: alarmes que não travam nada — fala do time digitada direto no Chatwoot (gatilho em mari_turnos → mari_erros
  // 'resposta_fora_niogen') e a última leitura do quality_rating do número da WABA Nio (n8n waba_qualidade, 8h e 14h).
  async function carregarAlarmes() {
    const ini = new Date(`${NG.diaSP()}T00:00:00-03:00`).toISOString();
    const [rf, rw, ran] = await Promise.all([
      NG.sb.from('mari_erros').select('conversa_id').eq('no_n8n', 'resposta_fora_niogen').gte('created_at', ini).limit(1000),
      NG.sb.from('waba_qualidade').select('quality_rating, status, lida_em').order('lida_em', { ascending: false }).limit(1),
      NG.sb.from('v_andamento_resumo').select('*').maybeSingle(),   // 0105: portal PAP (extensão) + GED360 (robô)
    ]);
    alarmes = {
      fora: rf.error ? null : (rf.data || []).length,
      fora_conv: rf.error ? null : new Set((rf.data || []).map((x) => x.conversa_id)).size,
      waba: rw.error ? null : (rw.data || [])[0] || false,
      and: ran && !ran.error ? ran.data : null,
    };
    renderAlarmes();
  }
  function renderAlarmes() {
    const el = document.getElementById('alarmes-op');
    if (!el || !alarmes) return;
    const itens = [];
    if (alarmes.fora) {
      itens.push(`<div class="faixa amarelo"><b>${NG.fmtNum(alarmes.fora)} ${alarmes.fora === 1 ? 'resposta' : 'respostas'} fora do NIOGEN hoje</b>
        (${NG.fmtNum(alarmes.fora_conv)} ${alarmes.fora_conv === 1 ? 'conversa' : 'conversas'}) — o time respondeu direto no Chatwoot. Responda pela ficha (barra Conversa): é ela que faz a venda andar.</div>`);
    }
    const w = alarmes.waba;
    const velha = w && (Date.now() - new Date(w.lida_em)) > 2 * 86400000;
    if (w === false || velha) {
      itens.push(`<div class="faixa cinza">Qualidade do número da WABA Nio: ${w ? `última leitura em ${esc(NG.fmtDataHora(w.lida_em))}` : 'ainda sem leitura'} — o n8n <b>waba_qualidade</b> lê às 8h e às 14h.</div>`);
    } else if (w && w.quality_rating && w.quality_rating !== 'GREEN') {
      const cor = w.quality_rating === 'RED' ? 'vermelho' : 'amarelo';
      itens.push(`<div class="faixa ${cor}"><b>Qualidade do número da WABA Nio: ${esc(w.quality_rating)}</b> (lida ${esc(NG.fmtDataHora(w.lida_em))}). Sem teto de contatos, a Meta é quem freia: diminua os toques frios e confira bloqueios e denúncias antes de seguir.</div>`);
    }
    // 0105: andamento na Nio. Portal: amarelo com mais de 12 h sem leitura em dia útil (seg–sáb). GED360: 2 rodadas seguidas
    // com falha → "sem leitura desde HH:MM"; nunca rodou → cinza (robô desligado até a senha entrar no n8n).
    const an = alarmes.and;
    if (an) {
      const util = new Date().getDay() !== 0;
      const hP = an.portal_ultima_leitura ? (Date.now() - new Date(an.portal_ultima_leitura)) / 3600000 : null;
      if (hP == null) itens.push('<div class="faixa cinza">Status do portal PAP: ainda sem leitura — no portal, abra <b>Histórico de Pedidos</b> e use <b>Atualizar status no NIOGEN</b> na extensão (manhã e tarde).</div>');
      else if (util && hP > 12) itens.push(`<div class="faixa amarelo"><b>Portal: última leitura há ${NG.fmtNum(Math.floor(hP))} h</b> — abra o Histórico de Pedidos e use <b>Atualizar status no NIOGEN</b> na extensão.</div>`);
      if (!an.ged360_ultima_tentativa) itens.push('<div class="faixa cinza">Biometria (GED360): o robô ainda não rodou — fica desligado até a senha do GED360 entrar no n8n.</div>');
      else if (an.ged360_falhas_seguidas >= 2) itens.push(`<div class="faixa vermelho"><b>GED360 sem leitura desde ${esc(an.ged360_ultima_ok ? NG.fmtDataHora(an.ged360_ultima_ok) : 'sempre')}</b>${an.ged360_ultimo_erro ? ` — ${esc(an.ged360_ultimo_erro)}` : ''}. Até voltar, confira a biometria à mão no GED360.</div>`);
      if (an.bio_desconhecidos) itens.push(`<div class="faixa amarelo">GED360 trouxe ${NG.fmtNum(an.bio_desconhecidos)} resultado(s) de biometria fora do mapa — o NIOGEN guardou e não mexeu na venda. Avise o Claude Code para completar o mapa.</div>`);
    }
    el.hidden = !itens.length;
    el.innerHTML = itens.join('');
    // cartão "Andamento na Nio" (contagens) — desenhado aqui porque os dados chegam junto dos alarmes
    const card = document.getElementById('and-card');
    if (card && an) {
      const lista = (o) => Object.entries(o || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<span class="chip dim">${esc(k)} <b>${NG.fmtNum(n)}</b></span>`).join(' ') || '<span class="nota-campo">nenhum</span>';
      card.innerHTML = `<div class="q-linha"><h2>Andamento na Nio</h2><a class="muted" href="fila.html">Live →</a></div>
        <div><span class="nota-campo">Portal PAP (pedidos de Venda):</span> ${lista(an.por_status_portal)}</div>
        <div><span class="nota-campo">Biometria GED360 (30 dias):</span> ${lista(an.por_resultado_bio)}</div>
        <span class="nota-campo">Portal lido ${an.portal_ultima_leitura ? esc(NG.fmtDataHora(an.portal_ultima_leitura)) : '—'} · GED360 ${an.ged360_ultima_ok ? esc(NG.fmtDataHora(an.ged360_ultima_ok)) : '—'}${an.casar_pedido ? ` · <b>${NG.fmtNum(an.casar_pedido)} pedido(s) para casar</b>` : ''}</span>`;
    }
  }

  // Mari: conversas que pediram humano e ninguém respondeu ainda (a mesma regra da tela Mari; testes fora).
  const ENCERRA = ['recusa_compra', 'sem_cobertura', 'fora_de_area', 'ja_cliente_nio', 'sem_contato'];
  async function carregarMari() {
    const { data, error } = await NG.sb.from('mari_conversas').select('id, telefone, canal, nome_contato, handoff_em, handoff_motivo, status, venda_id')
      .eq('status', 'handoff_realizado').order('handoff_em', { ascending: true }).limit(500);
    if (error) return { erro: NG.msgErro(error) };
    const reais = (data || []).filter((c) => c.canal !== 'teste' && !String(c.telefone || '').startsWith('5500000000'));
    // Prompt 18 (B4): dados completos e venda NÃO criada (duplicidade ou outro erro) — o mesmo aviso da tela Mari.
    const semVenda = reais.filter((c) => c.handoff_motivo === 'dados_completos' && !c.venda_id);
    const esperando = reais.filter((c) => c.handoff_motivo !== 'dados_completos' && !ENCERRA.includes(c.handoff_motivo));
    if (!esperando.length) return { lista: [], semVenda };
    const { data: t } = await NG.sb.from('mari_turnos').select('conversa_id, created_at').eq('papel', 'humano').in('conversa_id', esperando.slice(0, 300).map((c) => c.id));
    const respondeu = new Set((t || []).filter((x) => { const c = esperando.find((y) => y.id === x.conversa_id); return c && new Date(x.created_at) >= new Date(c.handoff_em); }).map((x) => x.conversa_id));
    return { lista: esperando.filter((c) => !respondeu.has(c.id)), semVenda };
  }

  const metaDoMes = (aaaamm) => { const m = metas.find((x) => String(x.mes).slice(0, 7) === aaaamm); return m ? Number(m.meta_vendas) : 0; };

  function render() {
    const p = per.valor();
    const nomeMes = new Intl.DateTimeFormat('pt-BR', { timeZone: NG.TZ, month: 'long' }).format(new Date());
    const fraseDia = new Intl.DateTimeFormat('pt-BR', { timeZone: NG.TZ, weekday: 'long', day: '2-digit', month: '2-digit' }).format(new Date());
    document.getElementById('titulo').textContent = 'Painel';
    document.getElementById('sub').textContent = `${fraseDia.charAt(0).toUpperCase() + fraseDia.slice(1)} · atualizado ${NG.fmtHora(new Date())} · `
      + (osab ? `OSAB de ${osab.dt_ref ? NG.fmtDiaISO(osab.dt_ref).slice(0, 5) : '—'} aplicado ${NG.fmtDataHora(osab.aplicado_em)}` : 'OSAB ainda não importado');

    renderFaixa();

    // ---------- KPIs do período (a mesma conta da tela Vendas: vendidas pela data da venda) ----------
    const V = vendas.filter((v) => v.vendido_em && v.status !== 'saida' && NG.noPeriodo(v.vendido_em, p));
    // 0087 (Ricardo, 09/11): a meta conta INSTALADAS (sem Saída — a mesma conta da faixa e do resumo diário); vendas (OS) ao lado.
    const inst = vendas.filter((v) => v.instalado_em && v.status !== 'saida' && NG.noPeriodo(v.instalado_em, p));
    const aguard = V.filter((v) => ['1_vendido', '2_aguardando_instalacao'].includes(v.status)).length;
    // 0090: "Precisam de ação" = v_jornada (a mesma lista do Live e o mesmo número do menu), conversas incluídas.
    const comissao = V.reduce((s, v) => s + Number(v.comissao_prevista || 0), 0);
    const meta = ['mes', 'mesant'].includes(p.valor) && p.de ? metaDoMes(p.de.slice(0, 7)) : 0;
    const acao = jor.lista.filter((j) => j.precisa_acao).sort(NG.ordemJornada);
    const verm = acao.filter((j) => j.nivel === 'agora').length;
    const faltam = Math.max(0, meta - inst.length);
    document.getElementById('kpis').innerHTML = [
      NG.kpi({ rot: meta ? 'Instaladas · meta' : 'Instaladas', val: NG.fmtNum(inst.length), de: meta || null, pct: meta ? (inst.length / meta) * 100 : null,
        nota: meta ? (faltam ? `faltam ${NG.fmtNum(faltam)} em ${esc(nomeMes)}` : 'meta batida ✓') : esc(per.rotulo.toLowerCase()),
        dica: 'A meta do mês conta instaladas (data da instalação, sem Saída) — é o que paga comissão.' }),
      NG.kpi({ rot: 'Vendas (OS aberta)', val: NG.fmtNum(V.length), nota: `${NG.fmtNum(aguard)} esperando a instalação`,
        dica: 'Venda = OS aberta no portal com o dia e o período, depois da biometria validada (etapa 4), pela data da venda. Lead qualificado e pedido não contam.' }),
      NG.kpi({ rot: 'Comissão prevista', val: esc(NG.fmtMoeda(comissao)), nota: `${V.length === 1 ? 'da venda' : `das ${NG.fmtNum(V.length)} vendas`} do período`,
        dica: 'Soma da comissão prevista das vendas do período (antes do pagamento). Paga = o que chegou no extrato da Nio.' }),
      NG.kpi({ rot: 'Precisam de ação', val: NG.fmtNum(acao.length), cls: verm ? 'bad' : acao.length ? 'warn' : '',
        nota: acao.length ? `${NG.fmtNum(verm)} para agora (cliente esperando ou prazo do contrato)` : 'nada pendente ✓',
        dica: 'O mesmo número do Live e do menu (v_jornada): conversas esperando o time e vendas com o próximo passo vencendo. Pendência com terceiro só entra na data de revisão. Não depende do período.' }),
    ].join('');

    // ---------- Precisam de ação agora (8 primeiras) ----------
    const local = (v) => [v.bairro, v.cidade].filter(Boolean).join(' · ');
    const etJ = (j) => (NG.JORNADA.find((e) => e.n === j.etapa) || { id: '', nome: j.etapa_nome });
    document.getElementById('lista-acao').innerHTML = acao.length ? acao.slice(0, 8).map((j) => `
      <a class="la" href="${j.venda_id ? `#venda=${esc(j.venda_id)}` : `fila.html#conversa=${esc(j.conversa_id)}`}">
        <span class="la-cli"><b>${esc(j.nome)}</b><small>${esc(j.cidade || '—')}</small></span>
        <span class="pill ${etJ(j).id}">${esc(etJ(j).nome)}</span>
        <span class="la-prox">${NG.proxPasso(NG.passoJornada(j))}</span>
      </a>`).join('') : '<div class="vazio-curto">Nada pendente agora ✓</div>';
    const va = document.getElementById('ver-acao');
    va.textContent = acao.length > 8 ? `ver todas (${NG.fmtNum(acao.length)}) →` : 'ver no Live →';
    va.href = ['admin', 'backoffice'].includes(eu.perfil) ? 'fila.html' : 'vendas.html?vista=lista&aba=acao';

    // ---------- blocos curtos ----------
    const blocos = [];
    // Resumo de ontem (onda 3.2, só admin): o mesmo texto que o n8n vai mandar às 8h quando o canal for decidido.
    if (ehAdmin) {
      blocos.push(`<section class="painel bloco-curto resumo-ontem">
        <div class="q-linha"><h2 title="resumo_diario(ontem): vendas do dia, Meta Ads, conversas paradas, prazos do contrato e ritmo da meta. Sem CPF nem telefone.">Resumo de ontem</h2><button type="button" class="btn btn-sm" id="copiar-resumo"${resumo && resumo.texto ? '' : ' disabled'}>Copiar</button></div>
        ${resumo === undefined ? '<span class="nota-campo">Carregando…</span>' : !resumo ? '' : resumo.erro ? `<span class="nota-campo">${esc(resumo.erro)}</span>`
          : `<pre class="resumo-txt">${esc(resumo.texto)}</pre><span class="nota-campo">Às 8h (seg–sáb) este resumo chega no seu WhatsApp.</span>`}
      </section>`);
    }
    // Vendas por etapa (abertas + Ativo; Saída à parte) → Quadro
    const porEtapa = Object.fromEntries(ETAPAS.map((e) => [e.id, 0]));
    vendas.filter((v) => NG.noPeriodo(v.criado_em, p) || v.status !== 'saida').forEach((v) => { const e = NG.etapaDe(v).id; if (e in porEtapa) porEtapa[e] += 1; });
    const maxE = Math.max(1, ...ETAPAS.filter((e) => e.id !== 'saida').map((e) => porEtapa[e.id]));
    blocos.push(`<section class="painel bloco-curto">
      <div class="q-linha"><h2>Vendas por etapa</h2><a class="muted" href="vendas.html?vista=quadro">Quadro →</a></div>
      ${ETAPAS.filter((e) => e.id !== 'saida').map((e) => `<a class="q-item" href="vendas.html?vista=quadro&amp;etapa=${e.id}">
        <div class="q-linha"><span>${esc(e.nome)}</span><span class="mono">${NG.fmtNum(porEtapa[e.id])}</span></div>
        <div class="q-trilho"><i class="et-${e.id}" style="width:${(porEtapa[e.id] / maxE) * 100}%"></i></div></a>`).join('')}
      <span class="nota-campo">Saída: ${NG.fmtNum(porEtapa.saida)} no período · abertas aparecem sempre</span>
    </section>`);
    // Em espera (0064): pendências com terceiro, as que vencem primeiro no topo → Vendas ?aba=espera
    const espera = vendas.map((v) => ({ v, pe: NG.pendencia(v) })).filter((x) => x.pe)
      .sort((a, b) => a.pe.revisar_em.localeCompare(b.pe.revisar_em));
    const vencidas = espera.filter((x) => x.pe.vencida).length;
    blocos.push(`<section class="painel bloco-curto">
      <div class="q-linha"><h2 title="${esc(NG.ajuda.pendencia)}">Em espera</h2><a class="muted" href="vendas.html?vista=lista&amp;aba=espera">Vendas →</a></div>
      <a class="bc-num" href="vendas.html?vista=lista&amp;aba=espera" style="text-decoration:none"><span class="mono">${NG.fmtNum(espera.length)}</span><span class="muted">em espera · <span class="${vencidas ? 'bad-txt' : ''}">${NG.fmtNum(vencidas)} vencida${vencidas === 1 ? '' : 's'}</span></span></a>
      ${espera.slice(0, 4).map(({ v, pe }) => `<a class="bc-linha" href="#venda=${v.id}"><span>${esc(NG.primeiroNome(v.cliente_nome))}</span><span class="${pe.vencida ? 'bad-txt' : 'muted'}">${pe.vencida ? '⏰ revisar hoje' : `revisar ${esc(pe.diaTxt)}`} · ${esc(pe.quemTxt)}${pe.revisoes >= 2 ? ` · ⚠️ ${pe.revisoes}×` : ''}</span></a>`).join('')}
      ${espera.length ? '' : '<span class="nota-campo">Nenhuma venda esperando terceiro.</span>'}
    </section>`);
    // Instalações de hoje → Instalações
    const hoje = NG.diaSP();
    const instHoje = vendas.filter((v) => !v.instalado_em && v.status === '2_aguardando_instalacao' && v.instalacao_agendada_para && NG.diaSP(v.instalacao_agendada_para) === hoje)
      .sort((a, b) => new Date(a.instalacao_agendada_para) - new Date(b.instalacao_agendada_para));
    const feitasHoje = vendas.filter((v) => v.instalado_em && NG.diaSP(v.instalado_em) === hoje).length;
    const osAg = vendas.filter((v) => ((v.status === '0_qualificado' && v.biometria_status === 'validada' && String(v.nio_pedido || '').trim()) || (['1_vendido', '2_aguardando_instalacao'].includes(v.status) && !v.instalacao_agendada_para)));   // 0096: OS ou agendamento pendente
    const semAgenda = osAg.length;
    blocos.push(`<section class="painel bloco-curto">
      <div class="q-linha"><h2>Instalações de hoje</h2><a class="muted" href="instalacoes.html">Instalações →</a></div>
      <div class="bc-num"><span class="mono">${NG.fmtNum(instHoje.length)}</span><span class="muted">agendada${instHoje.length === 1 ? '' : 's'} · ${NG.fmtNum(feitasHoje)} instalada${feitasHoje === 1 ? '' : 's'} hoje</span></div>
      ${instHoje.slice(0, 4).map((v) => `<a class="bc-linha" href="#venda=${v.id}"><span>${esc(NG.primeiroNome(v.cliente_nome))}</span><span class="muted">${esc(NG.janela(v.instalacao_agendada_para))} · ${esc(v.bairro || '')}</span></a>`).join('')}
      ${semAgenda ? `<span class="prox ${osAg.some((v) => Number(v.horas_sem_agendamento) > 4) ? 'bad' : 'warn'}">${NG.fmtNum(semAgenda)} esperando abrir a OS ou agendar (4 h da biometria)</span>` : ''}
    </section>`);
    // Mari: conversas que precisam de humano (só admin/backoffice veem a Mari)
    if (veMari) {
      // 0090: as conversas que precisam de ação pela regra única (v_jornada) — as mesmas do Live.
      const lista = jor.lista.filter((j) => j.conversa_id && j.precisa_acao).sort(NG.ordemJornada);
      blocos.push(`<section class="painel bloco-curto">
        <div class="q-linha"><h2>Conversas · precisam de ação</h2><a class="muted" href="fila.html">Live →</a></div>
        <div class="bc-num"><span class="mono ${lista.length ? 'warn-txt' : ''}">${NG.fmtNum(lista.length)}</span><span class="muted">conversa${lista.length === 1 ? '' : 's'} esperando o time</span></div>
        ${lista.slice(0, 4).map((j) => `<a class="bc-linha" href="${j.venda_id ? `#venda=${esc(j.venda_id)}` : `fila.html#conversa=${esc(j.conversa_id)}`}"><span>${esc(NG.primeiroNome(j.nome))}</span><span class="muted">${esc(j.o_que_fazer)}</span></a>`).join('')}
        ${mari && (mari.semVenda || []).length ? (mari.semVenda.slice(0, 3).map((c) => `<a class="prox bad" href="mari.html?conversa=${esc(c.id)}" title="Dados completos, mas a venda não foi criada (duplicidade ou outro erro) — o backoffice decide">⚠️ Venda não criada · ${esc(c.nome_contato || 'Contato')} · ${esc(NG.quando(c.handoff_em))} ${esc(NG.fmtHora(c.handoff_em))}</a>`).join('')) : ''}
        ${portal && portal.ok === false && !portal.nunca ? `<span class="prox bad" title="${esc(portal.ultimo_erro || 'sessão vencida')}">Portal PAP sem sessão${portal.sem_sessao_desde ? ` desde ${esc(NG.quando(portal.sem_sessao_desde))} ${esc(NG.fmtHora(portal.sem_sessao_desde))}` : ''} · a Mari fala por cidade</span>` : ''}
      </section>`);
    }
    // Cobertura JF (base DFV) → Cobertura
    blocos.push(`<section class="painel bloco-curto">
      <div class="q-linha"><h2>Cobertura JF (DFV)</h2><a class="muted" href="cobertura.html">Consultar →</a></div>
      ${base === undefined ? '<span class="nota-campo">Carregando…</span>' : base && base.erro ? `<span class="nota-campo">Resumo indisponível agora (${esc(base.erro)}).</span>` : base ? `<div class="bc-num"><span class="mono">${NG.fmtNum(base.hp_livre)}</span><span class="muted">portas livres (HP) · ${NG.fmtNum(Number(base.pct_ocupacao) * 100)} % ocupado</span></div>
        <span class="nota-campo">Base de ${esc(NG.fmtDiaISO(base.particao))} · consulta por CEP e número na tela Cobertura</span>`
        : '<span class="nota-campo">Base DFV ainda não carregada.</span>'}
    </section>`);
    if (veMari) blocos.unshift('<section class="painel bloco-curto" id="and-card"><span class="nota-campo">Carregando o andamento na Nio…</span></section>');
    document.getElementById('blocos').innerHTML = blocos.join('');
    if (alarmes) renderAlarmes();
    const bc = document.getElementById('copiar-resumo');
    if (bc) bc.onclick = async () => {
      try { await navigator.clipboard.writeText(resumo.texto); NG.toast('Resumo copiado ✓', 'ok'); }
      catch (e) { NG.toast('Não deu para copiar — selecione o texto e copie à mão', 'bad'); }
    };
  }

  // ---------- faixa "primeira venda" (onda 2.1): meta × instaladas, ritmo e paradas por etapa ----------
  // Não depende do Período: é sempre o mês corrente (a meta é mensal) e as vendas abertas agora.
  function renderFaixa() {
    const el = document.getElementById('faixa-meta');
    const nomeMes = new Intl.DateTimeFormat('pt-BR', { timeZone: NG.TZ, month: 'long' }).format(new Date());
    let meta = '';
    if (!ritmo) meta = '<div class="fm-meta"><span class="nota-campo">Meta do mês indisponível agora.</span></div>';
    else {
      const r = ritmo;
      const plural = (n, um, v) => `${NG.fmtNum(n)} ${n === 1 ? um : v}`;
      const frase = !r.meta ? 'sem meta cadastrada para o mês'
        : r.faltam === 0 ? 'meta batida ✓'
        : `faltam <b>${NG.fmtNum(r.faltam)}</b> em ${plural(r.dias_restantes, 'dia', 'dias')} → <b>${String(r.por_dia).replace('.', ',')}</b> por dia`;
      meta = `<div class="fm-meta" title="Instaladas no mês (data da instalação, sem Saída) contra a meta de config_metas. Ritmo em dias corridos até o fim do mês, hoje incluído.">
        <span class="rot">Meta de ${esc(nomeMes)} · instaladas</span>
        <span class="val"><b class="mono">${NG.fmtNum(r.instaladas)}</b> <small>/ ${NG.fmtNum(r.meta)}</small></span>
        <div class="barra"><i style="width:${Math.max(0, Math.min(100, Number(r.pct || 0)))}%"></i></div>
        <span class="fm-ritmo">${frase}</span>
      </div>`;
    }
    const grupos = Object.fromEntries(NG.PARADAS.map((p) => [p.id, []]));
    vendas.forEach((v) => { const p = NG.paradaDe(v, regras); if (p && grupos[p.id]) grupos[p.id].push(p); });
    const etapas = NG.PARADAS.map((p, i) => {
      const g = grupos[p.id];
      const velha = g.reduce((m, x) => (!m || new Date(x.desde) < new Date(m.desde) ? x : m), null);
      const atras = g.filter((x) => x.atrasada).length;
      const cls = atras ? 'bad' : g.length ? '' : 'vazia';
      const prazo = g[0] && g[0].prazo ? ` · prazo ${g[0].prazo}` : '';
      return `${i ? '<span class="fm-seta" aria-hidden="true">→</span>' : ''}<a class="fm-etapa ${cls}" href="vendas.html?vista=lista&amp;parada=${p.id}" title="${esc(p.dica)}">
        <span class="fm-nome">${esc(p.nome)}</span>
        <span class="fm-n mono">${NG.fmtNum(g.length)}</span>
        <span class="fm-velha">${velha ? `mais antiga há ${esc(NG.haQuanto(velha.desde))}` : '—'}</span>
        ${atras ? `<span class="fm-atraso">${NG.fmtNum(atras)} fora do prazo${esc(prazo)}</span>` : ''}
      </a>`;
    }).join('');
    el.innerHTML = `${meta}<div class="fm-etapas" aria-label="Vendas paradas por etapa">${etapas}</div>`;
    renderFunil();
  }

  // 0087 (Ricardo, 09/11): o funil inteiro do mês — entradas em cada etapa e a passagem da anterior. A linha grossa separa
  // lead (ainda não é venda) de venda (OS aberta no portal).
  function renderFunil() {
    const el = document.getElementById('funil-mes');
    if (!el) return;
    if (!funil || !Array.isArray(funil.etapas)) { el.innerHTML = ''; return; }
    const nomeMes = new Intl.DateTimeFormat('pt-BR', { timeZone: NG.TZ, month: 'long' }).format(new Date());
    const et = funil.etapas;
    const itens = et.map((e, i) => {
      const ant = i ? Number(et[i - 1].n) : null;
      const pct = ant ? Math.round((Number(e.n) / ant) * 100) : null;
      const venda = e.id === 'vendas';
      return `${i ? `<span class="fu-seta${venda ? ' corte' : ''}" aria-hidden="true">${venda ? '‖' : '→'}</span>` : ''}
        <div class="fu-etapa${venda ? ' venda' : ''}${Number(e.n) ? '' : ' vazia'}" title="${esc(e.dica || '')}">
          <span class="fu-nome">${esc(e.nome)}</span><span class="fu-n mono">${NG.fmtNum(Number(e.n))}</span>
          <span class="fu-pct">${pct == null ? '&nbsp;' : `${pct}% da anterior`}</span></div>`;
    }).join('');
    el.innerHTML = `<div class="fu-cab"><b>Funil de ${esc(nomeMes)}</b><span>entradas no mês em cada etapa · <b>lead qualificado e pedido não são venda</b>: venda = OS aberta com o dia e o período, depois da biometria</span></div>
      <div class="fu-etapas"><span class="fu-fase">Lead</span>${itens}</div>`;
  }

  NGFicha.aoMudar(() => carregar());
  NG.botaoAtualizar(() => Promise.all([carregar(), carregarExtras()]));   // 09/11: dados frescos sem F5
  await carregar();
  NGFicha.iniciar();
})();
</script>
</body>
</html>
