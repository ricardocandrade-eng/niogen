<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  const ehBO = ['admin', 'backoffice'].includes(eu.perfil);
  if (ehBO) { document.body.dataset.pulso = '1'; NGPulso.montar(document.getElementById('pulso')); }
  NGSidebar.montar();
  const corpo = document.getElementById('corpo');
  if (!ehBO) { corpo.innerHTML = '<div class="vazio-curto">A Live é do backoffice. Use o Funil de vendas.</div>'; return; }

  const filaEl = document.getElementById('fila');
  const clienteEl = document.getElementById('cliente');
  const movel = window.matchMedia('(max-width: 900px)');
  const TIPO = { responder: 'Responder', venda: 'Fechar venda', agenda: 'Agendar', ligar: 'Ligar', nio: 'Pendência Nio', decidir: 'Decidir' };
  const SINAL = { escorregou: 'A Mari escorregou', objecao: 'Objeção', quente: 'Cliente quente', pronto: 'Quase pronto', sumiu: 'Sumiu depois do preço' };
  const ls = { ler: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, gravar: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* modo privado */ } } };
  let D = null;                 // o que a live2_fila() devolveu
  let vista = ['vez', 'fila', 'reforco', 'radar', 'medicao'].includes(ls.ler('niogen.live2.vista')) ? ls.ler('niogen.live2.vista') : 'vez';
  let foco = null;              // chave da tarefa mostrada na comanda (a do topo, se nula)
  let rfAberto = null;          // conversa com a caixa de Soprar ou o "Agora não" abertos: 'soprar:<id>' | 'nao:<id>'
  let medicao = null;
  let ops = null;
  const mostrados = new Set();  // reforços já contados como "mostrados" nesta aba
  let motivosNao = [{ codigo: 'ja_falei', nome: 'Já falei' }, { codigo: 'nao_vale', nome: 'Não vale' }, { codigo: 'nao_era', nome: 'Não era' }, { codigo: 'depois', nome: 'Depois' }];
  NG.sb.from('config_regras').select('valor').eq('chave', 'reforco_sinais').maybeSingle().then(({ data }) => {
    const m = data && data.valor && data.valor.motivos_agora_nao;
    if (Array.isArray(m) && m.length) motivosNao = m;
  }, () => {});

  const ha = (iso) => {
    if (!iso) return '';
    const min = Math.max(0, (Date.now() - new Date(iso)) / 60000);
    if (min < 60) return `${Math.round(min)} min`;
    if (min < 48 * 60) return `${Math.floor(min / 60)} h`;
    return `${Math.floor(min / 1440)} d`;
  };
  const prazoDe = (t) => {
    if (t.prazo_em) {
      const min = (new Date(t.prazo_em) - Date.now()) / 60000;
      if (min <= 0) return { txt: 'venceu', urg: true };
      return { txt: min < 60 ? `${Math.round(min)} min` : min < 48 * 60 ? `${Math.floor(min / 60)} h` : `${Math.floor(min / 1440)} d`, urg: min <= 60 };
    }
    return t.urg >= 3 ? { txt: 'agora', urg: true } : t.urg === 2 ? { txt: 'hoje', urg: false } : { txt: '—', urg: false };
  };
  const fila = () => (D && D.fila) || [];
  const temFicha = (t) => !!(t.venda_id || t.conversa_id);
  const chaveFicha = (t) => (t.venda_id ? t.venda_id : `c:${t.conversa_id}`);
  const cor = (tipo) => `var(--t-${tipo})`;
  const reais = (v) => NG.fmtMoeda(Number(v) || 0).replace(/,00$/, '');
  const subDe = (t) => [t.cidade, t.plano, t.situacao_nome || t.etapa_nome].filter(Boolean).join(' · ') || '—';

  // ---------- carga ----------
  async function carregar(fresco = true) {
    if (fresco) NG.limparCache();
    NG.mudou('live2', 2 * 60000);
    const { data, error } = await NG.sb.rpc('live2_fila');
    if (error || !data) { corpo.innerHTML = `<div class="vazio-curto">${esc(error ? NG.msgErro(error) : 'A fila não veio. Atualize a página.')}</div>`; return; }
    D = data;
    if (foco && !fila().some((t) => t.k === foco)) foco = null;
    render();
    if (NGFicha.modo === 'cheia' && NGFicha.aberta) NGFicha.redesenhar();
    const novos = (D.reforco || []).filter((r) => !mostrados.has(`${r.conversa_id}|${r.sinal}`));
    if (novos.length) {
      novos.forEach((r) => mostrados.add(`${r.conversa_id}|${r.sinal}`));
      NG.sb.rpc('reforco_mostrados', { p_itens: novos.map((r) => ({ conversa_id: r.conversa_id, sinal: r.sinal })) }).then(() => {}, () => {});
    }
  }
  async function conferirCobertura() {
    const { data, error } = await NG.sb.rpc('live2_cobertura_conferir');
    if (error || !data || !D) return;
    D.cobertura = data;
    render();
  }

  // ---------- botões (a lista vem do banco) ----------
  const btHtml = (a, i, onde, k, grande) => {
    const cls = `btn${grande ? '' : ' btn-sm'}${a.principal && grande ? ' l2-go' : a.principal ? ' lv-go' : ''}${a.leve ? ' btn-ghost' : ''}`;
    if (a.a === 'tel') return `<a class="${cls}" href="tel:+${esc(a.tel)}" title="Abre o discador">📞 ${esc(a.rotulo)}</a>`;
    return `<button type="button" class="${cls}" data-ac="${i}" data-onde="${onde}" data-k="${esc(k)}">${esc(a.rotulo)}</button>`;
  };
  const acoesHtml = (t, grande) => {
    const acs = (t.acoes || []).map((a, i) => ({ a, i })).sort((x, y) => (y.a.principal ? 1 : 0) - (x.a.principal ? 1 : 0));
    const fixos = `${t.pode_adiar || t.pode_pausar ? `<button type="button" class="btn${grande ? '' : ' btn-sm'} btn-ghost" data-adiar="${esc(t.k)}" title="A tarefa sai da fila e volta sozinha na hora marcada (antes, se o cliente escrever)">Adiar</button>` : ''}`
      + `${t.pode_sair && !(t.acoes || []).some((x) => x.a === 'saida') ? `<button type="button" class="btn${grande ? '' : ' btn-sm'} btn-ghost" data-saida="${esc(t.k)}" title="Encerrar com motivo: sai da fila; se o cliente escrever de novo, volta">Saída</button>` : ''}`;
    return acs.map(({ a, i }) => btHtml(a, i, 'fila', t.k, grande)).join('') + fixos;
  };
  async function perguntar(pede) {
    if (pede.livre) {
      const fd = await NG.modal(`<h3>${esc(pede.titulo)}</h3><label class="campo">Motivo<input type="text" name="v" maxlength="200"></label>`);
      return fd ? String(fd.get('v') || '') : null;
    }
    const fd = await NG.modal(`<h3>${esc(pede.titulo)}</h3><label class="campo">Motivo<select name="v" required><option value="">Escolha…</option>${(pede.opcoes || []).map((o) => `<option>${esc(o)}</option>`).join('')}</select></label>`);
    return fd ? String(fd.get('v') || '') : null;
  }
  async function agir(b) {
    const lista = b.dataset.onde === 'sistema' ? (D.sistema || []) : fila();
    const t = lista.find((x) => (b.dataset.onde === 'sistema' ? `${x.tipo}:${x.chave}` : x.k) === b.dataset.k);
    const a = t && (t.acoes || [])[Number(b.dataset.ac)];
    if (!a) return;
    if (a.a === 'saida') { await saida(t.k); return; }   // 0398: o cliente recusou
    if (a.a === 'abrir') { if (!temFichaK(t)) return; if (a.etapa) NGFicha.etapaInicial = a.etapa; abrirChave(kFicha(t)); return; }
    if (a.a === 'assumir') {
      b.disabled = true;
      const r = await NG.momento(t.venda_id || null, 'assumir', t.venda_id ? {} : { conversa_id: t.conversa_id });
      if (!r) { b.disabled = false; return; }
      abrirChave(chaveFicha(t));
      await carregar();
      return;
    }
    if (a.a !== 'rpc') return;
    if (a.confirma && !window.confirm(a.confirma)) return;
    const args = { ...(a.args || {}) };
    if (a.pede) {
      const v = await perguntar(a.pede);
      if (v === null) return;
      args[a.pede.arg] = v || null;
    }
    b.disabled = true;
    const { data, error } = await NG.sb.rpc(a.fn, args);
    if (error) { NG.toast(NG.msgErro(error), 'bad'); b.disabled = false; return; }
    NG.toast((data && data.resumo) || 'Feito', 'ok');
    if (a.depois === 'abrir' && temFichaK(t)) abrirChave(kFicha(t));
    await carregar();
  }
  const temFichaK = (t) => !!(t.venda_id || t.conversa_id || (t.k && !String(t.k).startsWith('p:') && t.k !== 'null'));
  const kFicha = (t) => (t.venda_id ? t.venda_id : t.conversa_id ? `c:${t.conversa_id}` : t.k);

  async function adiar(k) {
    const t = fila().find((x) => x.k === k);
    if (!t) return;
    if (!t.pode_adiar) { await pausar(t); return; }
    const d = (n) => NG.somaDias(NG.diaSP(), n);
    const fd = await NG.modal(`<h3>Adiar: ${esc(t.nome)}</h3>
      <p>A conversa fica <b>Em espera</b> até o dia escolhido e a tarefa sai da fila. No dia, ela volta sozinha.</p>
      <label class="campo">Volta em<select name="q"><option value="${d(1)}">Amanhã</option><option value="${d(3)}">Em 3 dias</option><option value="${d(7)}">Em 7 dias</option><option value="">Outra data…</option></select></label>
      <label class="campo" data-outra hidden>Data<input type="date" name="data" min="${d(1)}"></label>
      <label class="campo">Motivo<input type="text" name="motivo" maxlength="80" required placeholder="Ex.: cliente pediu para falar na sexta"></label>`,
    (dl) => {
      const sel = dl.querySelector('[name=q]'); const box = dl.querySelector('[data-outra]'); const inp = dl.querySelector('[name=data]');
      sel.addEventListener('change', () => { box.hidden = !!sel.value; inp.required = !sel.value; });
    });
    if (!fd) return;
    const ate = String(fd.get('q') || fd.get('data') || '');
    if (!ate) return;

  async function saida(k) {
    const t = fila().find((x) => x.k === k);

    const lista = (await NG.saidaLista()).filter((x) => x.codigo !== 'nao_contatar' && !(NG.SAIDA_SO_VENDA || []).includes(x.codigo));
    if (!lista.length) { NG.toast('A lista de motivos de saída não carregou. Tente de novo.', 'bad'); return; }
    const fd = await NG.modal(`<h3>Saída: ${esc(t.nome)}</h3>
      <p>Encerra com motivo e tira da fila. Se o cliente escrever de novo, ele volta.</p>

      <label class="campo" data-sub hidden>Porquê<select name="sub"></select></label>
      <label class="campo">Observação (opcional)<input type="text" name="obs" maxlength="200"></label>`,
    (dl) => {
      const sel = dl.querySelector('[name=motivo]'); const box = dl.querySelector('[data-sub]'); const sub = dl.querySelector('[name=sub]');

    NG.toast((data && data.resumo) || 'Saída registrada', 'ok');
    await carregar();

          <div><b>${esc(String(g.total || 0))}</b> ${g.total === 1 ? 'caso' : 'casos'} (${esc(String(g.da_mari || 0))} que a Mari passou, ${esc(String(g.com_o_time || 0))} já com o time) · respondidos por uma pessoa em até 5 min: <b>${esc(String(g.ate_5min || 0))}</b> · em até 30 min: ${esc(String(g.ate_30min || 0))} · sem resposta: ${esc(String(g.sem_resposta || 0))}
            · viraram pedido: <b>${esc(String(g.pedido || 0))}</b> (${esc(String(g.instalada || 0))} instaladas) · saíram: ${esc(String(g.saida || 0))} · em andamento: ${esc(String(g.em_andamento || 0))}</div>
          ${(g.lista || []).length ? `<table class="l2-med"><thead><tr><th>Lead</th><th>Quando</th><th>Com quem estava</th><th>O que foi</th><th>Resposta (min)</th><th>No que deu</th></tr></thead><tbody>
            ${g.lista.slice(0, 30).map((x) => `<tr><td>${x.lead ? `L-${esc(String(x.lead))}` : '—'}</td><td>${esc(NG.fmtDataHora(x.em))}</td><td>${x.origem === 'time' ? 'time' : 'Mari'}</td><td style="text-align:left">${esc(TP[x.tipo] || x.tipo)}</td><td>${x.minutos == null ? 'sem resposta' : esc(String(x.minutos))}</td><td>${esc(DEU[x.deu] || x.deu)}</td></tr>`).join('')}</tbody></table>` : ''}
          <div class="l2-sub">Conta cada vez que um cliente com plano escolhido falou de pressa na instalação ou de desistir: quando a Mari passou ao time, e quando a conversa já estava com o time. Um caso por lead e por dia. O selo e o 1º lugar na fila existem desde 25/11/2026; os casos de antes servem de base de comparação.</div></div>`; })()}
      <div class="l2-caixa" style="overflow-x:auto"><h3>Por dia</h3><table class="l2-med"><thead><tr><th>Dia</th><th>Respostas de pessoa</th><th>Mediana (min)</th><th>&gt; 30 min</th><th>&gt; 2 h</th><th>Furos</th><th>Abriu Live</th><th>Abriu Live 2.0</th><th>Abriu Conversas</th></tr></thead><tbody>
        ${(m.dias || []).slice().reverse().map((d) => `<tr><td>${esc(NG.fmtData(d.dia))}</td><td>${d.respostas}</td><td>${d.mediana_min == null ? '—' : String(d.mediana_min).replace('.', ',')}</td><td>${d.acima_30}</td><td>${d.acima_2h}</td><td>${d.furos}</td><td>${d.abriu_live}</td><td>${d.abriu_live2}</td><td>${d.abriu_conversas}</td></tr>`).join('')}</tbody></table></div>
      <div class="l2-caixa" style="overflow-x:auto"><h3>Reforço: o que foi feito e no que deu</h3>
        ${rf.length ? `<table class="l2-med"><thead><tr><th>Sinal</th><th>O que foi feito</th><th>Casos</th><th>Respondeu em 24 h</th><th>Virou venda</th><th>Com pedido</th><th>Saiu</th></tr></thead><tbody>
          ${rf.map((x) => `<tr><td>${esc(SINAL[x.sinal] || x.sinal)}</td><td style="text-align:left">${esc({ so_mostrado: 'Só apareceu', soprar: 'Soprou', assumir: 'Assumiu', agora_nao: 'Agora não' }[x.modo] || x.modo)}</td><td>${x.n}</td><td>${x.respondeu_24h}</td><td>${x.virou_venda}</td><td>${x.com_pedido}</td><td>${x.saiu}</td></tr>`).join('')}</tbody></table>
          <div class="l2-sub">"Só apareceu" é o grupo de comparação. Com poucos casos, leia como fato, não como causa.</div>` : '<div class="l2-sub">Nenhum reforço registrado ainda.</div>'}</div>`;
  }
  function render() {
    if (!D) return;
    const f = fila();
    const c = D.conta || {};
    document.getElementById('placar').innerHTML = `${esc(String(D.feitos || 0))} ${D.feitos === 1 ? 'feita' : 'feitas'} hoje · <b>${f.length ? `faltam ${f.length}` : 'Fila limpa ✅'}</b>`;
    document.getElementById('alertas').innerHTML = alertasHtml();
    const tab = (id, nome, n) => `<button type="button" class="l2-tab" role="tab" data-vista="${id}" aria-selected="${vista === id}">${nome}${n == null ? '' : `<b>${n}</b>`}</button>`;
    document.getElementById('tabs').innerHTML = tab('vez', 'Tarefa da vez') + tab('fila', 'Fila inteira', f.length) + tab('reforco', 'Reforço', (D.reforco || []).length)
      + tab('radar', 'Radar', (Number(c.com_mari) || 0) + (Number(c.esperando_cliente) || 0) + (Number(c.em_pausa) || 0) + (Number(c.esperando_nio) || 0)) + tab('medicao', '7 dias');
    const rol = corpo.scrollTop;
    const txt = document.activeElement && document.activeElement.tagName === 'TEXTAREA' ? { id: document.activeElement.id, v: document.activeElement.value } : null;
    corpo.innerHTML = vista === 'fila' ? vistaFila() : vista === 'reforco' ? vistaReforco() : vista === 'radar' ? vistaRadar() : vista === 'medicao' ? vistaMedicao() : vistaVez();
    corpo.scrollTop = rol;
    if (txt && txt.id) { const el = document.getElementById(txt.id); if (el) { el.value = txt.v; el.focus(); } }
    sincCliente();
  }
  async function trocarVista(v) {
    vista = v; rfAberto = null;
    ls.gravar('niogen.live2.vista', v);
    render();
    if (v === 'medicao') {
      const [a, g] = await Promise.all([NG.sb.rpc('live2_medicao', { p_dias: 14 }), NG.sb.rpc('live2_resgates', { p_dias: 30 })]);
      medicao = a.data || { dias: [], total: {}, base: {}, reforco: [] };
      medicao.resgates = g.data || null;
      render();
    }
    if (v === 'radar' && !ops) { const { data } = await NG.sb.rpc('oportunidades_abertas'); ops = Array.isArray(data) ? data : (data && data.lista) || []; render(); }
  }

  // ---------- cliente em tela cheia (a mesma ficha da Live) ----------
  const comFicha = () => fila().filter(temFicha);
  const posicao = () => {
    const l = comFicha();
    const i = l.findIndex((t) => chaveFicha(t) === NGFicha.atual);
    return { i: i + 1, n: l.length, prev: i > 0 ? l[i - 1] : null, next: i >= 0 ? l[i + 1] || null : l[0] || null };
  };
  function abrirChave(k) {
    if (!k) return;
    if (String(k).startsWith('c:')) NGFicha.abrirConversa(k.slice(2)); else NGFicha.abrir(k);
    setTimeout(sincCliente, 0);
  }
  NGFicha.cheia(clienteEl, {
    posicao,
    aoNavegar(dir) { const p = posicao(); const alvo = dir < 0 ? p.prev : p.next; if (alvo) abrirChave(chaveFicha(alvo)); },
    aoConcluir() {
      const k = NGFicha.atual;
      const prox = comFicha().find((t) => chaveFicha(t) !== k);
      if (prox) { abrirChave(chaveFicha(prox)); NG.toast(`Próximo: ${NG.primeiroNome(prox.nome || 'Contato')}`, 'ok'); } else { NGFicha.fecharCheia(); NG.toast('Fila limpa ✅', 'ok'); }
    },
  });
  const modoFicha = () => { if (!movel.matches) NGFicha.usarCheia(); else NGFicha.usarGaveta(); };
  function sincCliente() {
    const aberto = NGFicha.modo === 'cheia' && NGFicha.aberta;
    clienteEl.classList.toggle('open', aberto);
    clienteEl.setAttribute('aria-hidden', String(!aberto));
    filaEl.classList.toggle('away', aberto);
    filaEl.setAttribute('aria-hidden', String(aberto));
    document.body.classList.toggle('lv-com-cliente', aberto);
  }
  NGFicha.aoFechar(() => { setTimeout(() => { render(); carregar(false); }, 0); });
  NGFicha.aoMudar(() => { carregar(); });

  // ---------- cliques ----------
  filaEl.addEventListener('click', (ev) => {
    const q = (s) => ev.target.closest(s);
    let b;
    if ((b = q('[data-vista]'))) { trocarVista(b.dataset.vista); return; }
    if ((b = q('[data-ac]'))) { agir(b); return; }
    if ((b = q('[data-adiar]'))) { adiar(b.dataset.adiar); return; }
    if ((b = q('[data-saida]'))) { saida(b.dataset.saida); return; }
    if ((b = q('[data-foco]'))) { foco = b.dataset.foco; render(); corpo.scrollTop = 0; return; }
    if ((b = q('[data-abrir]'))) { abrirChave(b.dataset.abrir); return; }
    if ((b = q('[data-rf-soprar]'))) { rfAberto = `soprar:${b.dataset.rfSoprar}`; render(); const el = document.getElementById(`rf-txt-${b.dataset.rfSoprar}`); if (el) el.focus(); return; }
    if ((b = q('[data-rf-enviar]'))) { soprar(b.dataset.rfEnviar, b); return; }
    if ((b = q('[data-rf-assumir]'))) { assumirReforco(b.dataset.rfAssumir, b); return; }
    if ((b = q('[data-rf-ver]'))) { abrirChave(`c:${b.dataset.rfVer}`); return; }
    if ((b = q('[data-rf-nao]'))) { rfAberto = `nao:${b.dataset.rfNao}`; render(); return; }
    if ((b = q('[data-rf-motivo]'))) { b.disabled = true; agoraNao(b.dataset.rfMotivo, b.dataset.m); return; }
    if (q('[data-rf-x]')) { rfAberto = null; render(); }
  });
  movel.addEventListener('change', () => { modoFicha(); render(); });
  window.addEventListener('hashchange', () => setTimeout(sincCliente, 0));
  window.addEventListener('popstate', () => setTimeout(sincCliente, 0));

  NG.botaoAtualizar(() => carregar());
  modoFicha();
  NGFicha.iniciar();
  sincCliente();
  await carregar(false);
  conferirCobertura();
  // a cada minuto: refaz a fila se o banco mudou (ou a cada 2 min, pelos prazos); a cada 5 min: confere a cobertura.
  // Com a caixa de Soprar aberta a lista não é redesenhada por baixo do texto (o render guarda o que foi digitado).
  let tiques = 0;
  setInterval(async () => {
    if (document.visibilityState !== 'visible') return;
    tiques += 1;
    if (await NG.mudou('live2', 2 * 60000)) { await carregar(false); if (NGFicha.atual) NGFicha.recarregar({ quieto: true }); }
    if (tiques % 5 === 0) conferirCobertura();
  }, 60000);
  document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && await NG.mudou('live2', 2 * 60000)) carregar(false); });
})();
</script>
</body>
</html>
