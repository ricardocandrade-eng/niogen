<body class="tela-pulso">
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="pulso"></nav>
  <main class="main pa-main">
    <header class="cab">
      <div>
        <h1>Pulso</h1>
        <div class="sub">Os quatro elos da operação — e onde parou.</div>
      </div>
    </header>
    <div id="pulso-aba" class="pa" hidden></div>
  </main>
</div>
<script>
(async function () {
  const eu = await NG.exigirLogin();
  const alvo = document.getElementById('pulso-aba');
  if (!['admin', 'backoffice'].includes(eu.perfil)) {
    NGSidebar.montar();
    alvo.hidden = false;
    alvo.innerHTML = '<div class="vazio">O Pulso é do backoffice.</div>';
    return;
  }
  document.body.dataset.pulso = '1';   // a RPC do Pulso também pinta os selos do menu (o menu não chama a sua)
  NGPulso.montarAba(alvo);
  NGSidebar.montar();
})();
</script>
</body>
