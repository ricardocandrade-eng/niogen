<!doctype html>
<!-- NIOGEN | docs/vendas.html | 22/11/2026 — Claude Code (Fable 5.2)
     "Vendas" (antes "Quadro de vendas" / "Funil de vendas"). Ricardo, 22/11: "A Nio considera venda tudo que teve OS gerada" e
     "A lista deve ficar em ordem cronológica, independente do status. Os filtros que podem ser aplicados para localizar."
     O que a tela é: SÓ venda com OS gerada, em uma lista só, da OS mais recente para a mais antiga. Foco nos dados da venda:
     quando a OS saiu, cliente, plano e forma de pagamento, vendedor e origem, nº da OS, status e a comissão da Nio
     (Prevista · Confirmada no OSAB · Paga · Sem comissão). A coluna Adimplência está reservada (a tela ainda não existe).
     Saíram daqui: a vista Quadro, as abas por etapa do funil, o ritmo da meta em barra, as 4 caixas em R$, a faixa do gargalo e a
     Saída por motivo. Quem ainda não tem OS está em Leads (leads.html) — o botão "+ Nova venda" foi para lá.
     Números do topo em faixa fina de uma linha (Ricardo: "menores e mais discretos, para ter ganho de registros nas telas").
     Dados, numa rodada só: assets/vendasos.js (v_vendas com OS + v_os_andamento + config_planos) + painel_meta_ritmo. Só leitura.
     Clique na linha abre a ficha única em tela cheia (#venda=<id>). Vendedor vê só as vendas dele (RLS).
     Desenho aprovado: docs/LAYOUT_sete_telas_especificacao_221126_1510.md (Drive). --><html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Vendas · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icones/niogen_apple_180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=221126-3">
<link rel="stylesheet" href="assets/listas.css?v=231126-1">
<script>
  // Links antigos: "+ Nova venda" (#nova, #venda-rua, ?cep=) agora abre em Leads.
  (function () {
    var q = new URLSearchParams(location.search);
    if (['#nova', '#venda-rua'].includes(location.hash) || q.get('cep')) { location.replace('leads.html' + location.search + (location.hash || '#nova')); return; }
    // Links antigos do funil que morava aqui (vista Quadro, etapa, parada, abas "ação" e "espera"): hoje isso é a tela Leads.
    if (q.get('vista') === 'quadro' || q.get('etapa') || q.get('parada')) location.replace('leads.html?funil=1' + location.hash);
    else if (['acao', 'espera'].includes(q.get('aba'))) location.replace('leads.html?aba=' + q.get('aba') + location.hash);
  })();
</script>
<script src="config.js?v=111126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=251126-18"></script>
<script src="assets/sidebar.js?v=261126-2"></script>
<script src="assets/conversa.js?v=241126-bl3"></script>
<script src="assets/ficha.js?v=251126-2"></script>
<script src="assets/vendasos.js?v=221126-2"></script>
</head>
<body>
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="vendas"></nav>
  <main class="main lista-densa">
    <header class="cab">
      <div>
        <h1>Vendas</h1>
        <div class="sub">Só venda com OS gerada na Nio, da mais recente para a mais antiga. Quem ainda não tem OS está em <a href="leads.html">Leads</a>.</div>
      </div>
      <div class="cab-acoes"><button type="button" class="btn btn-sm btn-ghost" id="exportar">⇩ Exportar</button></div>
    </header>

    <section class="faixa-fina" id="faixa" aria-label="Números do período"></section>
    <div id="abas"></div>

    <div class="barra-filtros">
      <label class="busca"><span aria-hidden="true">⌕</span><input type="search" id="f-busca" aria-label="Buscar venda" placeholder="Buscar por nome, CPF/CNPJ, telefone, nº da OS ou bairro"></label>
      <select class="sel" id="f-vendedor" aria-label="Vendedor"></select>
      <select class="sel" id="f-origem" aria-label="Origem"></select>
      <select class="sel" id="f-comissao" aria-label="Comissão da Nio"></select>
      <span id="f-periodo"></span>
      <button type="button" class="btn btn-sm btn-ghost" id="limpar" hidden>Limpar filtros</button>
    </div>

    <section class="lista padrao" aria-label="Lista de vendas">
      <div class="rolagem">
        <table class="tab">
          <thead><tr>
            <th>OS gerada em</th>
            <th>Cliente</th>
            <th>Plano</th>
            <th>Vendedor</th>
            <th title="De onde veio a venda: Meta Ads, indicação, rua, parceiro PAP, Fila Vero…">Origem</th>
            <th>Nº da OS</th>
            <th>Status</th>
            <th class="num">Comissão da Nio</th>
            <th title="Se o cliente está em dia com a Nio. Chega com a tela Adimplência.">Adimplência</th>
          </tr></thead>
          <tbody id="tbody"><tr><td colspan="8" class="vazio">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="rodape-lista"><span id="contagem"></span><span>Clique na linha para abrir a ficha</span></div>
    </section>
  </main>
</div>

<script>
(async function () {
  const t0 = performance.now();
  const { esc } = NG;
  const V = NGVendasOS;
  await NG.exigirLogin();
  NGSidebar.montar();

  const tbody = document.getElementById('tbody');
  const fBusca = document.getElementById('f-busca');
  const fVendedor = document.getElementById('f-vendedor');
  const fOrigem = document.getElementById('f-origem');
  const fComissao = document.getElementById('f-comissao');
  const btLimpar = document.getElementById('limpar');
  NG.preencherSelect(fComissao, V.COMISSOES, 'Comissão: todas');
  const per = NG.filtroPeriodo(document.getElementById('f-periodo'), { padrao: 'mes', aoMudar: render });
  let d = { vendas: [], os: {}, nomeCurto: {} }, ritmo = null, aba = 'todas';

  const fmtR = (x) => NG.fmtMoeda(x).replace(/,00$/, '');
  const st = (v) => V.statusDe(v, d.os[v.id]);
  const planoCurto = (v) => d.nomeCurto[v.plano_id] || v.plano_nome || '—';
  const local = (v) => [v.bairro, v.cidade].filter(Boolean).join(' · ');
  const hora = (x) => new Date(x).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: NG.TZ });

  // Período (pela data da OS) + busca + vendedor + origem + comissão: a base das pílulas, da faixa e da lista.
  function base() {
    const p = per.valor();
    return d.vendas.filter((v) => NG.noPeriodo(V.dataOS(v), p)
      && V.casaBusca(v, fBusca.value)
      && (!fVendedor.value || v.vendedor_id === fVendedor.value)
      && (!fOrigem.value || v.origem === fOrigem.value)
      && (!fComissao.value || V.comissaoDe(v, st(v)).id === fComissao.value));
  }
  const filtradas = () => base().filter((v) => aba === 'todas' || st(v) === aba);

  // O que o status quer dizer nesta venda, numa linha.
  function statusNota(v, s) {
    const o = d.os[v.id];
    const dia = V.diaInstalacao(v, o);
    if (s === 'instalada') return v.instalado_em ? `em ${NG.fmtData(v.instalado_em)}` : '';
    if (s === 'cancelada') return (o && o.motivo_cancelamento) || v.cancelada_apos_instalar_motivo || v.motivo_saida || '';
    if (s === 'pendencia') return V.pendenciaTxt(v, o);
    if (s === 'semdata') return 'falta agendar a instalação';
    if (dia) return `instala ${NG.fmtDiaISO(dia).slice(0, 5)} · ${V.turno(v, o)}`;
    return '';
  }

  function renderFaixa(b) {
    const com = b.map((v) => V.comissaoDe(v, st(v)));
    const soma = (id) => com.filter((c) => c.id === id).reduce((s, c) => s + (c.valor || 0), 0);
    const inst = b.filter((v) => st(v) === 'instalada').length;
    const canc = b.filter((v) => st(v) === 'cancelada').length;
    const noMes = per.valor().valor === 'mes';
    // No mês, "Instaladas / meta" é a mesma conta do Painel e da tela Instalações (painel_meta_ritmo: pela data da instalação).
    // Com busca ou filtro ligado, vale a contagem da própria lista, sem a meta.
    const usaRitmo = noMes && ritmo && ritmo.meta && ritmo.instaladas != null && !(fBusca.value || fVendedor.value || fOrigem.value || fComissao.value);
    const nInst = usaRitmo ? ritmo.instaladas : inst;
    const meta = usaRitmo ? ` <small>/ meta ${NG.fmtNum(ritmo.meta)}</small>` : '';
    const prev = soma('prevista'), osab = soma('osab'), paga = soma('paga');
    document.getElementById('faixa').innerHTML = [
      `<div><span>Vendas (OS gerada)</span><b>${NG.fmtNum(b.length)}</b><small>${esc(per.rotulo.toLowerCase())}</small></div>`,
      `<div><span>Instaladas</span><b class="ok">${NG.fmtNum(nInst)}</b>${meta}</div>`,
      `<div><span>A instalar</span><b>${NG.fmtNum(b.length - inst - canc)}</b></div>`,
      `<div><span>Canceladas</span><b class="${canc ? 'bad' : ''}">${NG.fmtNum(canc)}</b></div>`,
      `<div title="Valor da tabela de comissões das vendas ainda não confirmadas pelo OSAB."><span>Comissão prevista</span><b>${esc(fmtR(prev))}</b></div>`,
      `<div title="Vendas que o OSAB já confirmou. Falta vir no extrato da Nio."><span>Confirmada no OSAB</span><b>${esc(fmtR(osab))}</b></div>`,
      `<div title="O que já veio no extrato da Nio."><span>Paga</span><b class="${paga ? 'ok' : ''}">${esc(fmtR(paga))}</b></div>`,
    ].join('');
  }

  function render() {
    const b = base();
    renderFaixa(b);
    const conta = (id) => b.filter((v) => st(v) === id).length;
    // "Em campo" só vira pílula quando a Nio informa (há alguma venda nesse status).
    const pils = V.STATUS.filter((s) => s.id !== 'campo' || conta('campo') > 0 || aba === 'campo');
    NG.abasPilulas(document.getElementById('abas'), [{ id: 'todas', nome: 'Todas', n: b.length }, ...pils.map((s) => ({ id: s.id, nome: s.nome, n: conta(s.id) }))], aba, (id) => { aba = id; render(); });
    const lista = b.filter((v) => aba === 'todas' || st(v) === aba);
    tbody.innerHTML = lista.length ? lista.map((v) => {
      const s = st(v), c = V.comissaoDe(v, s), quando = V.dataOS(v), nota = statusNota(v, s);
      return `<tr class="clicavel ${s === 'cancelada' ? 'cancelada' : ''}" data-id="${esc(v.id)}" tabindex="0" title="Abrir a ficha">
        <td class="quando">${esc(NG.fmtData(quando))}<small>${esc(hora(quando))}</small></td>
        <td><b>${esc(v.cliente_nome || '—')}</b><small>${esc(local(v) || '—')}</small></td>
        <td><b>${esc(planoCurto(v))}</b><small>${esc(V.formaTxt(v) || '—')}</small></td>
        <td>${esc(v.vendedor_nome || '—')}</td>
        <td>${esc(NG.origemTxt(v))}</td>
        <td class="os">${esc(v.nio_os)}</td>
        <td>${V.chip(s)}${nota ? `<small>${esc(nota)}</small>` : ''}</td>
        <td class="num" title="${esc(c.dica)}">${c.valor == null ? '—' : esc(fmtR(c.valor))}<small><span class="chip ${c.cls}">${esc(c.txt)}</span></small></td>
        <td class="breve">em breve</td>
      </tr>`;
    }).join('') : `<tr><td colspan="9" class="vazio">${d.vendas.length ? 'Nenhuma venda neste filtro.' : 'Nenhuma venda com OS gerada ainda.'}</td></tr>`;
    document.getElementById('contagem').textContent = `${NG.fmtNum(lista.length)} ${lista.length === 1 ? 'venda' : 'vendas'} · da OS mais recente para a mais antiga`;
    btLimpar.hidden = !(fBusca.value || fVendedor.value || fOrigem.value || fComissao.value || aba !== 'todas');
    if (!window.NGvdTempo && d.vendas.length) window.NGvdTempo = Math.round(performance.now() - t0);   // regra 19: tempo até a lista
  }

  async function carregar() {
    const [dados, rr] = await Promise.all([V.carregar(), NG.sb.rpc('painel_meta_ritmo', { p_hoje: NG.diaSP() })]);
    if (dados.erro) { NG.toast(NG.msgErro(dados.erro), 'bad'); tbody.innerHTML = `<tr><td colspan="8" class="vazio">${esc(NG.msgErro(dados.erro))}</td></tr>`; return; }
    d = dados;
    ritmo = rr && !rr.error ? rr.data : null;
    // Os filtros só oferecem o que existe na lista (vendedores e origens das vendas com OS).
    const guarda = [fVendedor.value, fOrigem.value];
    const vend = [...new Map(d.vendas.filter((v) => v.vendedor_id).map((v) => [v.vendedor_id, v.vendedor_nome || '—'])).entries()].sort((a, b) => a[1].localeCompare(b[1], 'pt-BR'));
    NG.preencherSelect(fVendedor, vend, 'Todos os vendedores');
    NG.preencherSelect(fOrigem, Object.entries(NG.ORIGENS).filter(([k]) => d.vendas.some((v) => v.origem === k)), 'Todas as origens');
    fVendedor.value = guarda[0]; fOrigem.value = guarda[1];
    // 22/11 (Placar): ?vendedor= ?origem= ?q= chegam do Placar e valem só na 1ª carga
    if (!window.NGvdUrl) {
      window.NGvdUrl = true;
      const U = new URLSearchParams(location.search);
      if (U.get('vendedor')) fVendedor.value = U.get('vendedor');
      if (U.get('origem')) fOrigem.value = U.get('origem');
      if (U.get('q')) fBusca.value = U.get('q');
    }
    if (!window.NGvdTempo) window.NGvdTempo = Math.round(performance.now() - t0);
    render();
  }

  [fBusca, fVendedor, fOrigem, fComissao].forEach((el) => el.addEventListener('input', render));
  btLimpar.addEventListener('click', () => { fBusca.value = ''; fVendedor.value = ''; fOrigem.value = ''; fComissao.value = ''; aba = 'todas'; render(); });
  // Linha → ficha única em tela cheia (#venda=<id>); Ctrl/⌘ ou botão do meio → nova aba já com a ficha aberta.
  const abrir = (tr, novaAba) => NG.abrirVenda(tr.dataset.id, novaAba);
  tbody.addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr) abrir(tr, ev.ctrlKey || ev.metaKey); });
  tbody.addEventListener('auxclick', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.button === 1) abrir(tr, true); });
  tbody.addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.key === 'Enter') abrir(tr, false); });

  document.getElementById('exportar').addEventListener('click', () => {
    V.baixarCsv('niogen_vendas', ['OS gerada em', 'Cliente', 'CPF/CNPJ', 'Bairro', 'Cidade', 'Plano', 'Forma de pagamento', 'Vendedor', 'Origem', 'Nº da OS', 'Status', 'Instalação', 'Instalada em', 'Comissão', 'Situação da comissão'],
      filtradas().map((v) => { const s = st(v), c = V.comissaoDe(v, s), o = d.os[v.id], dia = V.diaInstalacao(v, o);
        return [NG.fmtDataHora(V.dataOS(v)), v.cliente_nome, v.cliente_cpf_cnpj, v.bairro, v.cidade, v.plano_nome, V.formaTxt(v), v.vendedor_nome, NG.origemTxt(v), v.nio_os, V.STATUS_POR[s].nome,
          dia ? `${NG.fmtDiaISO(dia)} ${V.turno(v, o)}` : '', v.instalado_em ? NG.fmtData(v.instalado_em) : '', c.valor ?? '', c.txt]; }));
  });

  NG.botaoAtualizar(() => carregar());
  await carregar();
  NGFicha.aoMudar(() => carregar());
  NGFicha.iniciar();
})();
</script>
</body>
