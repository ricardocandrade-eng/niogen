<!doctype html>
<!-- NIOGEN | docs/operacoes.html | 22/11/2026 — Claude Code (Fable 5.2)
     "Instalações" (antes "Operações"; o arquivo segue operacoes.html para não quebrar links e favoritos).
     Ricardo, 22/11: "mesma coisa da tela Quadro de vendas, mas com foco em instalação, motivo reagendamento, status da execução
     do serviço, botão para atualizar buscando no portal" e "A lista deve ficar em ordem cronológica, independente do status."
     O que a tela é: AS MESMAS vendas da tela Vendas (só com OS gerada), NA MESMA ordem (OS mais recente primeiro), com as colunas
     da instalação: data e turno · status da execução com o texto exato da Nio · reagendamento (quantas vezes e o motivo) ·
     se o cliente confirmou · quando foi lido na Nio, com o botão Atualizar na linha. No topo, "Atualizar todas na Nio".
     Reagendamento: sai das leituras da OS (os_leituras) — cada troca de data; o motivo é a pendência que a Nio mostrou na troca.
     Sem pendência, a tela diz "a Nio não informou o motivo" (nunca inventa).
     Saíram daqui: os blocos Hoje/Amanhã/Sem data/Pendências/Biometria/Recém-instaladas em cartões e as 5 caixas do topo
     (viraram faixa fina, pílulas e colunas). Venda sem OS (biometria validada esperando a OS) está em Leads e na Live.
     Dados, numa rodada só: assets/vendasos.js (v_vendas com OS + v_os_andamento + os_leituras + config_planos) +
     v_instalacao_confirmacao + importacoes (último OSAB) + config_regras + painel_meta_ritmo + os_varredura_estado + biometria_radar.
     Não lê mais a jornada (o "o que fazer" de cada venda é da Live). Só leitura: "Atualizar" pede a leitura ao Operador de OS,
     pelas funções que já existiam (NG.osModal · os_varredura_pedir). Vendedor vê só as vendas dele (RLS).
     Desenho aprovado: docs/LAYOUT_sete_telas_especificacao_221126_1510.md (Drive). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Instalações · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=221126-3">
<link rel="stylesheet" href="assets/listas.css?v=221126-1">
<script src="config.js?v=111126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script src="assets/sidebar.js?v=231126-1"></script>

<style>
  /* radar da biometria da Nio (gaveta recolhida no fim da tela) */
  .op-radar-n { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin: 0 0 10px; }
  .op-radar-t { width: 100%; max-width: 640px; border-collapse: collapse; font-size: 12px; }
  .op-radar-t th, .op-radar-t td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--border); }
  .op-radar-t td:nth-child(2) { width: 45%; }
  /* 22/11 (Ricardo: "indicação de que a atualização no Portal está sendo verificada e, se mudar algo, indicar de forma clara, na própria linha") */
  .op-aviso { display: block; margin-top: 4px; font-size: 11.5px; line-height: 1.4; white-space: normal; max-width: 230px; }
  .op-aviso.lendo, .op-aviso.fila { color: var(--info-fg); }
  .op-aviso.igual { color: var(--muted); }
  .op-aviso.mudou { color: var(--ok-fg); font-weight: 600; }
  .op-aviso.erro { color: var(--bad-fg); }
  .op-gira { display: inline-block; animation: op-gira 1.1s linear infinite; }
  @keyframes op-gira { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .op-gira { animation: none; } }
  .lista-densa .tab tr.op-mudou td { background: rgba(50, 224, 0, .06); }
  .lista-densa .tab tr.op-mudou td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .op-mudou-chip { display: block; margin-top: 4px; padding: 4px 8px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-fg); font-size: 11.5px; line-height: 1.4; max-width: 300px; white-space: normal; }
  .op-barra { display: inline-block; height: 8px; border-radius: 4px; background: var(--accent); vertical-align: middle; margin-right: 6px; min-width: 2px; }
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="operacoes"></nav>
  <main class="main lista-densa">
    <header class="cab">
      <div>
        <h1>Instalações</h1>
        <div class="sub">As mesmas vendas da tela <a href="vendas.html">Vendas</a>, na mesma ordem, com o que a Nio diz da instalação de cada uma.</div>
      </div>
      <div class="cab-acoes" id="cab-acoes"></div>
    </header>

    <section class="faixa-fina" id="faixa" aria-label="Números das instalações"></section>
    <div id="abas"></div>

    <div class="barra-filtros">
      <label class="busca"><span aria-hidden="true">⌕</span><input type="search" id="f-busca" aria-label="Buscar venda" placeholder="Buscar por nome, telefone, nº da OS ou bairro"></label>
      <select class="sel" id="f-reag" aria-label="Reagendamento"></select>
      <select class="sel" id="f-conf" aria-label="Cliente confirmou"></select>
      <span id="f-periodo"></span>
      <button type="button" class="btn btn-sm btn-ghost" id="limpar" hidden>Limpar filtros</button>
      <div class="dir"><span class="acoes-topo" id="varrer-area"></span></div>
    </div>

    <section class="lista padrao" aria-label="Lista de instalações">
      <div class="rolagem">
        <table class="tab">
          <thead><tr>
            <th>Instalação</th>
            <th>Cliente</th>
            <th>Status da execução</th>
            <th title="Quantas vezes a Nio trocou a data da instalação e o motivo que ela mostrou.">Reagendamento</th>
            <th title="Resposta do cliente ao lembrete da véspera.">Cliente confirmou</th>
            <th title="Quando o Operador de OS leu esta OS no portal da Nio pela última vez.">Lido na Nio</th>
          </tr></thead>
          <tbody id="tbody"><tr><td colspan="6" class="vazio">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="rodape-lista"><span id="contagem"></span><span>Clique na linha para abrir a ficha</span></div>
    </section>
    <div id="radar"></div>
  </main>
</div>
<script>
(async function () {
  const t0 = performance.now();
  const { esc } = NG;
  const A = NG.ajuda;
  const V = NGVendasOS;
  const eu = await NG.exigirLogin();
  const BO = ['admin', 'backoffice'].includes(eu.perfil);
  NGSidebar.montar();
  document.getElementById('cab-acoes').innerHTML = `<span class="osab-aviso" id="osab-aviso"></span><button type="button" class="btn btn-sm btn-ghost" id="csv">⇩ Exportar</button>${BO ? '<a class="btn btn-sm" href="configuracoes.html">⇪ Importar OSAB</a>' : ''}`;

  const tbody = document.getElementById('tbody');
  const fBusca = document.getElementById('f-busca');
  const fReag = document.getElementById('f-reag');
  const fConf = document.getElementById('f-conf');
  const btLimpar = document.getElementById('limpar');
  NG.preencherSelect(fReag, [['sim', 'Com reagendamento'], ['nao', 'Sem reagendamento']], 'Reagendamento: todos');
  NG.preencherSelect(fConf, [['confirmou', 'Confirmou'], ['remarcar', 'Pediu para remarcar'], ['nada', 'Não respondeu']], 'Cliente: todos');
  const per = NG.filtroPeriodo(document.getElementById('f-periodo'), { padrao: 'mes', aoMudar: render });
  let d = { vendas: [], os: {}, leituras: {}, nomeCurto: {} }, conf = {}, regras = {}, ritmo = null, osabEm = null, varr = null, radar = null, lendo = {}, reag = {}, aba = 'todas';
  // 22/11 (Ricardo): o que a consulta ao Portal fez em cada linha, enquanto a tela está aberta. Só exibição, nada é gravado aqui.
  //   aviso[id] = { tipo: 'lendo' | 'fila' | 'igual' | 'mudou' | 'erro', txt, em }
  //   foto[id]  = como a OS estava antes da consulta (para dizer O QUE mudou)
  let aviso = {}, foto = {}, varrDesde = null;

  const hoje = () => NG.diaSP();
  const amanha = () => NG.somaDias(NG.diaSP(), 1);
  const nv = (n, um, varios) => `${NG.fmtNum(n)} ${n === 1 ? um : varios}`;
  const hm = (x) => (x ? new Date(x).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: NG.TZ }) : '');
  const dm = (iso) => NG.fmtDiaISO(iso).slice(0, 5);
  const os = (v) => d.os[v.id];
  const st = (v) => V.statusDe(v, os(v));
  const dia = (v) => V.diaInstalacao(v, os(v));
  const aberta = (v) => !['instalada', 'cancelada'].includes(st(v));
  const local = (v) => [v.bairro, v.cidade].filter(Boolean).join(' · ');
  const respDe = (v) => (conf[v.id] || {}).resposta || 'nada';
  // "Atualizar" na linha: só o backoffice, só OS em andamento com número (a regra que o Operador de OS já tinha).
  const podeLer = (v) => BO && !V.instalada(v) && ['1_vendido', '2_aguardando_instalacao'].includes(v.status) && /\d{8}/.test(String(v.nio_os || v.nio_pedido || ''));

  // As pílulas: Hoje e Amanhã (pela data da instalação) + os mesmos status da tela Vendas.
  const naAba = (v, a) => (a === 'todas' ? true : a === 'hoje' ? aberta(v) && dia(v) === hoje() : a === 'amanha' ? aberta(v) && dia(v) === amanha() : st(v) === a);
  function base() {
    const p = per.valor();
    return d.vendas.filter((v) => NG.noPeriodo(V.dataOS(v), p)
      && V.casaBusca(v, fBusca.value)
      && (!fReag.value || (fReag.value === 'sim') === !!(reag[v.id] || []).length)
      && (!fConf.value || (aberta(v) && dia(v) && respDe(v) === fConf.value)));
  }
  const filtradas = () => base().filter((v) => naAba(v, aba));

  // ---------- colunas ----------
  function colInstalacao(v, s) {
    const dd = dia(v);
    if (s === 'instalada') return `<b>${esc(v.instalado_em ? NG.fmtData(v.instalado_em) : dd ? NG.fmtDiaISO(dd) : '—')}</b><small>instalada</small>`;
    if (!dd) return `<b>—</b><small>${s === 'cancelada' ? 'cancelada' : 'sem data'}</small>`;
    const rel = dd === hoje() ? 'hoje' : dd === amanha() ? 'amanhã' : NG.fmtDiaSemana(`${dd}T12:00:00-03:00`).toLowerCase();
    return `<b>${esc(NG.fmtDiaISO(dd))}</b><small>${esc([rel, V.turno(v, os(v))].filter(Boolean).join(' · '))}</small>`;
  }
  // ---------- 22/11: o que mudou na Nio entre a foto de antes e a leitura de agora ----------
  const CAMPOS_OS = ['estado', 'status_ordem', 'status_agendamento', 'agendamento_data', 'janela', 'pendencia'];
  const fotoDe = (v) => { const o = os(v) || {}; return { ...Object.fromEntries(CAMPOS_OS.map((k) => [k, o[k] || ''])), ref: o.referencia_em || o.mudou_em || '' }; };
  function diferenca(a, b) {
    const p = [];
    if (a.agendamento_data !== b.agendamento_data) p.push(`data ${a.agendamento_data ? dm(a.agendamento_data) : 'sem data'} → ${b.agendamento_data ? dm(b.agendamento_data) : 'sem data'}`);
    if (a.janela !== b.janela && b.janela) p.push(`turno ${b.janela}`);
    if (a.status_ordem !== b.status_ordem) p.push(`status ${a.status_ordem || '—'} → ${b.status_ordem || '—'}`);
    if (a.status_agendamento !== b.status_agendamento) p.push(`agendamento ${a.status_agendamento || '—'} → ${b.status_agendamento || '—'}`);
    if (a.pendencia !== b.pendencia) p.push(b.pendencia ? `pendência: ${b.pendencia}` : 'a pendência saiu');
    if (!p.length && a.estado !== b.estado) p.push('o estado da OS mudou');
    return p.join(' · ');
  }
  const agoraHm = () => hm(new Date());
  function colStatus(v, s) {
    const o = os(v);
    const nio = V.textoNio(o);
    const extra = s === 'pendencia' ? V.pendenciaTxt(v, o) : s === 'cancelada' ? ((o && o.motivo_cancelamento) || v.cancelada_apos_instalar_motivo || v.motivo_saida || '') : '';
    const bio = aberta(v) && ['pendente', 'com_risco'].includes(v.biometria_status) ? 'biometria pendente' : '';
    return `${V.chip(s)}${bio ? ` <span class="chip warn" title="O cliente ainda não fez a biometria da Nio.">${bio}</span>` : ''}
      <small class="nio-txt" title="O texto que a Nio mostra na OS (status da ordem · situação do agendamento)">${nio ? `Nio: ${esc(nio)}` : 'OS ainda não lida na Nio'}</small>${extra ? `<small class="nio-txt">${esc(extra)}</small>` : ''}${(aviso[v.id] || {}).tipo === 'mudou' ? `<span class="op-mudou-chip" role="status"><b>● Mudou na Nio às ${esc(aviso[v.id].em)}</b><br>${esc(aviso[v.id].txt)}</span>` : ''}`;
  }
  function colReag(v) {
    const r = reag[v.id] || [];
    if (!r.length) return '<span class="apagado">—</span>';
    return `<b>${r.length}×</b>${r.map((x) => `<small class="${x.motivo ? '' : 'semmotivo'}">${esc(dm(x.de))} → ${esc(dm(x.para))} · ${esc(x.motivo || 'a Nio não informou o motivo')}</small>`).join('')}`;
  }
  function colConf(v, s) {
    if (!aberta(v) || !dia(v)) return '<span class="apagado">—</span>';
    const c = conf[v.id] || {};
    if (c.resposta === 'confirmou') return `<span class="chip ok" title="${esc(`“${c.resposta_texto || 'Tudo certo'}” ${NG.fmtDataHora(c.resposta_em)}`)}">✓ confirmou</span>`;
    if (c.resposta === 'remarcar') return `<span class="chip bad" title="${esc(`“${c.resposta_texto || 'Preciso remarcar'}” ${NG.fmtDataHora(c.resposta_em)}`)}">pediu para remarcar</span>`;
    return c.lembrete_em ? `<span class="chip warn" title="${esc(`Lembrete enviado ${NG.fmtDataHora(c.lembrete_em)}; o cliente ainda não respondeu.`)}">não respondeu</span>`
      : '<span class="apagado" title="O lembrete da véspera ainda não saiu.">lembrete não saiu</span>';
  }
  function colLido(v) {
    const o = os(v);
    const quando = o && (o.referencia_em || o.mudou_em);
    const txt = quando ? `${esc(NG.fmtData(quando))} <small style="display:inline">${esc(hm(quando))}</small>` : '<span class="apagado">nunca</span>';
    const a = aviso[v.id];
    const ocupado = lendo[v.id] || (a && a.tipo === 'fila');
    const bt = podeLer(v) ? `<br><button type="button" class="btn-linha" data-os-ler="${esc(v.id)}" ${ocupado ? 'disabled' : ''} title="${esc(A.ops_os_agora)}">⟳ Atualizar</button>` : '';
    // O aviso da consulta ao Portal, na própria linha: consultando · na fila · sem mudança · mudou · não deu
    const av = !a ? '' : a.tipo === 'lendo' ? '<span class="op-aviso lendo" role="status"><span class="op-gira" aria-hidden="true">⟳</span> Consultando o Portal da Nio… leva uns 15 segundos</span>'
      : a.tipo === 'fila' ? '<span class="op-aviso fila" role="status"><span class="op-gira" aria-hidden="true">⟳</span> Na fila: o Portal está sendo consultado, OS por OS</span>'
        : a.tipo === 'igual' ? `<span class="op-aviso igual" role="status">✓ Conferida às ${esc(a.em)}: nada mudou</span>`
          : a.tipo === 'mudou' ? `<span class="op-aviso mudou" role="status">● Mudou às ${esc(a.em)}: veja o status</span>`
            : `<span class="op-aviso erro" role="status">⚠ ${esc(a.txt)}</span>`;
    return `<span title="${quando ? esc(`Lido por ${o.origem_ultima === 'osab' ? 'OSAB' : 'Operador de OS'}; última mudança ${NG.fmtDataHora(o.mudou_em)}`) : ''}">${txt}</span>${bt}${av}`;
  }

  function renderFaixa(b) {
    const ab = b.filter(aberta);
    const nHoje = ab.filter((v) => dia(v) === hoje()).length, nAm = ab.filter((v) => dia(v) === amanha()).length;
    const nSem = b.filter((v) => st(v) === 'semdata').length, nPend = b.filter((v) => st(v) === 'pendencia').length;
    const inst = b.filter((v) => st(v) === 'instalada' && v.instalado_em);
    const prazos = inst.map((v) => { const x = V.dataOS(v); return x ? (new Date(v.instalado_em) - new Date(x)) / 86400000 : null; }).filter((x) => x != null && x >= 0);
    const media = prazos.length ? prazos.reduce((s, x) => s + x, 0) / prazos.length : null;
    const lidas = inst.filter((v) => os(v) && os(v).agendamentos >= 1), prim = lidas.filter((v) => !(reag[v.id] || []).length && os(v).agendamentos === 1);
    const m = ritmo || {};
    const noMes = per.valor().valor === 'mes';
    document.getElementById('faixa').innerHTML = [
      `<div title="${esc(A.ops_hoje_num || '')}"><span>Instalam hoje</span><b class="${nHoje ? 'ok' : ''}">${NG.fmtNum(nHoje)}</b></div>`,
      `<div><span>Amanhã</span><b>${NG.fmtNum(nAm)}</b></div>`,
      `<div title="OS aberta sem data de instalação."><span>Sem data</span><b class="${nSem ? 'warn' : ''}">${NG.fmtNum(nSem)}</b></div>`,
      `<div title="A Nio mostra pendência, a venda está em espera ou a data passou sem baixa."><span>Pendência</span><b class="${nPend ? 'bad' : ''}">${NG.fmtNum(nPend)}</b></div>`,
      `<div title="${esc(A.ops_meta || '')}"><span>Instaladas</span><b class="ok">${NG.fmtNum(noMes && m.instaladas != null ? m.instaladas : inst.length)}</b>${noMes && m.meta ? `<small>/ meta ${NG.fmtNum(m.meta)}</small>` : `<small>${esc(per.rotulo.toLowerCase())}</small>`}</div>`,
      `<div title="${esc(A.ops_prazo || '')}"><span>Da OS à instalação</span><b>${media == null ? '—' : esc(media.toFixed(1).replace('.', ','))}</b><small>${media == null ? '' : 'dias'}</small></div>`,
      `<div title="${esc(A.ops_primeira || '')}"><span>Na 1ª data</span><b>${lidas.length ? `${Math.round((100 * prim.length) / lidas.length)}%` : '—'}</b><small>${lidas.length ? `${prim.length} de ${lidas.length}` : ''}</small></div>`,
    ].join('');
  }

  // "Atualizar todas na Nio" (varredura do Operador de OS). A trava é do banco (uma por vez + intervalo): aqui só se mostra o porquê.
  function renderVarrer() {
    const el = document.getElementById('varrer-area');
    if (!BO || !varr) { el.innerHTML = ''; return; }
    const u = varr.ultima;
    const ult = u ? `última ${hm(u.terminada_em)}: ${u.estado === 'falhou' ? 'não terminou' : `${NG.fmtNum(u.lidas || 0)} de ${NG.fmtNum(u.na_fila || 0)} lidas · ${NG.fmtNum(u.mudaram || 0)} com mudança${u.erros ? ` · ${u.erros} com erro` : ''}`}` : '';
    let rot = `⟳ Atualizar todas na Nio${varr.abertas ? ` (${NG.fmtNum(varr.abertas)})` : ''}`, nota = ult; const off = !varr.pode;
    if (varr.motivo === 'em_andamento') { const a = varr.andamento || {}; rot = 'lendo as OS na Nio…'; nota = `pedida por ${a.por || 'alguém'} às ${hm(a.pedida_em)} · ~12 s por OS`; }
    else if (varr.motivo === 'intervalo') nota = `${ult ? ult + ' · ' : ''}libera às ${hm(varr.libera_em)}`;
    else if (varr.motivo === 'sem_os') nota = 'nenhuma OS aberta para ler';
    el.innerHTML = `${nota ? `<small>${esc(nota)}</small>` : ''}<button type="button" class="btn btn-sm ${off ? 'btn-ghost' : 'btn-acc'}" id="varrer" ${off ? 'disabled' : ''} title="${esc(A.ops_varrer)}">${esc(rot)}</button>`;
  }

  function render() {
    const b = base();
    renderFaixa(b);
    renderVarrer();
    const conta = (a) => b.filter((v) => naAba(v, a)).length;
    const pils = V.STATUS.filter((s) => s.id !== 'campo' || conta('campo') > 0 || aba === 'campo');
    NG.abasPilulas(document.getElementById('abas'), [{ id: 'todas', nome: 'Todas', n: b.length }, { id: 'hoje', nome: 'Hoje', n: conta('hoje') }, { id: 'amanha', nome: 'Amanhã', n: conta('amanha') },
      ...pils.map((s) => ({ id: s.id, nome: s.nome, n: conta(s.id) }))], aba, (id) => { aba = id; render(); });
    const lista = b.filter((v) => naAba(v, aba));
    tbody.innerHTML = lista.length ? lista.map((v) => {
      const s = st(v);
      return `<tr class="clicavel ${s === 'cancelada' ? 'cancelada' : ''}${(aviso[v.id] || {}).tipo === 'mudou' ? ' op-mudou' : ''}" data-id="${esc(v.id)}" tabindex="0" title="Abrir a ficha">
        <td class="quando">${colInstalacao(v, s)}</td>
        <td><b>${esc(v.cliente_nome || '—')}</b><small>${esc(local(v) || '—')}</small><small class="mono">OS ${esc(v.nio_os)} · ${esc(NG.fmtData(V.dataOS(v)))}</small></td>
        <td>${colStatus(v, s)}</td>
        <td class="reag">${colReag(v)}</td>
        <td>${colConf(v, s)}</td>
        <td class="lido">${colLido(v)}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="6" class="vazio">${d.vendas.length ? 'Nenhuma venda neste filtro.' : 'Nenhuma venda com OS gerada ainda.'}</td></tr>`;
    document.getElementById('contagem').textContent = `${nv(lista.length, 'venda', 'vendas')} · da OS mais recente para a mais antiga`;
    btLimpar.hidden = !(fBusca.value || fReag.value || fConf.value || aba !== 'todas');
    if (!window.NGopTempo && d.vendas.length) { window.NGopTempo = Math.round(performance.now() - t0); window.NGopDesdeAbrir = Math.round(performance.now()); }   // regra 19: tempo até a lista
  }

  function renderOsab() {
    const el = document.getElementById('osab-aviso');
    const al = Number(regras.osab_alerta_horas ?? 24), cr = Number(regras.osab_critico_horas ?? 48);
    if (!osabEm) { el.className = 'osab-aviso bad'; el.textContent = '⚠ OSAB nunca importado'; el.title = 'A comissão só conta quando o OSAB confirma a instalação.'; return; }
    const h = (Date.now() - new Date(osabEm)) / 3600000;
    el.className = `osab-aviso ${h > cr ? 'bad' : h > al ? 'warn' : 'ok'}`;
    el.textContent = `${h > al ? '⚠ ' : ''}OSAB lido há ${h < 48 ? `${Math.floor(h)} h` : `${Math.floor(h / 24)} dias`}`;
    el.title = `Última importação do OSAB: ${NG.fmtDataHora(osabEm)}. A comissão só conta quando o OSAB confirma a instalação.`;
  }
  // Biometria da Nio: os números do gargalo (o alarme de "fora do ar" foi desligado em 18/11 — 0301). Gaveta recolhida.
  function renderRadar() {
    const el = document.getElementById('radar');
    if (!radar) { el.innerHTML = ''; return; }
    const n = (x) => NG.fmtNum(Number(x || 0));
    const dias = (radar.por_dia || []).slice(-10);
    const max = Math.max(1, ...dias.map((x) => Number(x.enviadas || 0)));
    const linha = (x) => `<tr><td>${esc(dm(x.dia))}</td><td><span class="op-barra" style="width:${Math.round((Number(x.enviadas) / max) * 100)}%"></span> ${n(x.enviadas)}</td><td>${n(x.aprovadas)}</td><td>${n(x.expiradas)}</td><td>${n(x.so_link)}</td></tr>`;
    el.innerHTML = `<details class="gaveta"><summary>Biometria da Nio · ${n(radar.paradas)} ${Number(radar.paradas) === 1 ? 'venda esperando' : 'vendas esperando'}${radar.paradas_24h ? ` · ${n(radar.paradas_24h)} há mais de 24 h` : ''}</summary>
      <div class="op-radar-n"><span>OS → biometria aprovada: <b>${radar.mediana_os_bio_h != null ? `${esc(String(radar.mediana_os_bio_h).replace('.', ','))} h` : '—'}</b> (mediana, 30 dias, ${n(radar.medidas)} vendas)</span>
        <span>Dispensadas pela Nio (30 dias): <b>${n(radar.dispensadas_30d)}</b></span></div>
      ${dias.length ? `<table class="op-radar-t"><thead><tr><th>Dia</th><th>Links enviados (PDV)</th><th>Aprovadas</th><th>Expiradas</th><th>Só link</th></tr></thead><tbody>${dias.map(linha).join('')}</tbody></table>` : ''}</details>`;
  }

  async function carregar() {
    const [dados, rk, ri, rg, rr, rs, rb] = await Promise.all([
      V.carregar({ leituras: true }),
      NG.sb.from('v_instalacao_confirmacao').select('venda_id, resposta, resposta_em, resposta_texto, lembrete_em'),
      NG.sb.from('importacoes').select('aplicado_em').eq('tipo', 'osab').not('aplicado_em', 'is', null).order('aplicado_em', { ascending: false }).limit(1),
      NG.sb.from('config_regras').select('chave, valor'),
      NG.sb.rpc('painel_meta_ritmo', { p_hoje: NG.diaSP() }),
      BO ? NG.sb.rpc('os_varredura_estado') : null,
      BO ? NG.sb.rpc('biometria_radar') : null,
    ]);
    if (dados.erro) { tbody.innerHTML = `<tr><td colspan="6" class="vazio">${esc(NG.msgErro(dados.erro))}</td></tr>`; NG.toast(NG.msgErro(dados.erro), 'bad'); return; }
    d = dados;
    reag = Object.fromEntries(d.vendas.map((v) => [v.id, V.reagendamentos(d.leituras[v.id])]));
    conf = Object.fromEntries(((rk && !rk.error && rk.data) || []).map((x) => [x.venda_id, x]));
    osabEm = ((ri && ri.data) || [])[0] ? ri.data[0].aplicado_em : null;
    regras = Object.fromEntries(((rg && rg.data) || []).map((x) => [x.chave, x.valor]));
    ritmo = rr && !rr.error ? rr.data : null;
    varr = rs && !rs.error ? rs.data : null;
    radar = rb && !rb.error ? rb.data : null;
    vigiarVarredura();
    conferirVarredura();
    renderOsab();
    renderRadar();
    if (!window.NGopTempo) { window.NGopTempo = Math.round(performance.now() - t0); window.NGopDesdeAbrir = Math.round(performance.now()); }
    render();
  }

  // ---------- Atualizar: uma OS (na linha) e todas (no topo) ----------
  // 22/11 (Ricardo): a consulta de UMA OS não abre mais janela — a linha diz "Consultando o Portal…" e, no fim, o que mudou
  // (ou que nada mudou). A leitura é a mesma de antes (NG.osConsultar → Operador de OS); quem grava é o banco.
  async function lerOs(id) {
    if (lendo[id]) return;
    const v = d.vendas.find((x) => x.id === id);
    if (!v) return;
    lendo[id] = true;
    const antes = fotoDe(v);
    aviso[id] = { tipo: 'lendo' };
    render();
    let s = null, erro = '';
    try { s = await NG.osConsultar(id); } catch (e) { erro = e.naoInstalado ? 'Operador fora do ar: consulte direto no portal.' : NG.msgErro(e); }
    delete lendo[id];
    if (erro || !s || s.resultado !== 'lida') {
      aviso[id] = { tipo: 'erro', txt: erro || NG.osResumo(s).txt, em: agoraHm() };
      render();
      return;
    }
    NG.limparCache();
    await carregar();   // a leitura nova pode trazer data, status ou pendência: a lista inteira é refeita
    const v2 = d.vendas.find((x) => x.id === id);
    const g = s.registro || {};
    const dif = v2 ? diferenca(antes, fotoDe(v2)) : '';
    if (g.ok === false) aviso[id] = { tipo: 'erro', txt: g.erro || 'A leitura não foi gravada.', em: agoraHm() };
    else if (dif || g.mudou === true) aviso[id] = { tipo: 'mudou', txt: [dif || g.efeito || 'a OS mudou na Nio', g.excecao && g.acao ? `O que fazer: ${g.acao}` : ''].filter(Boolean).join(' · '), em: agoraHm() };
    else aviso[id] = { tipo: 'igual', em: agoraHm() };
    render();
  }
  // "Atualizar todas": enquanto o Operador lê, cada OS aberta mostra "Na fila"; lida, a linha troca para "nada mudou" ou "mudou".
  // Sabe-se que uma OS foi lida quando o "Lido na Nio" dela passa do horário em que a leitura foi pedida.
  function conferirVarredura() {
    const rodando = !!(varr && varr.motivo === 'em_andamento');
    if (rodando && !varrDesde) {
      varrDesde = (varr.andamento && varr.andamento.pedida_em) || new Date().toISOString();
      d.vendas.filter(podeLer).forEach((v) => { if (!lendo[v.id]) { foto[v.id] = fotoDe(v); aviso[v.id] = { tipo: 'fila' }; } });
    }
    if (!varrDesde) return;
    d.vendas.forEach((v) => {
      const a = aviso[v.id];
      if (!a || a.tipo !== 'fila') return;
      const agora = fotoDe(v);
      if (agora.ref && new Date(agora.ref) > new Date(varrDesde)) {
        const dif = diferenca(foto[v.id] || agora, agora);
        aviso[v.id] = dif ? { tipo: 'mudou', txt: dif, em: hm(agora.ref) } : { tipo: 'igual', em: hm(agora.ref) };
      } else if (!rodando) delete aviso[v.id];   // a leitura acabou e esta OS não foi lida: o aviso sai (o total fica no topo)
    });
    if (!rodando) varrDesde = null;
  }
  let vigia = null;
  function vigiarVarredura() {   // só pergunta ao banco enquanto há varredura rodando; terminou, para
    const rodando = !!(varr && varr.motivo === 'em_andamento');
    if (rodando && !vigia) {
      vigia = setInterval(async () => {
        if (document.hidden) return;
        const { data, error } = await NG.sb.rpc('os_varredura_estado');
        if (error || !data) return;
        const acabou = data.motivo !== 'em_andamento';
        varr = data;
        // 22/11: a lista é relida a cada volta (só enquanto a leitura roda) para a linha de cada OS mostrar que já foi conferida
        NG.limparCache(); await carregar();
        if (acabou) { clearInterval(vigia); vigia = null; const u = data.ultima || {}; NG.toast(u.estado === 'falhou' ? 'A leitura não terminou. Veja o pulso do Operador de OS.' : `Pronto: ${u.lidas || 0} de ${u.na_fila || 0} OS lidas na Nio, ${u.mudaram || 0} com mudança.`, u.estado === 'falhou' ? 'bad' : 'ok'); }
      }, 10000);
    } else if (!rodando && vigia) { clearInterval(vigia); vigia = null; }
  }
  async function varrer(botao) {
    botao.disabled = true;
    const { data, error } = await NG.sb.rpc('os_varredura_pedir');
    if (error) { NG.toast(NG.msgErro(error), 'bad'); botao.disabled = false; return; }
    varr = data;
    if (data.ok) NG.toast(`Pedido feito: o Operador de OS começa em até 1 minuto (${data.abertas || 0} OS, ~12 s cada).`, 'ok');
    else NG.toast(data.motivo === 'em_andamento' ? 'Já há uma leitura de todas as OS em andamento.' : data.motivo === 'intervalo' ? `Leitura feita há pouco. Libera às ${hm(data.libera_em)}.` : 'Nenhuma OS aberta para ler.', 'bad');
    vigiarVarredura();
    conferirVarredura();
    render();
  }

  // ---------- cliques ----------
  document.getElementById('varrer-area').addEventListener('click', (ev) => { const b = ev.target.closest('#varrer'); if (b && !b.disabled) varrer(b); });
  const abrir = (tr, novaAba) => NG.abrirVenda(tr.dataset.id, novaAba);
  tbody.addEventListener('click', (ev) => {
    const o = ev.target.closest('[data-os-ler]');
    if (o) { ev.stopPropagation(); lerOs(o.dataset.osLer); return; }
    const tr = ev.target.closest('tr[data-id]'); if (tr) abrir(tr, ev.ctrlKey || ev.metaKey);
  });
  tbody.addEventListener('auxclick', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.button === 1 && !ev.target.closest('[data-os-ler]')) abrir(tr, true); });
  tbody.addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.key === 'Enter' && ev.target === tr) abrir(tr, false); });
  [fBusca, fReag, fConf].forEach((el) => el.addEventListener('input', render));
  btLimpar.addEventListener('click', () => { fBusca.value = ''; fReag.value = ''; fConf.value = ''; aba = 'todas'; render(); });

  document.getElementById('csv').addEventListener('click', () => {
    V.baixarCsv('niogen_instalacoes', ['Cliente', 'Bairro', 'Cidade', 'Nº da OS', 'OS gerada em', 'Status', 'Status na Nio', 'Instalação', 'Turno', 'Instalada em', 'Reagendamentos', 'Motivos', 'Cliente confirmou', 'Lido na Nio'],
      filtradas().map((v) => { const s = st(v), o = os(v) || {}, r = reag[v.id] || [], dd = dia(v);
        return [v.cliente_nome, v.bairro, v.cidade, v.nio_os, NG.fmtDataHora(V.dataOS(v)), V.STATUS_POR[s].nome, V.textoNio(o), dd ? NG.fmtDiaISO(dd) : '', V.turno(v, o), v.instalado_em ? NG.fmtData(v.instalado_em) : '',
          r.length, r.map((x) => `${dm(x.de)} → ${dm(x.para)}: ${x.motivo || 'a Nio não informou o motivo'}`).join(' | '),
          aberta(v) && dd ? ({ confirmou: 'Confirmou', remarcar: 'Pediu para remarcar', nada: 'Não respondeu' })[respDe(v)] : '', o.referencia_em ? NG.fmtDataHora(o.referencia_em) : '']; }));
  });

  NGFicha.aoMudar(() => carregar());
  NG.botaoAtualizar(() => carregar());
  await carregar();
  NGFicha.iniciar();
  NG.aoVoltarAba(() => carregar());   // trocar de aba só recarrega depois de 1 min
})();
</script>
</body>
</html>
