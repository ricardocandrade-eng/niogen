<!doctype html>
<!-- NIOGEN | docs/index.html | 03/11/2026 — login (Supabase Auth e-mail/senha) → painel.html (backoffice → fila.html desde 09/11, 0082)
     08/11 (Onda 1.3): link do convite e de "esqueci a senha" abre aqui → "Crie sua senha" (a pessoa digita a própria senha;
     updateUser). Convidado sem acesso liberado ouve "falta o admin liberar" em vez de cair no erro de perfil. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Entrar · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=131126-26">
<script>
  // Antes do supabase-js limpar o endereço: de onde veio o link (convite, recuperação) ou o erro dele (link vencido).
  (function () { const h = new URLSearchParams(location.hash.slice(1)); window.NG_LINK = { tipo: h.get('type'), erro: h.get('error_code') || h.get('error') }; })();
</script>
<script src="config.js?v=111126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=131126-27"></script>
</head>
<body>
<main class="login">
  <form class="login-box" id="form-login" novalidate>
    <div class="marca">
      <span class="kicker">Dharma Telecom · Nio</span>
      <h1>NIO<span>GEN</span></h1>
      <p>Renascer. Reconstruir. Crescer.</p>
    </div>
    <label class="campo">E-mail<input type="email" name="email" autocomplete="username" required></label>
    <label class="campo">Senha<input type="password" name="senha" autocomplete="current-password" required></label>
    <div class="msg" id="msg" role="alert"></div>
    <button type="submit" class="btn btn-acc btn-block">Entrar</button>
    <button type="button" class="btn btn-ghost btn-block" id="esqueci">Esqueci minha senha</button>
  </form>
  <form class="login-box" id="form-senha" novalidate hidden>
    <div class="marca">
      <span class="kicker">Dharma Telecom · Nio</span>
      <h1>NIO<span>GEN</span></h1>
      <p id="senha-sub">Crie sua senha para entrar.</p>
    </div>
    <label class="campo">Nova senha<input type="password" name="senha" autocomplete="new-password" minlength="8" required></label>
    <label class="campo">Repita a senha<input type="password" name="senha2" autocomplete="new-password" minlength="8" required></label>
    <div class="msg" id="msg-senha" role="alert"></div>
    <button type="submit" class="btn btn-acc btn-block">Salvar senha e entrar</button>
  </form>
</main>
<script>
(async function () {
  // 0082: o backoffice entra pela Fila "Live"; os outros pelo Painel.
  async function telaInicial() {
    try { const { data } = await NG.sb.rpc('meu_perfil'); return data === 'backoffice' ? 'fila.html' : 'painel.html'; } catch (e) { return 'painel.html'; }
  }
  const msg = document.getElementById('msg');
  const erro = new URLSearchParams(location.search).get('erro');
  const link = window.NG_LINK || {};
  if (erro === 'perfil') msg.textContent = 'Usuário sem perfil ativo no NIOGEN. Fale com o admin.';
  else if (erro) msg.textContent = `Não foi possível carregar seu perfil: ${erro}`;
  else if (link.erro) msg.textContent = /expired/i.test(link.erro)
    ? 'Esse link venceu. Peça um convite novo ao admin ou use "Esqueci minha senha".'
    : 'Não deu para usar esse link. Peça um novo ao admin ou use "Esqueci minha senha".';
  const { data } = await NG.sb.auth.getSession();

  // Link do convite ou de "esqueci a senha": a sessão veio pelo endereço → a pessoa cria a própria senha.
  const fs = document.getElementById('form-senha');
  if (data.session && ['invite', 'recovery', 'signup', 'magiclink'].includes(link.tipo)) {
    document.getElementById('form-login').hidden = true;
    fs.hidden = false;
    document.getElementById('senha-sub').textContent = link.tipo === 'recovery'
      ? `Escolha uma senha nova para ${data.session.user.email}.` : `Bem-vindo! Crie sua senha para ${data.session.user.email}.`;
    fs.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const m = document.getElementById('msg-senha');
      const s1 = fs.senha.value, s2 = fs.senha2.value;
      if (s1.length < 8) { m.textContent = 'A senha precisa ter pelo menos 8 caracteres.'; return; }
      if (s1 !== s2) { m.textContent = 'As duas senhas não são iguais.'; return; }
      const btn = fs.querySelector('button');
      btn.disabled = true;
      const { error } = await NG.sb.auth.updateUser({ password: s1 });
      if (error) { btn.disabled = false; m.textContent = /weak|pwned|leaked/i.test(error.message) ? 'Essa senha é fraca ou já vazou em outro site. Escolha outra.' : error.message; return; }
      // Convidado ainda inativo não lê a própria linha (RLS) → avisa em vez de cair no erro de perfil.
      const { data: u } = await NG.sb.from('usuarios').select('ativo').eq('id', data.session.user.id).maybeSingle();
      if (u && u.ativo) { location.replace(await telaInicial()); return; }
      await NG.sb.auth.signOut();
      fs.hidden = true;
      document.getElementById('form-login').hidden = false;
      msg.textContent = 'Senha criada ✅ Falta o admin liberar o seu acesso — avise o Ricardo e depois entre com o e-mail e a senha.';
    });
    return;
  }
  if (data.session && !msg.textContent) location.replace(await telaInicial());

  document.getElementById('esqueci').addEventListener('click', async () => {
    const email = document.querySelector('#form-login [name=email]').value.trim();
    if (!email) { msg.textContent = 'Escreva seu e-mail acima e clique de novo em "Esqueci minha senha".'; return; }
    const { error } = await NG.sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    msg.textContent = error
      ? (/rate|seconds/i.test(error.message) ? 'Já mandamos um link há pouco. Espere um minuto e tente de novo.' : error.message)
      : 'Se esse e-mail tiver acesso ao NIOGEN, chegou um link para criar a senha nova.';
  });

  document.getElementById('form-login').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const f = ev.target;
    msg.textContent = '';
    const btn = f.querySelector('button');
    btn.disabled = true;
    const { error } = await NG.sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value });
    btn.disabled = false;
    if (error) {
      msg.textContent = /invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : error.message;
      return;
    }
    location.replace(await telaInicial());
  });
})();
</script>
</body>
</html>
