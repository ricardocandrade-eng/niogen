<!doctype html>
<!-- NIOGEN | docs/instalacoes.html | 03/11/2026 · 05/11 rodada noturna — Instalações no padrão de telas.
     KPIs (A agendar · Agendadas hoje · Atrasadas · Instaladas no período), abas com contagem, busca + Período + Vendedor + Bairro,
     lista em largura total (Cliente · Quando · Plano · Vendedor · Próximo passo), cartões no celular; clique → ficha da venda (gaveta).
     Dados: v_funil (todas as vendas vendidas; a v_instalacoes só guarda 7 dias de instaladas e não serve ao Período).
     O Período vale para "Instaladas" (pela data da instalação); o que está pendente aparece sempre, para nada urgente sumir.
     10/11 (0112, regra 18): caixas Comissão a liberar · Amanhã · Confirmaram a visita (v_instalacao_confirmacao: botão Tudo certo/Confirmo ×
     Preciso remarcar) · Instaladas no mês (R$ confirmado pelo OSAB); aviso "OSAB lido há N h" (osab_alerta_horas/osab_critico_horas);
     tabela sem Vendedor/Origem/Bairro, com Comissão e Confirmou?; pendência com visita hoje/amanhã em âmbar; bloco "Depois de
     instalada — proteger a receita" (1ª fatura · reativação ≤ 30 d · plano menor · M-10). ?exemplo=1 mostra um cartão de EXEMPLO. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Instalações · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=121126-28">
<script src="config.js?v=111126-12"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=121126-28"></script>
<script src="assets/sidebar.js?v=121126-24"></script>
<script src="assets/conversa.js?v=121126-27"></script>
<script src="assets/ficha.js?v=121126-28"></script>
</head>
<body>
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="instalacoes"></nav>
  <main class="main">
    <header class="cab">
      <div>
        <h1>Instalações</h1>
        <div class="sub">Do pedido no portal até a instalação · a Nio mede: agendar em até 4 h e instalar de primeira</div>
      </div>
      <div class="cab-acoes" id="cab-acoes"></div>
    </header>

    <section class="kpis quatro" id="kpis" aria-label="Resumo"></section>

    <div id="abas"></div>

    <div class="barra-filtros">
      <label class="busca"><span aria-hidden="true">⌕</span><input type="search" id="f-busca" aria-label="Buscar instalação" placeholder="Buscar por nome, CPF/CNPJ, telefone, pedido ou bairro"></label>
      <select class="sel" id="f-origem" aria-label="Origem"></select>
      <select class="sel" id="f-vendedor" aria-label="Vendedor"></select>
      <select class="sel" id="f-bairro" aria-label="Bairro"></select>
      <span id="f-periodo" title="O período vale para as instaladas (data da instalação); o que está pendente aparece sempre"></span>
      <div class="dir"><button type="button" class="btn btn-ghost" id="exportar">⇩ Exportar</button></div>
    </div>

    <section class="lista padrao" aria-label="Lista de instalações">
      <div class="rolagem">
        <table class="tab">
          <thead><tr>
            <th data-ord="cliente">Cliente</th>
            <th data-ord="quando">Quando</th>
            <th data-ord="plano">Plano</th>
            <th data-ord="comissao" data-dir="desc" class="num" title="Comissão prevista (config de comissões) — previsão até a conciliação">Comissão</th>
            <th data-ord="confirmou" title="Resposta ao lembrete da véspera (Tudo certo / Preciso remarcar)">Confirmou?</th>
            <th>Próximo passo</th>
          </tr></thead>
          <tbody id="tbody"><tr><td colspan="6" class="vazio">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="rodape-lista"><span id="contagem"></span><span>Vendedor, origem e bairro: na ficha e nos filtros · clique na linha para abrir a ficha</span></div>
    </section>
    <div class="cartoes" id="cartoes" aria-label="Lista de instalações"></div>

    <!-- 0112: depois de instalada — proteger a receita (só aparece com instaladas nos últimos 10 meses; ?exemplo=1 mostra um cartão de EXEMPLO) -->
    <section class="protecao" id="protecao" hidden aria-label="Depois de instalada — proteger a receita"></section>
  </main>
</div>
<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  NGSidebar.montar();

  // Importar OSAB fica em Configurações › Importação (admin/backoffice).
  // 0112: ao lado, "⚠ OSAB lido há N h" (âmbar > osab_alerta_horas, vermelho > osab_critico_horas) — a comissão só conta quando o OSAB confirma.
  document.getElementById('cab-acoes').innerHTML = `<span class="osab-aviso" id="osab-aviso"></span>${['admin', 'backoffice'].includes(eu.perfil) ? '<a class="btn btn-acc acao-principal" href="configuracoes.html">⇪ Importar OSAB</a>' : ''}`;
  function renderOsab() {
    const el = document.getElementById('osab-aviso');
    const al = Number(regras.osab_alerta_horas ?? 24), cr = Number(regras.osab_critico_horas ?? 48);
    if (!osabEm) { el.className = 'osab-aviso bad'; el.textContent = '⚠ OSAB nunca importado'; el.title = 'A comissão só conta quando o OSAB confirma a instalação.'; return; }
    const h = (Date.now() - new Date(osabEm)) / 3600000;
    el.className = `osab-aviso ${h > cr ? 'bad' : h > al ? 'warn' : 'ok'}`;
    el.textContent = `${h > al ? '⚠ ' : ''}OSAB lido há ${h < 48 ? `${Math.floor(h)} h` : `${Math.floor(h / 24)} dias`}`;
    el.title = `Última importação do OSAB: ${NG.fmtDataHora(osabEm)}. A comissão só conta quando o OSAB confirma a instalação.`;
  }

  const tbody = document.getElementById('tbody');
  const cartoesEl = document.getElementById('cartoes');
  const fBusca = document.getElementById('f-busca');
  const fVendedor = document.getElementById('f-vendedor');
  const fOrigem = document.getElementById('f-origem');
  NG.preencherSelect(fOrigem, Object.entries(NG.ORIGENS), 'Todas as origens');
  const fBairro = document.getElementById('f-bairro');
  const per = NG.filtroPeriodo(document.getElementById('f-periodo'), { padrao: 'mes', aoMudar: render });
  let vendas = [], nomeCurto = {}, ultimoContato = {};
  let aba = 'todas';
  const ord = { chave: 'quando', dir: 1 };

  // 0096: biometria validada → abrir a OS (venda) → agendar. Os dois passos ficam na aba "OS / agendar" (prazo de 4 h da biometria).
  const VENDIDAS = ['0_qualificado', '1_vendido', '2_aguardando_instalacao', '3_instalado', '4_ativo_provisorio', '5_comissao_firme'];
  let jor = { porVenda: {} };
  // 0112: confirmação da véspera (v_instalacao_confirmacao), última leitura do OSAB (importacoes), prazos/limiares (config_regras)
  // e as faturas do M-10 (v_adimplencia — ainda não existe: sem extrato, o cartão diz "aguardando o extrato da Nio").
  let conf = {}, osabEm = null, regras = {}, faturasPor = null;
  const exemplo = new URLSearchParams(location.search).get('exemplo') === '1';
  async function carregar() {
    jor = await NG.jornada();
    const [rv, rp, rc, rk, ri, rg, ra] = await Promise.all([
      NG.sb.from('v_funil').select('*').in('status', VENDIDAS).order('vendido_em', { ascending: false }).limit(2000),
      NG.sb.from('config_planos').select('id, nome_curto'),
      NG.sb.from('contatos_cliente').select('venda_id, em').not('venda_id', 'is', null).order('em', { ascending: false }).limit(5000),
      NG.sb.from('v_instalacao_confirmacao').select('*'),
      NG.sb.from('importacoes').select('aplicado_em').eq('tipo', 'osab').not('aplicado_em', 'is', null).order('aplicado_em', { ascending: false }).limit(1),
      NG.sb.from('config_regras').select('chave, valor'),
      NG.sb.from('v_adimplencia').select('venda_id, faturas').limit(5000),
    ]);
    conf = Object.fromEntries(((rk && rk.data) || []).map((x) => [x.venda_id, x]));
    osabEm = ((ri && ri.data) || [])[0] ? ri.data[0].aplicado_em : null;
    regras = Object.fromEntries(((rg && rg.data) || []).map((x) => [x.chave, x.valor]));
    faturasPor = ra && !ra.error ? Object.fromEntries((ra.data || []).map((x) => [x.venda_id, x.faturas])) : null;
    renderOsab();
    if (rv.error) { NG.toast(NG.msgErro(rv.error), 'bad'); tbody.innerHTML = `<tr><td colspan="6" class="vazio">${esc(NG.msgErro(rv.error))}</td></tr>`; return; }
    vendas = (rv.data || []).filter((v) => v.status !== '0_qualificado' || NG.naBiometria(v));
    nomeCurto = Object.fromEntries((rp.data || []).map((p) => [p.id, p.nome_curto]));
    ultimoContato = NG.ultimosContatos(rc.data);
    const manter = (sel, valores, todos) => { const a = sel.value; NG.preencherSelect(sel, valores, todos); sel.value = valores.some(([v]) => v === a) ? a : ''; };
    const vend = [...new Map(vendas.filter((v) => v.vendedor_id).map((v) => [v.vendedor_id, v.vendedor_nome || '—'])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
    manter(fVendedor, vend, 'Todos os vendedores');
    manter(fBairro, [...new Set(vendas.map((v) => v.bairro).filter(Boolean))].sort().map((b) => [b, b]), 'Todos os bairros');
    render();
  }

  // Situação da instalação (uma por venda). Pendência da Nio ou data passada sem instalar = atrasada.
  function situacao(v) {
    const hoje = NG.diaSP();
    if (v.instalado_em) return 'instalada';
    if (v.nio_pendencia_cod || v.nio_pendencia_desc) return 'atrasada';
    if (v.status === '0_qualificado') return v.biometria_status === 'validada' ? 'agendar' : 'biometria';   // 0089: etapa 3
    if (v.status === '1_vendido' || !v.instalacao_agendada_para) return 'agendar';
    const d = NG.diaSP(v.instalacao_agendada_para);
    if (d < hoje) return 'atrasada';
    if (d === hoje) return 'hoje';
    return 'proximos';
  }
  // Próximo passo e "precisa de ação": a regra única (v_jornada, 0090) — a mesma do Live, do menu e do Funil.
  const proximo = (v) => NG.passoJornada(jor.porVenda[v.id]) || NG.proximoPasso(v, ultimoContato[v.id]);
  const precisaAcao = (v) => !!(jor.porVenda[v.id] ? jor.porVenda[v.id].precisa_acao : proximo(v).acao);
  // "OS + agendar há > 4 h" conta da biometria validada (v_funil.agendar_desde, 0089).
  const horasSemAgenda = (v) => { const desde = v.agendar_desde || v.biometria_validada_em || v.vendido_em; return desde ? (Date.now() - new Date(desde)) / 3600000 : 0; };

  // Busca + vendedor + bairro; o Período corta só as instaladas (data da instalação).
  function base() {
    const p = per.valor();
    const q = fBusca.value.trim().toLowerCase();
    const qd = NG.soDigitos(q);
    return vendas.filter((v) =>
      (situacao(v) !== 'instalada' || NG.noPeriodo(v.instalado_em, p)) &&
      (!fVendedor.value || v.vendedor_id === fVendedor.value) &&
      (!fOrigem.value || v.origem === fOrigem.value) &&
      (!fBairro.value || v.bairro === fBairro.value) &&
      (!q || [v.cliente_nome, v.bairro, v.cidade, v.nio_pedido].some((x) => String(x || '').toLowerCase().includes(q)) ||
        (qd.length >= 3 && [v.cliente_cpf_cnpj, v.cliente_whatsapp, v.nio_pedido].some((x) => NG.soDigitos(x).includes(qd)))));
  }
  const ABAS = [['todas', 'Todas'], ['acao', 'Precisam de ação'], ['biometria', 'Biometria pendente'], ['agendar', 'OS / agendar'], ['hoje', 'Hoje'], ['proximos', 'Próximos dias'], ['atrasada', 'Atrasadas'], ['instalada', 'Instaladas']];
  const naAba = (v, a) => (a === 'todas' ? true : a === 'acao' ? precisaAcao(v) : situacao(v) === a);

  // "Quando": a data que importa em cada situação (vendida → agendar; agendada → dia e período; instalada → dia).
  function quandoTxt(v) {
    const s = situacao(v);
    if (s === 'instalada') return { txt: `instalada ${NG.quando(v.instalado_em)}`, sub: v.docs_entregues_em ? 'docs entregues' : v.docs_prazo_em ? `docs até ${NG.fmtData(v.docs_prazo_em)}` : '' };
    // 0111: a etapa 3 é Biometria por crédito aprovado (sem número de pedido) — conta do crédito aprovado.
    if (s === 'biometria') { const l = v.credito_em || v.biometria_link_enviado_em; return { txt: l ? `crédito aprovado ${NG.quando(l)} ${NG.fmtHora(l)}` : 'crédito aprovado', sub: `há ${NG.haQuanto(l)} · esperando a biometria do cliente` }; }
    if (s === 'agendar') { const b = v.biometria_validada_em || v.vendido_em; return { txt: b ? `biometria ok ${NG.quando(b)} ${NG.fmtHora(b)}` : 'biometria ok', sub: `há ${NG.fmtHoras(horasSemAgenda(v))} · ${v.status === '0_qualificado' ? 'abrir a OS' : 'agendar a instalação'}` }; }
    const q = v.instalacao_agendada_para;
    return { txt: q ? `${NG.fmtDiaSemana(q)} ${NG.fmtData(q)}` : '—', sub: q ? NG.janela(q) : '' };
  }
  const quandoOrd = (v) => new Date(situacao(v) === 'instalada' ? v.instalado_em : situacao(v) === 'agendar' ? v.agendar_desde || v.vendido_em || v.criado_em
    : situacao(v) === 'biometria' ? v.credito_em || v.biometria_link_enviado_em || v.criado_em : v.instalacao_agendada_para).getTime();
  const planoCurto = (v) => nomeCurto[v.plano_id] || v.plano_nome || '—';
  const formaTxt = (v) => ({ cartao: 'cartão', boleto: 'boleto', dacc: 'débito' })[v.forma_pagamento] || '';
  const local = (v) => [v.bairro, v.cidade].filter(Boolean).join(' · ');
  const CHAVES = {
    cliente: (v) => v.cliente_nome || '',
    quando: (v) => quandoOrd(v),
    plano: (v) => planoCurto(v),
    vendedor: (v) => v.vendedor_nome || '',
    origem: (v) => NG.origemTxt(v),
    comissao: (v) => (v.comissao_prevista == null ? -1 : Number(v.comissao_prevista)),
    confirmou: (v) => ({ confirmou: 2, remarcar: 0 })[(conf[v.id] || {}).resposta] ?? 1,
  };

  // ---------- 0112 (regra 18): comissão a liberar · amanhã · confirmação da véspera · instaladas confirmadas pelo OSAB ----------
  const INST = ['3_instalado', '4_ativo_provisorio', '5_comissao_firme'];
  const fmtR = (x) => NG.fmtMoeda(x).replace(/,00$/, '');
  const comPrev = (v) => (v.comissao_prevista == null ? null : Number(v.comissao_prevista));
  const somaCom = (l) => l.reduce((s, v) => s + (comPrev(v) || 0), 0);
  const diaAmanha = () => NG.diaSP(new Date(Date.now() + 86400000));
  const ehAmanha = (v) => !v.instalado_em && v.instalacao_agendada_para && NG.diaSP(v.instalacao_agendada_para) === diaAmanha();
  const ehHoje = (v) => !v.instalado_em && v.instalacao_agendada_para && NG.diaSP(v.instalacao_agendada_para) === NG.diaSP();
  // "Confirmou?": ✓ confirmou · ✕ pediu remarcar · "ainda não" (visita amanhã sem resposta) · — (sem visita amanhã/hoje).
  function confirmouTxt(v) {
    const c = conf[v.id] || {};
    if (c.resposta === 'confirmou') return { html: `<span class="conf ok" title="${esc(`“${c.resposta_texto || 'Tudo certo'}” ${NG.fmtDataHora(c.resposta_em)}`)}">✓ confirmou</span>` };
    if (c.resposta === 'remarcar') return { html: `<span class="conf bad" title="${esc(`“${c.resposta_texto || 'Preciso remarcar'}” ${NG.fmtDataHora(c.resposta_em)}`)}">✕ pediu remarcar</span>` };
    if (ehAmanha(v) || ehHoje(v)) {
      const lem = c.lembrete_em ? `lembrete ${NG.fmtHora(c.lembrete_em)}` : 'lembrete da véspera ainda não saiu';
      return { html: `<span class="conf warn">ainda não</span><small class="apagado" style="display:block">${esc(lem)}</small>` };
    }
    return { html: '<span class="conf dim">—</span>' };
  }

  function renderKpis() {
    const p = per.valor();
    const doFiltro = vendas.filter((v) => (!fVendedor.value || v.vendedor_id === fVendedor.value) && (!fOrigem.value || v.origem === fOrigem.value) && (!fBairro.value || v.bairro === fBairro.value));
    const agendadas = doFiltro.filter((v) => v.status === '2_aguardando_instalacao' && v.instalacao_agendada_para && !v.instalado_em);
    const amanha = doFiltro.filter(ehAmanha);
    const confirm = amanha.filter((v) => (conf[v.id] || {}).resposta === 'confirmou').length;
    const remarc = amanha.filter((v) => (conf[v.id] || {}).resposta === 'remarcar').length;
    const lembrou = amanha.filter((v) => (conf[v.id] || {}).lembrete_em).length;
    const inst = doFiltro.filter((v) => v.instalado_em && INST.includes(v.status) && NG.noPeriodo(v.instalado_em, p));
    const instOsab = inst.filter((v) => v.nio_osab_em && v.nio_venda_valida !== false);
    const nv = (x, um, varios) => `${NG.fmtNum(x)} ${x === 1 ? um : varios}`;
    const nomes = amanha.slice(0, 2).map((v) => `${NG.primeiroNome(v.cliente_nome)} · ${NG.janela(v.instalacao_agendada_para)}`).join(' · ');
    document.getElementById('kpis').innerHTML = [
      NG.kpi({ rot: 'Comissão a liberar', val: `<span class="ok-txt">${esc(fmtR(somaCom(agendadas)))}</span>`, cls: 'kpi-verde',
        nota: `${nv(agendadas.length, 'agendada', 'agendadas')} · previsão`, dica: 'Comissão prevista das instalações agendadas. Só vira comissão com a instalação confirmada pelo OSAB (e é previsão até a conciliação).' }),
      NG.kpi({ rot: 'Amanhã', val: `${NG.fmtNum(amanha.length)}${amanha.length ? ` <small>= ${esc(fmtR(somaCom(amanha)))}</small>` : ''}`,
        nota: amanha.length ? esc(nomes + (amanha.length > 2 ? ` · +${amanha.length - 2}` : '')) : 'nenhuma visita amanhã' }),
      NG.kpi({ rot: 'Confirmaram a visita', val: NG.fmtNum(confirm), de: amanha.length ? NG.fmtNum(amanha.length) : null, cls: amanha.length && confirm < amanha.length ? 'warn' : '',
        nota: !amanha.length ? 'sem visita amanhã' : remarc ? `${nv(remarc, 'pediu', 'pediram')} para remarcar → reagendar agora` : lembrou ? `lembrete da véspera saiu para ${NG.fmtNum(lembrou)}` : 'lembrete da véspera ainda não saiu',
        dica: 'Resposta ao botão do lembrete da véspera (nio_lembrete_instalacao: Tudo certo / Preciso remarcar) ou da confirmação do agendamento (Confirmo / Preciso remarcar).' }),
      NG.kpi({ rot: 'Instaladas no mês', val: NG.fmtNum(inst.length),
        nota: `${esc(fmtR(somaCom(instOsab)))} confirmado pelo OSAB${inst.length > instOsab.length ? ` · ${NG.fmtNum(inst.length - instOsab.length)} esperando o OSAB` : ''}` }),
    ].join('');
  }

  // Bloco "Depois de instalada — proteger a receita": 1ª fatura · reativação ≤ 30 d · plano menor ≤ 180 d · M-10 (10 bolinhas).
  function renderProtecao() {
    const el = document.getElementById('protecao');
    const pr = regras.protecao_receita || {};
    const reatD = Number(pr.reativacao_dias ?? 30), meses = Number(pr.janela_meses ?? 10);
    const limite = Date.now() - meses * 30.5 * 86400000;
    let lista = vendas.filter((v) => v.instalado_em && INST.includes(v.status) && new Date(v.instalado_em).getTime() >= limite)
      .sort((a, b) => new Date(b.instalado_em) - new Date(a.instalado_em));
    let ex = false;
    if (!lista.length && exemplo) {
      ex = true;
      const d = (n) => new Date(Date.now() - n * 86400000).toISOString();
      lista = [{ id: '', cliente_nome: 'Cliente Exemplo', cidade: 'Juiz de Fora', instalado_em: d(8), downgrade_ate: new Date(Date.now() + 172 * 86400000).toISOString(), bonus_m10_potencial: 150, status: '3_instalado' }];
    }
    if (!lista.length) { el.hidden = true; el.innerHTML = ''; return; }
    el.hidden = false;
    const cards = lista.map((v) => {
      const dias = Math.floor((Date.now() - new Date(v.instalado_em)) / 86400000);
      const faltaReat = reatD - dias;
      const fats = faturasPor ? faturasPor[v.id] : null;
      const bolas = NG.faturasBolas(fats || []);
      const b1 = bolas[0];
      let fat = '<span class="apagado">aguardando o extrato da Nio</span>', risco = '';
      if (fats && b1.f) {
        if (b1.e.cls === 'paga') fat = '<span class="ok-txt">✓ paga</span>';
        else if (b1.e.cls === 'avencer') { fat = `<span class="${b1.e.faltam <= 2 ? 'warn-txt' : ''}">vence em ${b1.e.faltam} d</span>`; if (b1.e.faltam <= 2) risco = 'warn'; }
        else { fat = `<span class="bad-txt">em aberto D+${b1.e.atraso}</span>`; risco = b1.e.atraso >= 5 ? 'bad' : 'warn'; }
      }
      const mes = Math.min(meses, Math.max(0, Math.floor(dias / 30.5)));
      const m10 = v.bonus_m10_potencial != null ? `${fmtR(v.bonus_m10_potencial)}` : '—';
      const reat = faltaReat > 0 ? `<span class="warn-txt">faltam ${faltaReat} d</span>` : '<span class="apagado">encerrou</span>';
      const down = v.downgrade_ate && new Date(v.downgrade_ate) > new Date() ? `até ${esc(NG.fmtData(v.downgrade_ate))}` : '<span class="apagado">encerrou</span>';
      return `<a class="prot-c ${risco}" ${v.id ? `href="#venda=${v.id}"` : ''}>
        ${ex ? '<span class="exemplo">EXEMPLO — não é dado real</span>' : ''}
        <span class="pn">${esc(NG.primeiroNome(v.cliente_nome))} <small>· ${esc(v.cidade || '—')} · instalada ${esc(NG.fmtData(v.instalado_em))}</small></span>
        <span class="pl"><span>1ª fatura</span>${fat}</span>
        <span class="pl"><span>Reativação ≤ ${reatD} d (estorno 100 %)</span>${reat}</span>
        <span class="pl"><span>Troca para plano menor (estorna a diferença)</span>${down}</span>
        <span class="pl"><span>M-10 · ${esc(m10)}</span><span>mês ${mes} de ${meses}</span></span>
        ${NG.faturasBolinhas(bolas)}
      </a>`;
    }).join('');
    el.innerHTML = `<h2>Depois de instalada — proteger a receita</h2>
      <div class="apagado" style="font-size:12px">Instaladas nos últimos ${meses} meses · prazos do contrato · ${faturasPor ? 'faturas do extrato da Nio' : 'sem extrato de faturas ainda: a 1ª fatura e as bolinhas aparecem quando o extrato for importado'}</div>
      <div class="prot-grade">${cards}</div>`;
  }

  function render() {
    const b = base();
    renderKpis();
    NG.abasPilulas(document.getElementById('abas'), ABAS.map(([id, nome]) => ({ id, nome, n: b.filter((v) => naAba(v, id)).length, alerta: id === 'acao' })),
      aba, (id) => { aba = id; render(); });
    const lista = NG.ordenar(b.filter((v) => naAba(v, aba)), CHAVES, ord);
    tbody.innerHTML = lista.length ? lista.map((v) => {
      const q = quandoTxt(v);
      // Pendência aberta em venda com instalação hoje ou amanhã: linha âmbar com o motivo (o botão é o próximo passo da ficha).
      const pend = (ehHoje(v) || ehAmanha(v)) && NG.pendencia(v) ? (v.pend_motivo_nome || v.pend_descricao || 'pendência aberta') : null;
      const c = comPrev(v);
      return `<tr class="clicavel${pend ? ' risco' : ''}" data-id="${v.id}" tabindex="0" title="Abrir a ficha">
        <td class="cli"><b>${esc(v.cliente_nome)}</b><small>${esc(v.cidade || '—')}</small></td>
        <td class="plano-c"><b>${esc(q.txt)}</b><small>${esc(q.sub)}</small></td>
        <td class="plano-c"><b>${esc(planoCurto(v))}</b><small>${esc([Number(v.valor_mensal) ? fmtR(v.valor_mensal) : null, formaTxt(v)].filter(Boolean).join(' · '))}</small></td>
        <td class="num"><b class="ok-txt">${c == null ? '—' : esc(fmtR(c))}</b></td>
        <td>${confirmouTxt(v).html}</td>
        <td>${NG.proxPasso(proximo(v))}${pend ? `<span class="pend-linha">⏸ ${esc(pend)} — resolver antes da visita</span>` : ''}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="6" class="vazio">Nenhuma instalação neste filtro</td></tr>`;
    cartoesEl.innerHTML = lista.length ? lista.map((v) => {
      const q = quandoTxt(v);
      return `<a class="cartao" href="#venda=${v.id}">
        <div class="cli"><b>${esc(v.cliente_nome)}</b><small>${esc(v.bairro || v.cidade || '—')}</small></div>
        <div class="valor">${esc(q.txt)}</div>
        <div class="l2"><span>${esc(planoCurto(v))}</span>${q.sub ? `<span>· ${esc(q.sub)}</span>` : ''}${v.origem === 'parceiro_pap' ? `<span>· ${esc(NG.origemTxt(v))}</span>` : ''}</div>
        <div class="l2">${NG.proxPasso(proximo(v))}</div>
      </a>`;
    }).join('') : '<div class="vazio">Nenhuma instalação neste filtro</div>';
    document.getElementById('contagem').textContent = `${NG.fmtNum(lista.length)} ${lista.length === 1 ? 'venda' : 'vendas'} no filtro`;
    renderProtecao();
  }

  NG.ligarOrdenacao(document.querySelector('.lista.padrao thead'), ord, render);
  [fBusca, fVendedor, fOrigem, fBairro].forEach((el) => el.addEventListener('input', render));
  tbody.addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr) NG.abrirVenda(tr.dataset.id, ev.ctrlKey || ev.metaKey); });
  tbody.addEventListener('auxclick', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.button === 1) NG.abrirVenda(tr.dataset.id, true); });
  tbody.addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.key === 'Enter') NG.abrirVenda(tr.dataset.id); });

  document.getElementById('exportar').addEventListener('click', () => {
    const SIT = { biometria: 'Biometria pendente', agendar: 'OS / agendar', hoje: 'Hoje', proximos: 'Próximos dias', atrasada: 'Atrasada', instalada: 'Instalada' };
    const linhas = NG.ordenar(base().filter((v) => naAba(v, aba)), CHAVES, ord);
    const q = (x) => `"${String(x ?? '').replace(/"/g, '""')}"`;
    const cab = ['Cliente', 'Situação', 'Agendada para', 'Instalada em', 'Plano', 'Vendedor', 'Origem', 'Bairro', 'Cidade', 'Pedido Nio', 'Pendência Nio'];
    const csv = [cab.map(q).join(';')].concat(linhas.map((v) => [v.cliente_nome, SIT[situacao(v)], v.instalacao_agendada_para ? NG.fmtDataHora(v.instalacao_agendada_para) : '',
      v.instalado_em ? NG.fmtDataHora(v.instalado_em) : '', planoCurto(v), v.vendedor_nome, NG.origemTxt(v), v.bairro, v.cidade, v.nio_pedido,
      [v.nio_pendencia_cod, v.nio_pendencia_desc].filter(Boolean).join(' · ')].map(q).join(';'))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `niogen_instalacoes_${NG.diaSP().replace(/-/g, '')}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  NGFicha.aoMudar(() => carregar());
  NG.botaoAtualizar(() => carregar());   // 09/11: dados frescos sem F5
  await carregar();
  NGFicha.iniciar();
})();
</script>
</body>
</html>
