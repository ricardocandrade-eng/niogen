<!doctype html>
<!-- NIOGEN | docs/instalacoes.html | 03/11/2026 · 05/11 rodada noturna — Instalações no padrão de telas.
     KPIs (A agendar · Agendadas hoje · Atrasadas · Instaladas no período), abas com contagem, busca + Período + Vendedor + Bairro,
     lista em largura total (Cliente · Quando · Plano · Vendedor · Próximo passo), cartões no celular; clique → ficha da venda (gaveta).
     Dados: v_funil (todas as vendas vendidas; a v_instalacoes só guarda 7 dias de instaladas e não serve ao Período).
     O Período vale para "Instaladas" (pela data da instalação); o que está pendente aparece sempre, para nada urgente sumir. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Instalações · NIOGEN</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=051126-4">
<script src="config.js?v=051126-4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/app.js?v=051126-4"></script>
<script src="assets/sidebar.js?v=051126-4"></script>
<script src="assets/ficha.js?v=051126-4"></script>
</head>
<body>
<div class="app">
  <nav class="nav" id="sidebar" data-pagina="instalacoes"></nav>
  <main class="main">
    <header class="cab">
      <div>
        <h1>Instalações</h1>
        <div class="sub">Do pedido no APP até a instalação · a Nio mede: agendar em até 4 h e instalar na 1ª visita</div>
      </div>
      <div class="cab-acoes" id="cab-acoes"></div>
    </header>

    <section class="kpis quatro" id="kpis" aria-label="Resumo"></section>

    <div id="abas"></div>

    <div class="barra-filtros">
      <label class="busca"><span aria-hidden="true">⌕</span><input type="search" id="f-busca" aria-label="Buscar instalação" placeholder="Buscar por nome, CPF/CNPJ, telefone, pedido ou bairro"></label>
      <select class="sel" id="f-vendedor" aria-label="Vendedor"></select>
      <select class="sel" id="f-bairro" aria-label="Bairro"></select>
      <span id="f-periodo" title="O período vale para as instaladas (data da instalação); o que está pendente aparece sempre"></span>
      <div class="dir"><button type="button" class="btn btn-ghost" id="exportar">⇩ Exportar</button></div>
    </div>

    <section class="lista padrao" aria-label="Lista de instalações">
      <div class="rolagem">
        <table class="tab">
          <thead><tr>
            <th data-ord="cliente">Cliente</th>
            <th data-ord="quando">Quando</th>
            <th data-ord="plano">Plano</th>
            <th data-ord="vendedor" class="col-media">Vendedor</th>
            <th>Próximo passo</th>
          </tr></thead>
          <tbody id="tbody"><tr><td colspan="5" class="vazio">Carregando…</td></tr></tbody>
        </table>
      </div>
      <div class="rodape-lista"><span id="contagem"></span><span>Clique na linha para abrir a ficha</span></div>
    </section>
    <div class="cartoes" id="cartoes" aria-label="Lista de instalações"></div>
  </main>
</div>
<script>
(async function () {
  const { esc } = NG;
  const eu = await NG.exigirLogin();
  NGSidebar.montar();

  // Importar OSAB fica em Configurações › Importação (admin/backoffice).
  if (['admin', 'backoffice'].includes(eu.perfil)) {
    document.getElementById('cab-acoes').innerHTML = '<a class="btn btn-acc acao-principal" href="configuracoes.html">⇪ Importar OSAB</a>';
  }

  const tbody = document.getElementById('tbody');
  const cartoesEl = document.getElementById('cartoes');
  const fBusca = document.getElementById('f-busca');
  const fVendedor = document.getElementById('f-vendedor');
  const fBairro = document.getElementById('f-bairro');
  const per = NG.filtroPeriodo(document.getElementById('f-periodo'), { padrao: 'mes', aoMudar: render });
  let vendas = [], nomeCurto = {}, ultimoContato = {};
  let aba = 'todas';
  const ord = { chave: 'quando', dir: 1 };

  const VENDIDAS = ['1_vendido', '2_aguardando_instalacao', '3_instalado', '4_ativo_provisorio', '5_comissao_firme'];
  async function carregar() {
    const [rv, rp, rc] = await Promise.all([
      NG.sb.from('v_funil').select('*').in('status', VENDIDAS).order('vendido_em', { ascending: false }).limit(2000),
      NG.sb.from('config_planos').select('id, nome_curto'),
      NG.sb.from('contatos_cliente').select('venda_id, em').not('venda_id', 'is', null).order('em', { ascending: false }).limit(5000),
    ]);
    if (rv.error) { NG.toast(NG.msgErro(rv.error), 'bad'); tbody.innerHTML = `<tr><td colspan="5" class="vazio">${esc(NG.msgErro(rv.error))}</td></tr>`; return; }
    vendas = rv.data || [];
    nomeCurto = Object.fromEntries((rp.data || []).map((p) => [p.id, p.nome_curto]));
    ultimoContato = NG.ultimosContatos(rc.data);
    const manter = (sel, valores, todos) => { const a = sel.value; NG.preencherSelect(sel, valores, todos); sel.value = valores.some(([v]) => v === a) ? a : ''; };
    const vend = [...new Map(vendas.filter((v) => v.vendedor_id).map((v) => [v.vendedor_id, v.vendedor_nome || '—'])).entries()].sort((a, b) => a[1].localeCompare(b[1]));
    manter(fVendedor, vend, 'Todos os vendedores');
    manter(fBairro, [...new Set(vendas.map((v) => v.bairro).filter(Boolean))].sort().map((b) => [b, b]), 'Todos os bairros');
    render();
  }

  // Situação da instalação (uma por venda). Pendência da Nio ou data passada sem instalar = atrasada.
  function situacao(v) {
    const hoje = NG.diaSP();
    if (v.instalado_em) return 'instalada';
    if (v.nio_pendencia_cod || v.nio_pendencia_desc) return 'atrasada';
    if (v.status === '1_vendido' || !v.instalacao_agendada_para) return 'agendar';
    const d = NG.diaSP(v.instalacao_agendada_para);
    if (d < hoje) return 'atrasada';
    if (d === hoje) return 'hoje';
    return 'proximos';
  }
  // Próximo passo: o mesmo da ficha (NG.proximoPasso); a atrasada sem pendência ganha o texto daqui.
  function proximo(v) {
    const s = situacao(v);
    if (s === 'atrasada' && !(v.nio_pendencia_cod || v.nio_pendencia_desc)) {
      return { txt: `Passou de ${NG.fmtData(v.instalacao_agendada_para)} sem instalar · reagendar ou conferir OSAB`, nivel: 'bad', acao: true };
    }
    return NG.proximoPasso(v, ultimoContato[v.id]);
  }
  const precisaAcao = (v) => situacao(v) === 'atrasada' || !!proximo(v).acao;
  const horasSemAgenda = (v) => (v.horas_sem_agendamento != null ? Number(v.horas_sem_agendamento) : v.vendido_em ? (Date.now() - new Date(v.vendido_em)) / 3600000 : 0);

  // Busca + vendedor + bairro; o Período corta só as instaladas (data da instalação).
  function base() {
    const p = per.valor();
    const q = fBusca.value.trim().toLowerCase();
    const qd = NG.soDigitos(q);
    return vendas.filter((v) =>
      (situacao(v) !== 'instalada' || NG.noPeriodo(v.instalado_em, p)) &&
      (!fVendedor.value || v.vendedor_id === fVendedor.value) &&
      (!fBairro.value || v.bairro === fBairro.value) &&
      (!q || [v.cliente_nome, v.bairro, v.cidade, v.nio_pedido].some((x) => String(x || '').toLowerCase().includes(q)) ||
        (qd.length >= 3 && [v.cliente_cpf_cnpj, v.cliente_whatsapp, v.nio_pedido].some((x) => NG.soDigitos(x).includes(qd)))));
  }
  const ABAS = [['todas', 'Todas'], ['acao', 'Precisam de ação'], ['agendar', 'A agendar'], ['hoje', 'Hoje'], ['proximos', 'Próximos dias'], ['atrasada', 'Atrasadas'], ['instalada', 'Instaladas']];
  const naAba = (v, a) => (a === 'todas' ? true : a === 'acao' ? precisaAcao(v) : situacao(v) === a);

  // "Quando": a data que importa em cada situação (vendida → agendar; agendada → dia e período; instalada → dia).
  function quandoTxt(v) {
    const s = situacao(v);
    if (s === 'instalada') return { txt: `instalada ${NG.quando(v.instalado_em)}`, sub: v.docs_entregues_em ? 'docs entregues' : v.docs_prazo_em ? `docs até ${NG.fmtData(v.docs_prazo_em)}` : '' };
    if (s === 'agendar') return { txt: v.vendido_em ? `vendida ${NG.quando(v.vendido_em)} ${NG.fmtHora(v.vendido_em)}` : 'vendida', sub: `há ${NG.fmtHoras(horasSemAgenda(v))} sem agenda` };
    const q = v.instalacao_agendada_para;
    return { txt: q ? `${NG.fmtDiaSemana(q)} ${NG.fmtData(q)}` : '—', sub: q ? NG.janela(q) : '' };
  }
  const quandoOrd = (v) => new Date(situacao(v) === 'instalada' ? v.instalado_em : situacao(v) === 'agendar' ? v.vendido_em || v.criado_em : v.instalacao_agendada_para).getTime();
  const planoCurto = (v) => nomeCurto[v.plano_id] || v.plano_nome || '—';
  const formaTxt = (v) => ({ cartao: 'cartão', boleto: 'boleto', dacc: 'débito' })[v.forma_pagamento] || '';
  const local = (v) => [v.bairro, v.cidade].filter(Boolean).join(' · ');
  const CHAVES = {
    cliente: (v) => v.cliente_nome || '',
    quando: (v) => quandoOrd(v),
    plano: (v) => planoCurto(v),
    vendedor: (v) => v.vendedor_nome || '',
  };

  function renderKpis() {
    const hoje = NG.diaSP();
    const p = per.valor();
    const doFiltro = vendas.filter((v) => (!fVendedor.value || v.vendedor_id === fVendedor.value) && (!fBairro.value || v.bairro === fBairro.value));
    const agendar = doFiltro.filter((v) => situacao(v) === 'agendar');
    const mais4 = agendar.filter((v) => horasSemAgenda(v) > 4).length;
    const hojeL = doFiltro.filter((v) => situacao(v) === 'hoje');
    const manha = hojeL.filter((v) => NG.janela(v.instalacao_agendada_para) === '8–12h').length;
    const atras = doFiltro.filter((v) => situacao(v) === 'atrasada');
    const pend = atras.filter((v) => v.nio_pendencia_cod || v.nio_pendencia_desc).length;
    const inst = doFiltro.filter((v) => v.instalado_em && NG.noPeriodo(v.instalado_em, p));
    const dias = inst.filter((v) => v.vendido_em).map((v) => (new Date(v.instalado_em) - new Date(v.vendido_em)) / 86400000).sort((a, b) => a - b);
    const mediana = dias.length ? (dias.length % 2 ? dias[(dias.length - 1) / 2] : (dias[dias.length / 2 - 1] + dias[dias.length / 2]) / 2) : null;
    const instHoje = doFiltro.filter((v) => v.instalado_em && NG.diaSP(v.instalado_em) === hoje).length;
    document.getElementById('kpis').innerHTML = [
      NG.kpi({ rot: 'A agendar', val: NG.fmtNum(agendar.length), cls: mais4 ? 'bad' : agendar.length ? 'warn' : '',
        nota: mais4 ? `${NG.fmtNum(mais4)} há mais de 4 h` : agendar.length ? 'dentro do prazo de 4 h' : 'nenhuma esperando agenda',
        dica: 'Vendidas (pedido + biometria) sem data de instalação. Contrato: agendar em até 4 h depois da venda.' }),
      NG.kpi({ rot: 'Agendadas hoje', val: NG.fmtNum(hojeL.length), nota: hojeL.length ? `${NG.fmtNum(manha)} manhã · ${NG.fmtNum(hojeL.length - manha)} tarde${instHoje ? ` · ${NG.fmtNum(instHoje)} já instalada${instHoje === 1 ? '' : 's'}` : ''}` : instHoje ? `${NG.fmtNum(instHoje)} instalada${instHoje === 1 ? '' : 's'} hoje` : 'nenhuma para hoje' }),
      NG.kpi({ rot: 'Atrasadas', val: NG.fmtNum(atras.length), cls: atras.length ? 'bad' : '',
        nota: atras.length ? `${NG.fmtNum(pend)} com pendência da Nio · ${NG.fmtNum(atras.length - pend)} passaram da data` : 'nenhuma',
        dica: 'Com pendência no OSAB (reagendar) ou com a data agendada já passada sem instalação registrada.' }),
      NG.kpi({ rot: 'Instaladas no período', val: NG.fmtNum(inst.length),
        nota: mediana == null ? esc(per.rotulo.toLowerCase()) : `mediana venda → instalação ${mediana.toLocaleString('pt-BR', { maximumFractionDigits: 1 })} dias` }),
    ].join('');
  }

  function render() {
    const b = base();
    renderKpis();
    NG.abasPilulas(document.getElementById('abas'), ABAS.map(([id, nome]) => ({ id, nome, n: b.filter((v) => naAba(v, id)).length, alerta: id === 'acao' })),
      aba, (id) => { aba = id; render(); });
    const lista = NG.ordenar(b.filter((v) => naAba(v, aba)), CHAVES, ord);
    tbody.innerHTML = lista.length ? lista.map((v) => {
      const q = quandoTxt(v);
      return `<tr class="clicavel" data-id="${v.id}" tabindex="0" title="Abrir a ficha">
        <td class="cli"><b>${esc(v.cliente_nome)}</b><small>${esc(local(v) || '—')}</small></td>
        <td class="plano-c"><b>${esc(q.txt)}</b><small>${esc(q.sub)}</small></td>
        <td class="plano-c"><b>${esc(planoCurto(v))}</b><small>${esc(formaTxt(v))}</small></td>
        <td class="col-media">${esc(v.vendedor_nome || '—')}</td>
        <td>${NG.proxPasso(proximo(v))}</td>
      </tr>`;
    }).join('') : `<tr><td colspan="5" class="vazio">Nenhuma instalação neste filtro</td></tr>`;
    cartoesEl.innerHTML = lista.length ? lista.map((v) => {
      const q = quandoTxt(v);
      return `<a class="cartao" href="#venda=${v.id}">
        <div class="cli"><b>${esc(v.cliente_nome)}</b><small>${esc(v.bairro || v.cidade || '—')}</small></div>
        <div class="valor">${esc(q.txt)}</div>
        <div class="l2"><span>${esc(planoCurto(v))}</span>${q.sub ? `<span>· ${esc(q.sub)}</span>` : ''}</div>
        <div class="l2">${NG.proxPasso(proximo(v))}</div>
      </a>`;
    }).join('') : '<div class="vazio">Nenhuma instalação neste filtro</div>';
    document.getElementById('contagem').textContent = `${NG.fmtNum(lista.length)} ${lista.length === 1 ? 'venda' : 'vendas'} no filtro`;
  }

  NG.ligarOrdenacao(document.querySelector('.lista.padrao thead'), ord, render);
  [fBusca, fVendedor, fBairro].forEach((el) => el.addEventListener('input', render));
  tbody.addEventListener('click', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr) NG.abrirVenda(tr.dataset.id, ev.ctrlKey || ev.metaKey); });
  tbody.addEventListener('auxclick', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.button === 1) NG.abrirVenda(tr.dataset.id, true); });
  tbody.addEventListener('keydown', (ev) => { const tr = ev.target.closest('tr[data-id]'); if (tr && ev.key === 'Enter') NG.abrirVenda(tr.dataset.id); });

  document.getElementById('exportar').addEventListener('click', () => {
    const SIT = { agendar: 'A agendar', hoje: 'Hoje', proximos: 'Próximos dias', atrasada: 'Atrasada', instalada: 'Instalada' };
    const linhas = NG.ordenar(base().filter((v) => naAba(v, aba)), CHAVES, ord);
    const q = (x) => `"${String(x ?? '').replace(/"/g, '""')}"`;
    const cab = ['Cliente', 'Situação', 'Agendada para', 'Instalada em', 'Plano', 'Vendedor', 'Bairro', 'Cidade', 'Pedido Nio', 'Pendência Nio'];
    const csv = [cab.map(q).join(';')].concat(linhas.map((v) => [v.cliente_nome, SIT[situacao(v)], v.instalacao_agendada_para ? NG.fmtDataHora(v.instalacao_agendada_para) : '',
      v.instalado_em ? NG.fmtDataHora(v.instalado_em) : '', planoCurto(v), v.vendedor_nome, v.bairro, v.cidade, v.nio_pedido,
      [v.nio_pendencia_cod, v.nio_pendencia_desc].filter(Boolean).join(' · ')].map(q).join(';'))).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
    a.download = `niogen_instalacoes_${NG.diaSP().replace(/-/g, '')}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  });

  NGFicha.aoMudar(() => carregar());
  await carregar();
  NGFicha.iniciar();
})();
</script>
</body>
</html>
