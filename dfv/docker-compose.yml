# NIOGEN | dfv/docker-compose.yml | 11/11/2026 — Claude Code (docs/Prompt_operador_dfv_cobertura_111126_1520.md)
# VPS DO n8n (45.32.161.130), pasta /opt/niogen/dfv/. O painel DFV é app.powerbi.com (sem bloqueio de IP).
# Segredos em /opt/niogen/dfv/.env (chmod 600, fora do repo): DFV_URL, SDE_USUARIO, SDE_SENHA1, SDE_SENHA2, DFV_OP_TOKEN.
# Sem porta publicada: o Caddy da rede renata_web chega em niogen-dfv:8091 pela rota
# https://n8n.ofertasverointernet.com.br/niogen-dfv/* (o operador ainda exige o Bearer DFV_OP_TOKEN).
services:
  niogen-dfv:
    build: .
    image: niogen-dfv:1
    container_name: niogen-dfv
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
    networks: [renata_web]
    shm_size: 256m
    mem_limit: 900m
    memswap_limit: 1400m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
networks:
  renata_web:
    external: true
