# NIOGEN | portal/tunel/docker-compose.yml | 05/11/2026 — Claude Code (prompt nº 16)
# VPS DO n8n (45.32.161.130). Túnel SSH até o operador na VPS do Brasil: o n8n chama
# http://niogen-portal-tunel:8090 na rede renata_web; nada fica exposto na internet.
# Chave própria (/opt/niogen/portal-tunel/id_ed25519, chmod 600); na VPS BR ela só pode abrir 127.0.0.1:8090
# (authorized_keys com permitopen, no-pty, command="/bin/false").
services:
  niogen-portal-tunel:
    image: alpine:3.20
    container_name: niogen-portal-tunel
    restart: unless-stopped
    networks: [renata_web]
    volumes:
      - /opt/niogen/portal-tunel:/chave:ro
    environment:
      VPS_BR: ${VPS_BR:?defina VPS_BR=ip-da-vps-brasil no .env ao lado}
    # Uma linha só: no bloco ">" do YAML, linhas mais recuadas mantêm a quebra e o sh as lê como comandos (11/11).
    command: ["sh", "-c", "apk add --no-cache openssh-client >/dev/null && while true; do ssh -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/chave/known_hosts -i /chave/id_ed25519 -L 0.0.0.0:8090:127.0.0.1:8090 tunel@$$VPS_BR; echo 'túnel caiu, reabrindo em 10 s'; sleep 10; done"]
networks:
  renata_web:
    external: true
